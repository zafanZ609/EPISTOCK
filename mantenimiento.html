<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --steel-900:#111827;
    --steel-800:#1f2937;
    --steel-700:#374151;
    --steel-600:#4b5563;
    --steel-400:#9ca3af;
    --steel-200:#e5e7eb;
    --steel-100:#f3f4f6;
    --steel-50:#f9fafb;
    --amber:#f59e0b;
    --amber-dark:#b45309;
    --amber-50:#fffbeb;
    --green:#16a34a;
    --red:#dc2626;
    --red-50:#fef2f2;
    --blue:#2563eb;
    --radius:12px;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 1px 3px rgba(17,24,39,.08);
    --shadow-lg:0 10px 25px -5px rgba(17,24,39,.15), 0 8px 10px -6px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--steel-100);
    color:var(--steel-900);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--steel-900) 0%,var(--steel-800) 45%,var(--steel-700) 100%);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:400px;background:#fff;border-radius:16px;
    box-shadow:var(--shadow-lg);padding:32px 28px;
  }
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
  .login-brand img{width:56px;height:56px;object-fit:contain;border-radius:10px;}
  .login-brand .empresa{font-size:12.5px;color:var(--steel-600);font-weight:600;letter-spacing:.02em;}
  .login-brand h1{font-size:22px;font-weight:800;margin:0;color:var(--steel-900);}
  .login-brand .sub{font-size:13px;color:var(--amber-dark);font-weight:600;background:var(--amber-50);padding:2px 10px;border-radius:999px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--steel-700);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1.5px solid var(--steel-200);border-radius:9px;
    font-size:15px;color:var(--steel-900);outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:9px;padding:11px 18px;font-size:14.5px;font-weight:700;
    transition:filter .15s, transform .05s;width:100%;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--steel-900);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-amber{background:var(--amber);color:#1a1200;}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--steel-600);}
  .btn-ghost:hover{background:var(--steel-100);}
  .btn-outline{background:#fff;color:var(--steel-800);border:1.5px solid var(--steel-200);}
  .btn-outline:hover{border-color:var(--steel-400);}
  .btn-danger{background:var(--red-50);color:var(--red);}
  .btn-danger:hover{filter:brightness(0.98);}
  .btn-sm{width:auto;padding:7px 12px;font-size:13px;border-radius:7px;}
  .btn[disabled]{opacity:.5;pointer-events:none;}
  .login-alt{text-align:center;margin-top:16px;}
  .login-alt button{background:none;border:none;color:var(--steel-600);font-size:12.5px;text-decoration:underline;}
  .error-box{background:var(--red-50);color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .info-box{background:var(--amber-50);color:var(--amber-dark);border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .hint{font-size:12px;color:var(--steel-400);margin-top:4px;}

  /* ---------- Shell ---------- */
  header.topbar{
    background:var(--steel-900);color:#fff;padding:12px 18px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-left img{width:32px;height:32px;border-radius:7px;object-fit:contain;background:#fff;}
  .topbar-titles{line-height:1.2;min-width:0;}
  .topbar-titles .app-name{font-weight:800;font-size:15px;}
  .topbar-titles .empresa-name{font-size:11px;color:var(--steel-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:12.5px;background:var(--steel-800);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .logout-btn{background:transparent;border:1px solid var(--steel-700);color:var(--steel-200);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;}
  .logout-btn:hover{background:var(--steel-800);}

  nav.tabs{
    background:#fff;border-bottom:1px solid var(--steel-200);display:flex;gap:2px;padding:0 12px;
    overflow-x:auto;position:sticky;top:56px;z-index:15;
  }
  nav.tabs button{
    background:none;border:none;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--steel-600);
    border-bottom:3px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--steel-900);border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--steel-900);}

  main.content{flex:1;padding:20px 16px 60px;max-width:920px;margin:0 auto;width:100%;}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h2{font-size:15.5px;margin:0 0 14px;font-weight:700;color:var(--steel-900);}
  .card h3{font-size:13.5px;margin:0 0 10px;font-weight:700;color:var(--steel-700);}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--steel-400);margin:0 0 8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--steel-900);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
    z-index:100;display:flex;align-items:center;gap:8px;
  }
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}

  /* ---------- Wizard ---------- */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-btn{
    padding:9px 14px;border-radius:9px;border:1.5px solid var(--steel-200);background:#fff;
    font-size:13.5px;font-weight:600;color:var(--steel-700);
  }
  .chip-btn.selected{border-color:var(--amber);background:var(--amber-50);color:var(--amber-dark);}
  .tipo-row{display:flex;gap:10px;}
  .tipo-btn{
    flex:1;padding:14px;border-radius:10px;border:1.5px solid var(--steel-200);background:#fff;
    font-weight:700;font-size:14px;text-align:center;color:var(--steel-700);
  }
  .tipo-btn.preventivo.selected{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
  .tipo-btn.correctivo.selected{border-color:var(--red);background:var(--red-50);color:var(--red);}
  .tipo-btn.agua.selected{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
  .warning-banner{background:var(--red-50);border:1.5px solid var(--red);color:var(--red);font-weight:800;font-size:14px;text-align:center;padding:14px 16px;border-radius:10px;}

  .elemento-block{border:1px solid var(--steel-200);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .elemento-head{background:var(--steel-50);padding:11px 14px;font-weight:700;font-size:13.5px;color:var(--steel-800);}
  .elemento-body{padding:8px 14px 12px;}
  .tarea-node{margin:2px 0;}
  .tarea-group-label{font-size:12.5px;font-weight:700;color:var(--steel-600);margin:8px 0 2px;padding-left:2px;}
  .tarea-check{display:flex;align-items:flex-start;gap:9px;padding:7px 2px;border-radius:7px;cursor:pointer;}
  .tarea-check:hover{background:var(--steel-50);}
  .tarea-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--amber-dark);flex-shrink:0;}
  .tarea-check .label{font-size:13.5px;color:var(--steel-900);}
  .tarea-check .meta{font-size:11.5px;color:var(--steel-400);margin-top:1px;}
  .tarea-children{margin-left:22px;border-left:2px solid var(--steel-100);padding-left:8px;}

  /* ---------- Wizard: navegación en cascada por niveles ---------- */
  .elemento-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .elemento-card{
    position:relative;padding:14px 18px;border-radius:10px;border:1.5px solid var(--steel-200);background:#fff;
    font-weight:700;font-size:14px;color:var(--steel-700);min-width:110px;text-align:center;
  }
  .elemento-card.active{border-color:var(--steel-900);background:var(--steel-900);color:#fff;}
  .elemento-card-badge{
    position:absolute;top:-7px;right:-7px;background:var(--amber);color:#1a1200;font-size:11px;font-weight:800;
    width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .nivel-browser{margin-top:16px;border:1px solid var(--steel-200);border-radius:10px;padding:14px;background:var(--steel-50);}
  .breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px;font-size:12.5px;}
  .breadcrumb button{background:none;border:none;color:var(--amber-dark);font-weight:700;font-size:12.5px;padding:2px 4px;}
  .breadcrumb button:last-child{color:var(--steel-900);}
  .breadcrumb .crumb-sep{color:var(--steel-400);}
  .nivel-list{display:flex;flex-direction:column;gap:8px;}
  .nivel-card{
    display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--steel-200);border-radius:10px;
    padding:10px 12px;text-align:left;width:100%;
  }
  .nivel-card.branch{padding:4px;gap:4px;}
  .nivel-card.branch:hover{border-color:var(--steel-400);}
  .nivel-card .chevron{color:var(--steel-400);font-size:18px;}
  .nivel-card-inner{flex:1;background:none;border:none;display:flex;align-items:center;justify-content:space-between;padding:8px 8px;font-weight:700;color:var(--steel-800);font-size:14px;text-align:left;border-radius:7px;}
  .nivel-card-inner:hover{background:var(--steel-50);}
  .pdf-btn{display:inline-flex;align-items:center;gap:4px;background:var(--steel-100);color:var(--steel-700);font-size:12px;font-weight:700;padding:8px 10px;border-radius:8px;text-decoration:none;flex-shrink:0;white-space:nowrap;}
  .pdf-btn:hover{background:var(--steel-200);}
  .stock-badge{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#f0fdf4;color:var(--green);}
  .stock-badge.low{background:var(--amber-50);color:var(--amber-dark);}
  .stock-badge.zero{background:var(--red-50);color:var(--red);}

  /* ---------- Selector de tipo de mantenimiento ---------- */
  .wiz-subheader{margin-bottom:2px;}
  .btn-back{background:none;border:none;color:var(--amber-dark);font-weight:700;font-size:12.5px;padding:0;}
  .tipo-mant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .tipo-mant-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:12px;border:1.5px solid var(--steel-200);background:#fff;font-weight:700;font-size:13px;color:var(--steel-700);text-align:center;}
  .tipo-mant-card:hover{border-color:var(--steel-400);}
  .tipo-mant-icon{font-size:28px;}
  .tipo-mant-label{line-height:1.25;}

  /* ---------- Checklist extintores ---------- */
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .checklist-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--steel-200);border-radius:9px;background:#fff;}
  .checklist-q{font-size:13.5px;color:var(--steel-900);flex:1;}
  .checklist-toggle{display:flex;gap:6px;flex-shrink:0;}
  .chk-btn{padding:6px 12px;border-radius:7px;border:1.5px solid var(--steel-200);background:#fff;font-size:12.5px;font-weight:700;color:var(--steel-600);}
  .chk-btn.si.active{border-color:var(--green);background:#f0fdf4;color:var(--green);}
  .chk-btn.no.active{border-color:var(--red);background:var(--red-50);color:var(--red);}
  .nivel-card.leaf{cursor:pointer;}
  .nivel-card.leaf:hover{border-color:var(--steel-400);}
  .nivel-card.leaf.selected{border-color:var(--amber);background:var(--amber-50);}
  .nivel-card.leaf input{width:17px;height:17px;accent-color:var(--amber-dark);flex-shrink:0;}
  .nivel-photo{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--steel-200);flex-shrink:0;}
  .nivel-photo.ph{display:flex;align-items:center;justify-content:center;background:var(--steel-100);font-size:18px;}
  .nivel-info{min-width:0;}
  .nivel-card-name{font-size:13.5px;font-weight:700;color:var(--steel-900);}
  .nivel-meta{font-size:11.5px;color:var(--steel-600);margin-top:1px;}
  .nivel-card.leaf-wrap{flex-direction:column;align-items:stretch;padding:4px;gap:0;cursor:default;}
  .nivel-card.leaf-wrap:hover{border-color:var(--steel-200);}
  .nivel-card.leaf-wrap.selected{border-color:var(--amber);background:var(--amber-50);}
  .leaf-toggle{display:flex;align-items:center;gap:10px;padding:8px 8px;cursor:pointer;width:100%;}
  .leaf-toggle input{width:17px;height:17px;accent-color:var(--amber-dark);flex-shrink:0;}
  .leaf-toggle .nivel-card-name{flex:1;}
  .repuesto-subpicker{padding:2px 8px 8px 32px;display:flex;flex-direction:column;gap:8px;}
  .repuesto-hint{font-size:11.5px;color:var(--steel-500);margin:0 0 2px 32px;}
  .nivel-card.branch.ronda-item.done{border-color:var(--green);background:#f0fdf4;}

  .selected-summary{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .sel-chip{background:var(--steel-900);color:#fff;font-size:12px;font-weight:600;padding:6px 8px 6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .sel-chip button{background:none;border:none;color:var(--steel-400);font-size:13px;padding:0;line-height:1;}
  .sel-chip button:hover{color:#fff;}

  textarea{width:100%;padding:10px 12px;border:1.5px solid var(--steel-200);border-radius:9px;font-size:14px;resize:vertical;min-height:70px;outline:none;}
  textarea:focus{border-color:var(--amber);}

  /* ---------- Registros / historial ---------- */
  .registro-card{border:1px solid var(--steel-200);border-radius:10px;padding:14px;margin-bottom:10px;}
  .registro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .registro-linea{font-weight:800;font-size:14.5px;color:var(--steel-900);}
  .registro-fecha{font-size:12px;color:var(--steel-400);}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.preventivo{background:#eff6ff;color:var(--blue);}
  .badge.correctivo{background:var(--red-50);color:var(--red);}
  .item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--steel-200);font-size:13px;}
  .item-row:first-of-type{border-top:none;}
  .item-row img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--steel-200);}
  .item-row .imgph{width:34px;height:34px;border-radius:6px;background:var(--steel-100);flex-shrink:0;}
  .item-text b{color:var(--steel-900);}
  .item-text .mini{color:var(--steel-400);font-size:11.5px;}
  .obs-line{font-size:12.5px;color:var(--steel-600);margin-top:8px;font-style:italic;}
  .worker-line{font-size:12px;color:var(--steel-400);margin-top:2px;}

  .filters-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filters-row select, .filters-row input{padding:8px 10px;border:1.5px solid var(--steel-200);border-radius:8px;font-size:13px;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel-400);padding:8px 10px;border-bottom:1.5px solid var(--steel-200);}
  table.admin-table td{padding:9px 10px;border-bottom:1px solid var(--steel-100);vertical-align:middle;}
  table.admin-table tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .hist-table{font-size:12.5px;}
  .hist-table th{white-space:nowrap;position:sticky;top:0;background:#fff;}
  .hist-table td{white-space:nowrap;color:var(--steel-800);}
  .hist-table td.obs-cell{white-space:normal;max-width:220px;color:var(--steel-600);}
  .hist-table tbody tr:nth-child(odd){background:var(--steel-50);}
  .hist-table tbody tr:hover{background:var(--amber-50);}
  .hist-thumb{width:26px;height:26px;object-fit:cover;border-radius:5px;border:1px solid var(--steel-200);display:block;}
  .inline-date{padding:5px 6px;border:1.5px solid var(--steel-200);border-radius:7px;font-size:12px;color:var(--steel-800);}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .pill.on{background:#f0fdf4;color:var(--green);}
  .pill.off{background:var(--steel-100);color:var(--steel-600);}

  .inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px;padding-top:12px;border-top:1px dashed var(--steel-200);}
  .inline-form .field{margin-bottom:0;min-width:140px;flex:1;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--steel-200);background:#fff;font-size:12.5px;font-weight:600;color:var(--steel-600);}
  .subtabs button.active{background:var(--steel-900);color:#fff;border-color:var(--steel-900);}

  .tree-node{margin:3px 0;}
  .tree-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:var(--steel-50);}
  .tree-row .name{font-size:13.5px;font-weight:600;flex:1;}
  .tree-row .meta{font-size:11px;color:var(--steel-400);}
  .tree-children{margin-left:20px;border-left:2px solid var(--steel-100);padding-left:10px;}
  .icon-btn{background:none;border:1px solid var(--steel-200);border-radius:6px;width:26px;height:26px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--steel-600);}
  .icon-btn:hover{background:#fff;border-color:var(--steel-400);}
  .task-edit-box{background:#fff;border:1px solid var(--steel-200);border-radius:9px;padding:10px;margin-top:6px;}
  .task-edit-box .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .task-edit-box input{padding:8px 9px;border:1.5px solid var(--steel-200);border-radius:7px;font-size:12.5px;flex:1;min-width:120px;}
  .thumb-preview{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--steel-200);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--steel-400);font-size:13.5px;}
  .spinner{width:26px;height:26px;border:3px solid var(--steel-200);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  @media (max-width:520px){
    .login-card{padding:26px 20px;}
    .topbar-titles .empresa-name{max-width:140px;}
  }
</style>
</head>
<body>
<div id="app"><div class="center-loading"><div class="spinner"></div></div></div>

<script>
/* ============================================================

  {code:'lineas_fabricacion', label:'Líneas de Fabricación', icon:'⚙️'},

  informatico: [{code:'erp',label:'ERP'},{code:'soporte',label:'Soporte Informático'}],

function tipoMantLabel(code){
  const t = TIPOS_MANTENIMIENTO.find(x=>x.code===code);
  return t ? t.label : code;
}
function subtipoLabelFor(tipo, subtipo){
  const map = SUBTIPOS[tipo] || [];
  const found = map.find(s=>s.code===subtipo);
  return found ? found.label : subtipo;
}

/* ============================================================
   UTILS
   ============================================================ */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtFechaHora(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('es-ES', {timeZone:'Europe/Madrid', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso; }
}
let toastTimer=null;
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  setTimeout(()=>el.remove(), 3200);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ============================================================
   AUTH / BOOTSTRAP
   ============================================================ */
async function loadEmpresa(){
  try{
    const {data} = await sb.from('empresa_config').select('*').eq('id',1).maybeSingle();
    state.empresa = data || null;
  }catch(e){ state.empresa = null; }
}

async function loadPerfilYTrabajador(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ state.perfil=null; state.trabajador=null; return; }
  const { data:perfil } = await sb.from('perfiles').select('rol, trabajador_id').eq('id', user.id).maybeSingle();
  state.perfil = perfil || null;
  if(perfil && perfil.trabajador_id){
    const { data:trab } = await sb.from('trabajadores').select('id, numero_empleado, nombre').eq('id', perfil.trabajador_id).maybeSingle();
    state.trabajador = trab || null;
  } else {
    state.trabajador = null;
  }
}

async function bootstrap(){
  await loadEmpresa();
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session){ await loadPerfilYTrabajador(); }
  state.ready = true;
  render();
}

sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if(session){
    await loadPerfilYTrabajador();
  } else {
    state.perfil = null; state.trabajador = null;
    state.loginStep='numero'; state.loginMode='trabajador'; state.loginNumero=''; state.loginError='';
  }
  render();
});

async function logout(){
  await sb.auth.signOut();
  state.tab='nuevo';
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!state.ready){ app.innerHTML = '<div class="center-loading"><div class="spinner"></div></div>'; return; }
  if(!state.session){ app.innerHTML = renderLogin(); bindLoginEvents(); return; }
  if(!state.perfil){ app.innerHTML = '<div class="center-loading"><div class="spinner"></div></div>'; return; }
  app.innerHTML = renderShell();
  bindShellEvents();
}

  const nombreEmpresa = empresa ? esc(empresa.nombre) : '';

        </div>
        ${state.loginError?`<div class="error-box">${esc(state.loginError)}</div>`:''}
        <button class="btn btn-primary" id="btn-continuar" ${state.loginLoading?'disabled':''}>${state.loginLoading?'Comprobando…':'Continuar'}</button>
        <div class="login-alt"><button id="btn-modo-admin">Acceso administrador</button></div>
      `;
    } else if(state.loginStep==='crear'){

        <div class="info-box">Hola ${esc(state.loginNombrePreview)}, es tu primer acceso. Crea una contraseña para registrar tus mantenimientos.</div>

    } else if(state.loginStep==='password'){

        <div class="field"><label>Contraseña</label><input id="in-pass" type="password" autofocus></div>

function bindLoginEvents(){
  const $ = id => document.getElementById(id);
  if(state.loginMode==='trabajador' && state.loginStep==='numero'){
    $('btn-modo-admin').onclick = ()=>{ state.loginMode='admin'; state.loginError=''; render(); };

    $('btn-volver').onclick = ()=>{ state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-crear').onclick = onCrearPassword;

    $('btn-volver').onclick = ()=>{ state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-entrar').onclick = onEntrarPassword;
    $('in-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') onEntrarPassword(); });
  } else if(state.loginMode==='admin'){
    $('btn-modo-trabajador').onclick = ()=>{ state.loginMode='trabajador'; state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-admin-entrar').onclick = onAdminEntrar;

async function onContinuarNumero(){
  const numero = (document.getElementById('in-numero').value || '').trim();
  if(!numero){ state.loginError='Introduce tu número de empleado.'; render(); return; }
  state.loginNumero = numero;
  state.loginLoading = true; state.loginError=''; render();
  try{
    const { data, error } = await sb.rpc('trabajador_estado', { p_numero_empleado: numero });
    state.loginLoading = false;
    if(error){ state.loginError = 'No se pudo comprobar el número de empleado.'; render(); return; }
    if(!data || !data.existe){ state.loginError = 'Número de empleado no encontrado o inactivo.'; render(); return; }
    state.loginNombrePreview = data.nombre || '';
    if(data.tiene_password){ state.loginStep='password'; } else { state.loginStep='crear'; }
    render();
  }catch(e){
    state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render();
  }
}

async function onCrearPassword(){
  const p1 = document.getElementById('in-pass1').value;
  const p2 = document.getElementById('in-pass2').value;
  if(!p1 || p1.length<6){ state.loginError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(p1!==p2){ state.loginError='Las contraseñas no coinciden.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  try{
    const { data:signUpData, error:signUpErr } = await sb.auth.signUp({ email, password:p1 });
    if(signUpErr){ state.loginLoading=false; state.loginError = signUpErr.message.includes('already') ? 'Ya existe una cuenta para este número de empleado.' : signUpErr.message; render(); return; }
    const { error:vincErr } = await sb.rpc('vincular_trabajador', { p_numero_empleado: state.loginNumero });
    if(vincErr){ state.loginLoading=false; state.loginError = 'No se pudo vincular tu cuenta: '+vincErr.message; render(); return; }
    if(!signUpData.session){
      const { error:signInErr } = await sb.auth.signInWithPassword({ email, password:p1 });
      if(signInErr){ state.loginLoading=false; state.loginError = signInErr.message; render(); return; }
    }
    state.loginLoading=false;
  }catch(e){
    state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render();
  }
}

async function onEntrarPassword(){
  const pass = document.getElementById('in-pass').value;
  if(!pass){ state.loginError='Introduce tu contraseña.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  state.loginLoading=false;
  if(error){ state.loginError='Contraseña incorrecta.'; render(); return; }
}

async function onAdminEntrar(){
  const email = (document.getElementById('in-email').value||'').trim();
  const pass = document.getElementById('in-adminpass').value;
  if(!email || !pass){ state.loginError='Introduce email y contraseña.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  state.loginLoading=false;
  if(error){ state.loginError='Credenciales incorrectas.'; render(); return; }
}

   SHELL

  const tabs = [];
  if(state.trabajador){ tabs.push(['nuevo','Nuevo registro'], ['mis','Mis registros']); }
  if(state.perfil.rol==='admin'){ tabs.push(['historial','Historial'], ['catalogo','Catálogo'], ['accesos','Accesos']); }
  return tabs;
}

function renderShell(){
  const empresa = state.empresa;
  const logo = empresa && empresa.logo_url ? `<img src="${esc(empresa.logo_url)}" alt="logo">` : '';
  const nombreEmpresa = empresa ? esc(empresa.nombre) : '';
  const who = state.trabajador ? `${esc(state.trabajador.nombre)} · Nº ${esc(state.trabajador.numero_empleado)}` : (state.perfil.rol==='admin' ? 'Administrador' : '');
  const tabs = availableTabs();
  if(!tabs.find(t=>t[0]===state.tab)) state.tab = tabs.length? tabs[0][0] : 'nuevo';

  return `
    <header class="topbar">
      <div class="topbar-left">
        ${logo}
        <div class="topbar-titles">
          <div class="app-name">Mantenimiento</div>
          ${nombreEmpresa?`<div class="empresa-name">${nombreEmpresa}</div>`:''}
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-chip"><span class="dot"></span>${esc(who)}</div>
        <button class="logout-btn" id="btn-logout">Salir</button>
      </div>
    </header>
    <nav class="tabs">
      ${tabs.map(([key,label])=>`<button data-tab="${key}" class="${state.tab===key?'active':''}">${label}</button>`).join('')}
    </nav>
    <main class="content" id="tab-content">
      <div class="spinner"></div>
    </main>
  `;
}

function bindShellEvents(){
  document.getElementById('btn-logout').onclick = logout;
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.onclick = ()=>{ state.tab = btn.dataset.tab; renderTab(); };
  });
  renderTab();
}

function renderTab(){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));
  const map = { nuevo:renderTabNuevo, mis:renderTabMisRegistros, historial:renderTabHistorial, catalogo:renderTabCatalogo, accesos:renderTabAccesos };
  (map[state.tab] || renderTabNuevo)();
}

function resetWizardFlow(w){
  const permisos = w.permisos;
  Object.assign(w, newWizardState());

}

function resetArbolSelection(w){
  w.ambitoId=null; w.tipoRep=null; w.elementos=null; w.elementoId=null; w.treeCache={}; w.navStack=[];
  w.selected=new Map(); w.observaciones=''; w.carretillaModo=null;

async function renderTabNuevo(){
  const el = document.getElementById('tab-content');
  if(!state.wizard){ state.wizard = newWizardState(); }
  const w = state.wizard;
  if(w.permisos===null){
    el.innerHTML = '<div class="spinner"></div>';
    const { data } = await sb.from('mant_tipos_permisos').select('tipo').eq('trabajador_id', state.trabajador.id);
    w.permisos = (data||[]).map(r=>r.tipo);
  }
  drawWizard();
}

function drawWizard(){
  const el = document.getElementById('tab-content');
  const w = state.wizard;
  if(!w.tipoMant){ el.innerHTML = drawTipoSelector(w); bindTipoSelectorEvents(); return; }
  if(w.tipoMant==='lineas_fabricacion'){ el.innerHTML = drawArbolFlow(w); bindArbolFlowEvents(); }
  else if(w.tipoMant==='carretillas'){ el.innerHTML = drawCarretillasFlow(w); bindCarretillasFlowEvents(); }
  else if(w.tipoMant==='bastidores'){ el.innerHTML = drawBastidoresFlow(w); bindBastidoresFlowEvents(); }
  else if(w.tipoMant==='extintores'){ el.innerHTML = drawExtintoresFlow(w); bindExtintoresEvents(); }
  else { el.innerHTML = drawSimpleFlow(w); bindSimpleFlowEvents(); }
}

/* ---------- Selector de tipo ---------- */
function drawTipoSelector(w){
  const permitidos = TIPOS_MANTENIMIENTO.filter(t=> w.permisos.includes(t.code));
  let html = '<div class="card"><h2>¿Qué tipo de mantenimiento vas a registrar?</h2>';
  if(permitidos.length===0){
    html += '<div class="empty-state">No tienes ningún tipo de mantenimiento asignado. Pide a un administrador que te dé acceso desde la pestaña Accesos.</div>';
  } else {
    html += '<div class="tipo-mant-grid">';
    html += permitidos.map(t=>`<button class="tipo-mant-card" data-tipomant="${t.code}"><span class="tipo-mant-icon">${t.icon}</span><span class="tipo-mant-label">${esc(t.label)}</span></button>`).join('');
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function bindTipoSelectorEvents(){
  const w = state.wizard;
  document.querySelectorAll('[data-tipomant]').forEach(btn=>{
    btn.onclick = async ()=>{
      const code = btn.dataset.tipomant;
      const permisos = w.permisos;
      Object.assign(w, newWizardState());
      w.permisos = permisos;
      w.tipoMant = code;
      if(code==='lineas_fabricacion'){
        w.ambito='linea'; drawWizard();
        await loadAmbitos('linea'); drawWizard();
      } else if(code==='carretillas'){
        w.ambito='vehiculo'; drawWizard();
        await loadAmbitos('vehiculo'); drawWizard();
      } else if(code==='extintores'){
        drawWizard();
        await loadExtintoresList(); drawWizard();
      } else {
        drawWizard();
      }
    };
  });
}

/* ---------- Flujo árbol: línea o vehículo → tipo de reparación → elemento → tarea/repuesto ---------- */
async function loadAmbitos(ambito){
  const w = state.wizard;
  if(ambito==='linea'){
    const { data } = await sb.from('mant_lineas').select('*').eq('activo',true).order('codigo');
    w.ambitos = (data||[]).map(l=>({id:l.id, label:l.codigo + (l.nombre && l.nombre!==l.codigo ? ' · '+l.nombre : '')}));
  } else {
    const { data } = await sb.from('mant_vehiculos').select('*').eq('activo',true).order('nombre');
    w.ambitos = (data||[]).map(v=>({id:v.id, label:v.nombre + (v.modelo? ' · '+v.modelo : '')}));
  }
}

async function loadElementosParaAmbito(ambito, ambitoId){
  const w = state.wizard;
  const table = ambito==='linea' ? 'mant_linea_elementos' : 'mant_vehiculo_elementos';
  const fkCol = ambito==='linea' ? 'linea_id' : 'vehiculo_id';
  const { data:linkRows } = await sb.from(table).select('elemento_id, mant_elementos(id,nombre,activo)').eq(fkCol, ambitoId);
  w.elementos = (linkRows||[]).map(r=>r.mant_elementos).filter(e=>e && e.activo);
}

async function ensureElementoTree(elementoId){
  const w = state.wizard;
  if(w.treeCache[elementoId]) return;
  const elemento = w.elementos.find(e=>e.id===elementoId);
  const { data:tareas } = await sb.from('mant_tareas').select('*').eq('elemento_id', elementoId).eq('activo', true).order('orden');
  const tareaIds = (tareas||[]).map(t=>t.id);
  const repuestosPorTarea = {};
  if(tareaIds.length){
    const { data:links } = await sb.from('mant_tarea_repuestos').select('tarea_id, mant_repuestos(*)').in('tarea_id', tareaIds);
    (links||[]).forEach(l=>{
      if(!l.mant_repuestos || l.mant_repuestos.activo===false) return;
      (repuestosPorTarea[l.tarea_id] = repuestosPorTarea[l.tarea_id] || []).push(l.mant_repuestos);
    });
  }
  w.treeCache[elementoId] = buildTareaTree(tareas||[], elemento, repuestosPorTarea);
}

function buildTareaTree(tareas, elemento, repuestosPorTarea){
  repuestosPorTarea = repuestosPorTarea || {};
  const byId = {};
  tareas.forEach(t=> byId[t.id] = Object.assign({}, t, {children:[], repuestos: repuestosPorTarea[t.id] || []}));
  const roots = [];
  tareas.forEach(t=>{
    if(t.parent_id && byId[t.parent_id]){ byId[t.parent_id].children.push(byId[t.id]); }
    else { roots.push(byId[t.id]); }
  });
  const tareaIndex = {};
  function walk(node, pathParts){
    const path = pathParts.concat([node.nombre]);
    if(node.children.length===0){
      tareaIndex[node.id] = {
        elemento_id: elemento.id,
        elemento_nombre: elemento.nombre,
        tarea_nombre: path.join(' › '),
        tarea_id: node.id,
        repuestos: node.repuestos || [],
      };
    } else {
      node.children.forEach(c=> walk(c, path));
    }
  }
  roots.forEach(r=> walk(r, []));
  return { roots, byId, tareaIndex };
}

  if(w.selected.size>0){
    html += '<div class="section-title" style="margin-top:18px;">Seleccionado para este registro</div><div class="selected-summary">';

  return html;
}

function renderNivelBrowser(w, cache, elementoNombre){
  const currentParent = w.navStack.length ? cache.byId[w.navStack[w.navStack.length-1]] : null;
  const currentNodes = currentParent ? currentParent.children : cache.roots;

  let html = '<div class="nivel-browser">';
  html += `<div class="breadcrumb"><button data-crumb="-1">${esc(elementoNombre)}</button>`;
  w.navStack.forEach((id,idx)=>{
    const node = cache.byId[id];
    html += `<span class="crumb-sep">›</span><button data-crumb="${idx}">${esc(node?node.nombre:'')}</button>`;
  });
  html += '</div>';

  if(currentNodes.length===0){
    html += '<div class="empty-state">No hay tareas configuradas aquí todavía. Añádelas desde Catálogo.</div>';
  } else {
    html += '<div class="nivel-list">';
    currentNodes.forEach(n=>{
      const isBranch = n.children && n.children.length>0;
      if(isBranch){
        html += `<div class="nivel-card branch">
          <button class="nivel-card-inner" data-drill="${n.id}"><span class="nivel-card-name">${esc(n.nombre)}</span><span class="chevron">›</span></button>
          ${n.pdf_url?`<a class="pdf-btn" href="${esc(n.pdf_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver instrucciones / plano">📄 PDF</a>`:''}
        </div>`;
      } else {
        const sel = w.selected.get(n.id);
        const checked = !!sel;
        const repuestos = n.repuestos || [];
        html += `<div class="nivel-card leaf-wrap ${checked?'selected':''}">
          <label class="leaf-toggle">
            <input type="checkbox" data-tarea="${n.id}" ${checked?'checked':''}>
            <span class="nivel-card-name">${esc(n.nombre)}</span>
          </label>
          ${n.pdf_url?`<a class="pdf-btn" style="margin:0 8px 6px 32px;align-self:flex-start;" href="${esc(n.pdf_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver instrucciones / plano">📄 PDF</a>`:''}`;
        if(checked && repuestos.length>0){
          html += `<div class="repuesto-hint">Repuestos usados en esta tarea (opcional):</div><div class="repuesto-subpicker">`;
          repuestos.forEach(r=>{
            const rChecked = sel.repuestoIds && sel.repuestoIds.has(r.id);
            const stockBadge = (r.stock!==null && r.stock!==undefined) ? `<span class="stock-badge ${r.stock<=0?'zero':r.stock<=2?'low':''}">Stock: ${r.stock}</span>` : '';
            html += `<label class="nivel-card leaf ${rChecked?'selected':''}">
              <input type="checkbox" data-repuesto="${n.id}|${r.id}" ${rChecked?'checked':''}>
              ${r.foto_url?`<img class="nivel-photo" src="${esc(r.foto_url)}">`:'<div class="nivel-photo ph">🔩</div>'}
              <div class="nivel-info">
                <div class="nivel-card-name">${esc(r.referencia)}</div>
                ${r.descripcion?`<div class="nivel-meta">${esc(r.descripcion)}</div>`:''}
                ${r.ubicacion?`<div class="nivel-meta">📍 ${esc(r.ubicacion)}</div>`:''}
                ${stockBadge}
              </div>
            </label>`;
          });
          html += '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function bindTipoRepYElementoEvents(w){
  document.querySelectorAll('.tipo-btn[data-tiporep]').forEach(btn=>{
    btn.onclick = ()=>{ w.tipoRep = btn.dataset.tiporep; drawWizard(); };
  });
  document.querySelectorAll('#wiz-elementos .elemento-card').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.elemento;
      w.elementoId=id; w.navStack=[];
      drawWizard();
      await ensureElementoTree(id);
      drawWizard();
    };
  });
  document.querySelectorAll('[data-crumb]').forEach(btn=>{
    btn.onclick = ()=>{ const idx=parseInt(btn.dataset.crumb,10); w.navStack = idx<0?[]:w.navStack.slice(0,idx+1); drawWizard(); };
  });
  document.querySelectorAll('[data-drill]').forEach(btn=>{
    btn.onclick = ()=>{ w.navStack.push(btn.dataset.drill); drawWizard(); };
  });
  document.querySelectorAll('.leaf-toggle input[data-tarea]').forEach(cb=>{
    cb.onchange = ()=>{
      const tid=cb.dataset.tarea; const cache=w.treeCache[w.elementoId];
      if(cb.checked){ w.selected.set(tid, Object.assign({}, cache.tareaIndex[tid], {repuestoIds:new Set()})); } else { w.selected.delete(tid); }
      drawWizard();
    };
  });
  document.querySelectorAll('input[data-repuesto]').forEach(cb=>{
    cb.onchange = ()=>{
      const [tid, rid] = cb.dataset.repuesto.split('|');
      const sel = w.selected.get(tid);
      if(!sel) return;
      if(!sel.repuestoIds) sel.repuestoIds = new Set();
      if(cb.checked){ sel.repuestoIds.add(rid); } else { sel.repuestoIds.delete(rid); }
      drawWizard();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{ btn.onclick=()=>{ w.selected.delete(btn.dataset.remove); drawWizard(); }; });
  const obs=document.getElementById('wiz-obs'); if(obs) obs.oninput = e=> w.observaciones=e.target.value;
  const btnG = document.getElementById('btn-guardar-arbol'); if(btnG) btnG.onclick = guardarRegistroArbol;
}

async function guardarRegistroArbol(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-arbol');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const ambitoObj = (w.ambitos||[]).find(a=>a.id===w.ambitoId);
  const items = [];
  for(const it of w.selected.values()){
    const repIds = it.repuestoIds && it.repuestoIds.size ? Array.from(it.repuestoIds) : [];
    if(repIds.length===0){
      items.push({ tarea_id: it.tarea_id, elemento_nombre: it.elemento_nombre, tarea_nombre: it.tarea_nombre, repuesto_id:null, referencia:null, ubicacion:null, foto_url:null, descripcion:null });
    } else {
      repIds.forEach(rid=>{
        const r = (it.repuestos||[]).find(x=>x.id===rid);
        items.push({
          tarea_id: it.tarea_id, elemento_nombre: it.elemento_nombre, tarea_nombre: it.tarea_nombre,
          repuesto_id: rid, referencia: r?r.referencia:null, ubicacion: r?r.ubicacion:null, foto_url: r?r.foto_url:null, descripcion: r?r.descripcion:null,
        });
      });
    }
  }
  try{
    const { error } = await sb.rpc('registrar_mantenimiento_linea_vehiculo', {
      p_ambito: w.ambito,
      p_ambito_id: w.ambitoId,
      p_ambito_nombre: ambitoObj ? ambitoObj.label : null,
      p_tipo: w.tipoRep,
      p_observaciones: w.observaciones || null,
      p_items: items,
    });
    if(error) throw error;
    toast('Registro guardado correctamente', 'success');
    state.misRegistros = null; state.historial = null;
    resetArbolSelection(w);
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message, 'error');
    btn.disabled=false; btn.textContent='Guardar registro';
  }
}

    else if(w.bastidorPiezasCache.length===0){ html += '<div class="empty-state">Este bastidor no tiene piezas 3D asociadas. Asígnalas desde Catálogo → Bastidores.</div>'; }
    else {
      html += '<div class="nivel-list">';
      w.bastidorPiezasCache.forEach(p=>{
        const cant = w.bastPiezaCantidades[p.id] || 0;
        const checked = cant>0;
        const stockBadge = (p.stock!==null && p.stock!==undefined) ? `<span class="stock-badge ${p.stock<=0?'zero':p.stock<=2?'low':''}">Stock: ${p.stock}</span>` : '';
        html += `<div class="nivel-card leaf-wrap ${checked?'selected':''}">
          <div style="display:flex;gap:10px;align-items:center;padding:10px 12px;">
            <label class="leaf-toggle" style="flex:1;">
              <input type="checkbox" data-pieza-check="${p.id}" ${checked?'checked':''}>
              ${p.foto_url?`<img class="nivel-photo" src="${esc(p.foto_url)}">`:'<div class="nivel-photo ph">🧩</div>'}
              <div class="nivel-info">
                <div class="nivel-card-name">${esc(p.referencia)}</div>
                ${p.descripcion?`<div class="nivel-meta">${esc(p.descripcion)}</div>`:''}
                ${stockBadge}
              </div>
            </label>
            <input type="number" min="1" class="pieza-qty" data-pieza-qty="${p.id}" value="${cant||1}" ${checked?'':'disabled'} style="width:60px;padding:6px 8px;border:1.5px solid var(--steel-200);border-radius:7px;">
          </div>
        </div>`;
      });
      html += '</div>';
    }
  }

  html += '<div class="section-title" style="margin-top:18px;">Observaciones (opcional)</div>';
  html += `<textarea id="wiz-bast-obs" placeholder="Notas adicionales...">${esc(w.bastObservaciones)}</textarea>`;

  const limpiezaOk = !w.bastLimpieza || !!w.bastLimpiezaTipo;
  const reparacionOk = !w.bastReparacion || Object.values(w.bastPiezaCantidades).some(c=>c>0);
  const canSave = (w.bastLimpieza || w.bastReparacion) && limpiezaOk && reparacionOk;
  html += `<div style="margin-top:18px;"><button class="btn btn-amber" id="btn-guardar-bastidor" ${canSave?'':'disabled'}>Guardar registro</button></div>`;
  return html;
}

function bindBastidoresFlowEvents(){
  const w = state.wizard;
  bindBackHeader(w);
  document.querySelectorAll('[data-bastmodo]').forEach(btn=>{
    btn.onclick = async ()=>{
      w.bastidorSubmodo = btn.dataset.bastmodo;

        w.bastidoresList = data||[];

      }

function bindFabricacionFormEvents(w){
  document.querySelectorAll('[data-fabqty]').forEach(inp=>{
    inp.oninput = ()=>{
      const v = parseInt(inp.value,10);
      w.fabCantidades[inp.dataset.fabqty] = (isNaN(v)||v<0)?0:v;
      const btn = document.getElementById('btn-guardar-fabricacion');
      if(btn){ const total = Object.values(w.fabCantidades).reduce((a,b)=>a+(b||0),0); btn.disabled = !(total>0); }
    };
  });
  const obs = document.getElementById('wiz-fab-obs'); if(obs) obs.oninput = e=> w.fabObservaciones = e.target.value;
  const btn = document.getElementById('btn-guardar-fabricacion'); if(btn) btn.onclick = guardarFabricacionPiezas3d;
}

function bindMantBastidorEvents(w){
  document.querySelectorAll('#wiz-bastidores .elemento-card').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.bastidor;
      if(w.bastidorSelId===id) return;
      w.bastidorSelId=id; w.bastLimpieza=false; w.bastLimpiezaTipo=null; w.bastReparacion=false;
      w.bastidorPiezasCache=null; w.bastPiezaCantidades={}; w.bastObservaciones='';
      drawWizard();
    };
  });
  document.querySelectorAll('[data-toggle-limpieza]').forEach(btn=>{
    btn.onclick = ()=>{ w.bastLimpieza = !w.bastLimpieza; if(!w.bastLimpieza) w.bastLimpiezaTipo=null; drawWizard(); };
  });
  document.querySelectorAll('[data-toggle-reparacion]').forEach(btn=>{
    btn.onclick = async ()=>{
      w.bastReparacion = !w.bastReparacion;
      drawWizard();
      if(w.bastReparacion && w.bastidorPiezasCache===null){
        const { data:links } = await sb.from('mant_bastidor_piezas').select('pieza_id, mant_piezas3d(*)').eq('bastidor_id', w.bastidorSelId);
        w.bastidorPiezasCache = (links||[]).map(l=>l.mant_piezas3d).filter(p=>p && p.activo);
        drawWizard();
      }
    };
  });
  document.querySelectorAll('[data-limptipo]').forEach(btn=>{
    btn.onclick = ()=>{ w.bastLimpiezaTipo = btn.dataset.limptipo; drawWizard(); };
  });
  document.querySelectorAll('[data-pieza-check]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.piezaCheck;
      if(cb.checked){ w.bastPiezaCantidades[id] = 1; } else { delete w.bastPiezaCantidades[id]; }
      drawWizard();
    };
  });
  document.querySelectorAll('[data-pieza-qty]').forEach(inp=>{
    inp.oninput = ()=>{
      const id = inp.dataset.piezaQty;
      const v = parseInt(inp.value,10);
      w.bastPiezaCantidades[id] = (isNaN(v)||v<1)?1:v;
      const btn = document.getElementById('btn-guardar-bastidor');
      if(btn){
        const limpiezaOk = !w.bastLimpieza || !!w.bastLimpiezaTipo;
        const reparacionOk = !w.bastReparacion || Object.values(w.bastPiezaCantidades).some(c=>c>0);
        btn.disabled = !((w.bastLimpieza||w.bastReparacion) && limpiezaOk && reparacionOk);
      }
    };
  });
  const obs = document.getElementById('wiz-bast-obs'); if(obs) obs.oninput = e=> w.bastObservaciones = e.target.value;
  const btn = document.getElementById('btn-guardar-bastidor'); if(btn) btn.onclick = guardarMantenimientoBastidor;
}

async function guardarFabricacionPiezas3d(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-fabricacion');
  const win = window.open('', '_blank');
  if(win) win.document.write('<p style="font-family:sans-serif;padding:24px;">Generando documento…</p>');
  btn.disabled=true; btn.textContent='Guardando…';
  const items = Object.entries(w.fabCantidades).filter(([id,c])=>c>0).map(([id,c])=>{
    const p = (w.piezas3dList||[]).find(x=>x.id===id);
    return { pieza_id:id, referencia: p?p.referencia:null, cantidad:c };
  });
  try{
    const { data:fabId, error } = await sb.rpc('registrar_fabricacion_piezas3d', {
      p_observaciones: w.fabObservaciones || null,
      p_items: items,
    });
    if(error) throw error;
    toast('Producción registrada','success');
    state.misRegistros=null; state.historial=null;
    if(state.catalogo.piezas3d){ items.forEach(it=>{ const p=state.catalogo.piezas3d.find(x=>x.id===it.pieza_id); if(p) p.stock=(p.stock||0)+it.cantidad; }); }
    state.catalogo.producciones = null;
    if(win && !win.closed){ escribirDocumentoFabricacion(win, { id:fabId, ts:new Date().toISOString(), trabajador_nombre: state.trabajador.nombre, observaciones: w.fabObservaciones||null }, items); }
    else { toast('El documento no se pudo abrir automáticamente. Genéralo desde Catálogo → Piezas 3D → Producciones.','error'); }
    w.fabCantidades = {}; w.fabObservaciones=''; w.piezas3dList=null; w.bastidorSubmodo=null;
    drawWizard();
  }catch(e){
    if(win && !win.closed) win.close();
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar y generar documento';
  }
}

function escribirDocumentoFabricacion(win, fab, items){
  const fecha = fmtFechaHora(fab.ts);
  const estilos = 'body{font-family:Arial,Helvetica,sans-serif;padding:24px;color:#111;} h1{font-size:18px;margin:0 0 4px;} .meta{font-size:12.5px;color:#555;margin-bottom:16px;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #999;padding:6px 8px;font-size:11.5px;text-align:left;} th{background:#eee;}';
  const thead = '<tr><th>Referencia</th><th>Cantidad fabricada</th></tr>';
  const rows = items.map(it=>`<tr><td>${esc(it.referencia||'')}</td><td>${esc(it.cantidad)}</td></tr>`).join('');
  const bodyHtml = `<h1>Producción de piezas 3D</h1><div class="meta">Fecha: ${esc(fecha)} · Operario: ${esc(fab.trabajador_nombre||'')}</div><table><thead>${thead}</thead><tbody>${rows}</tbody></table>${fab.observaciones?`<div style="margin-top:14px;font-size:12px;"><b>Observaciones:</b> ${esc(fab.observaciones)}</div>`:''}`;
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Producción piezas 3D</title><style>${estilos}</style></head><body>${bodyHtml}<script>window.onload=function(){window.print();};<\/script></body></html>`);
  win.document.close();
}

async function guardarMantenimientoBastidor(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-bastidor');
  btn.disabled=true; btn.textContent='Guardando…';
  const bastidor = (w.bastidoresList||[]).find(b=>b.id===w.bastidorSelId);
  const piezas = Object.entries(w.bastPiezaCantidades).filter(([id,c])=>c>0).map(([id,c])=>{
    const p = (w.bastidorPiezasCache||[]).find(x=>x.id===id);
    return { pieza_id:id, referencia: p?p.referencia:null, cantidad:c };
  });
  try{
    const { error } = await sb.rpc('registrar_mantenimiento_bastidor', {
      p_bastidor_id: w.bastidorSelId,
      p_bastidor_nombre: bastidor?bastidor.nombre:null,
      p_limpieza: !!w.bastLimpieza,
      p_limpieza_tipo: w.bastLimpieza ? w.bastLimpiezaTipo : null,
      p_reparacion: !!w.bastReparacion,
      p_observaciones: w.bastObservaciones || null,
      p_piezas: piezas,
    });
    if(error) throw error;
    toast('Registro guardado correctamente','success');
    state.misRegistros=null; state.historial=null;
    if(state.catalogo.piezas3d){ piezas.forEach(it=>{ const p=state.catalogo.piezas3d.find(x=>x.id===it.pieza_id); if(p) p.stock=Math.max((p.stock||0)-it.cantidad,0); }); }
    w.bastidorSelId=null; w.bastLimpieza=false; w.bastLimpiezaTipo=null; w.bastReparacion=false;
    w.bastidorPiezasCache=null; w.bastPiezaCantidades={}; w.bastObservaciones='';
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar registro';
  }
}

/* ---------- Extintores ---------- */
async function loadExtintoresList(){
  const w = state.wizard;
  const { data } = await sb.from('mant_extintores').select('*').eq('activo',true).order('numero');
  w.extintores = data||[];
}

function drawExtintoresFlow(w){
  let html = '<div class="card">';
  html += wizardBackHeader('Extintores');
  if(!w.extRondaTipo){
    html += '<div class="section-title">Tipo de revisión</div>';
    html += `<div class="hint" style="margin-bottom:10px;">Cada revisión (trimestral o anual) se hace en una sola ronda que cubre el 100% de los extintores. Si ya hay una ronda abierta de este tipo, continuarás donde la dejaste.</div>`;
    html += `<div class="tipo-row">
      <button class="tipo-btn preventivo" data-extrondatipo="trimestral">📋 Revisión trimestral</button>
      <button class="tipo-btn correctivo" data-extrondatipo="anual">🏭 Inspección anual (empresa externa)</button>
    </div>`;
    html += '</div>';
    return html;
  }
  if(w.extintores===null || w.extRonda===null){
    html += '<div class="spinner"></div></div>';
    return html;
  }
  html += drawRondaProgress(w);
  html += '</div>';
  return html;
}

async function loadOrCreateRonda(tipo){
  const w = state.wizard;
  const { data:existing } = await sb.from('mant_extintor_rondas').select('*').eq('tipo',tipo).eq('cerrada',false).order('iniciada_ts',{ascending:false}).limit(1);
  let ronda;
  if(existing && existing.length){
    ronda = existing[0];
  } else {
    const { data, error } = await sb.from('mant_extintor_rondas').insert({
      tipo, iniciada_por_id: state.trabajador.id, iniciada_por_nombre: state.trabajador.nombre,
    }).select().single();
    if(error){ toast('Error al iniciar la ronda: '+error.message,'error'); return; }
    ronda = data;
  }
  w.extRonda = ronda;
  const { data:revs } = await sb.from('mant_extintor_revisiones').select('*, mant_extintor_revision_respuestas(*)').eq('ronda_id', ronda.id);
  w.extRondaRevisiones = revs || [];
}

function drawRondaProgress(w){
  const activos = (w.extintores||[]).filter(e=>e.activo);
  const doneIds = new Set((w.extRondaRevisiones||[]).map(r=>r.extintor_id));
  const pendientes = activos.filter(e=>!doneIds.has(e.id)).length;

  if(w.extRondaExtintorId){
    const extintor = activos.find(e=>e.id===w.extRondaExtintorId);
    let html = `<div class="wiz-subheader"><button class="btn-back" id="btn-back-extintor-ronda">‹ Volver al listado</button></div>`;
    html += `<h2 style="margin-top:2px;">Nº ${esc(extintor?extintor.numero:'')}${extintor&&extintor.ubicacion?' · '+esc(extintor.ubicacion):''}</h2>`;
    html += w.extRondaTipo==='trimestral' ? drawChecklist(w) : drawExtintorAnualForm(w);
    return html;
  }

  let html = `<div class="wiz-subheader"><button class="btn-back" id="btn-back-rondatipo">‹ Cambiar tipo de revisión</button></div>`;
  html += `<h2 style="margin-top:2px;">${w.extRondaTipo==='trimestral'?'Revisión trimestral':'Inspección anual'}</h2>`;
  html += `<div class="hint" style="margin-bottom:12px;">Ronda iniciada por ${esc(w.extRonda.iniciada_por_nombre||'')} · ${activos.length-pendientes} / ${activos.length} extintores revisados</div>`;
  if(activos.length===0){
    html += '<div class="empty-state">No hay extintores activos dados de alta. Añádelos desde Catálogo.</div>';
    return html;
  }
  html += '<div class="nivel-list">';
  activos.forEach(e=>{
    const done = doneIds.has(e.id);
    html += `<div class="nivel-card branch ronda-item ${done?'done':''}">
      <button class="nivel-card-inner" data-revisar-extintor="${e.id}"><span class="nivel-card-name">Nº ${esc(e.numero)}${e.ubicacion?' · '+esc(e.ubicacion):''}</span><span class="chevron">${done?'✅':'›'}</span></button>
    </div>`;
  });
  html += '</div>';
  const puedeCerrar = pendientes===0;
  html += `<div style="margin-top:18px;"><button class="btn btn-amber" id="btn-cerrar-ronda" ${puedeCerrar?'':'disabled'}>Cerrar ronda y generar documento</button></div>`;
  if(!puedeCerrar) html += `<div class="hint">Faltan ${pendientes} extintor(es) por revisar para poder cerrar esta ronda.</div>`;
  return html;
}

function drawChecklist(w){
  let html = '<div class="section-title" style="margin-top:18px;">Checklist de revisión</div>';
  if(!w.checklist){ return html + '<div class="spinner"></div>'; }
  if(w.checklist.length===0){ return html + '<div class="empty-state">No hay preguntas configuradas. Añádelas desde Catálogo.</div>'; }
  html += '<div class="checklist">';
  w.checklist.forEach(q=>{
    const val = w.respuestas[q.id];
    html += `<div class="checklist-item">
      <span class="checklist-q">${esc(q.pregunta)}</span>
      <div class="checklist-toggle">
        <button class="chk-btn si ${val===true?'active':''}" data-chk="${q.id}" data-val="true">Sí</button>
        <button class="chk-btn no ${val===false?'active':''}" data-chk="${q.id}" data-val="false">No</button>
      </div>
    </div>`;
  });
  html += '</div>';
  html += '<div class="section-title" style="margin-top:18px;">Observaciones (opcional)</div>';
  html += `<textarea id="wiz-ext-obs" placeholder="Notas adicionales...">${esc(w.observaciones)}</textarea>`;
  const answered = w.checklist.every(q=> w.respuestas[q.id]!==undefined);
  html += `<div style="margin-top:18px;"><button class="btn btn-amber" id="btn-guardar-checklist" ${answered?'':'disabled'}>Guardar revisión</button></div>`;
  if(!answered) html += '<div class="hint">Responde todas las preguntas para poder guardar.</div>';
  return html;
}

function drawExtintorAnualForm(w){
  let html = '<div class="section-title" style="margin-top:18px;">Certificado de la empresa externa</div>';
  html += `<div class="field"><input type="file" id="ext-pdf" accept="application/pdf"></div>`;
  html += '<div class="section-title" style="margin-top:14px;">Observaciones (opcional)</div>';
  html += `<textarea id="wiz-ext-obs" placeholder="Notas adicionales...">${esc(w.observaciones)}</textarea>`;
  html += `<div style="margin-top:18px;"><button class="btn btn-amber" id="btn-guardar-anual">Guardar inspección anual</button></div>`;
  return html;
}

function bindExtintoresEvents(){
  const w = state.wizard;
  bindBackHeader(w);
  document.querySelectorAll('[data-extrondatipo]').forEach(btn=>{
    btn.onclick = async ()=>{
      w.extRondaTipo = btn.dataset.extrondatipo;
      w.extRonda=null; w.extRondaRevisiones=null; w.extRondaExtintorId=null;
      drawWizard();
      if(w.extintores===null) await loadExtintoresList();
      await loadOrCreateRonda(w.extRondaTipo);
      drawWizard();
    };
  });
  const backRondaTipo = document.getElementById('btn-back-rondatipo');
  if(backRondaTipo) backRondaTipo.onclick = ()=>{ w.extRondaTipo=null; w.extRonda=null; w.extRondaRevisiones=null; w.extRondaExtintorId=null; drawWizard(); };
  document.querySelectorAll('[data-revisar-extintor]').forEach(btn=>{
    btn.onclick = async ()=>{
      w.extRondaExtintorId = btn.dataset.revisarExtintor;
      w.respuestas = {}; w.observaciones = '';
      drawWizard();
      if(w.extRondaTipo==='trimestral' && !w.checklist){
        const { data } = await sb.from('mant_extintor_checklist_items').select('*').eq('activo',true).order('orden');
        w.checklist = data||[];
        drawWizard();
      }
    };
  });
  const backExtintorRonda = document.getElementById('btn-back-extintor-ronda');
  if(backExtintorRonda) backExtintorRonda.onclick = ()=>{ w.extRondaExtintorId=null; drawWizard(); };
  document.querySelectorAll('.chk-btn').forEach(btn=>{
    btn.onclick = ()=>{ w.respuestas[btn.dataset.chk] = btn.dataset.val==='true'; drawWizard(); };

  const btnAnual = document.getElementById('btn-guardar-anual'); if(btnAnual) btnAnual.onclick = guardarRevisionAnual;
  const btnCerrar = document.getElementById('btn-cerrar-ronda'); if(btnCerrar) btnCerrar.onclick = cerrarRonda;
}

async function guardarRevisionTrimestral(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-checklist');
  btn.disabled=true; btn.textContent='Guardando…';
  const extintor = (w.extintores||[]).find(e=>e.id===w.extRondaExtintorId);
  try{
    const { data:rev, error:revErr } = await sb.from('mant_extintor_revisiones').insert({
      trabajador_id: state.trabajador.id, numero_empleado: state.trabajador.numero_empleado, trabajador_nombre: state.trabajador.nombre,
      extintor_id: w.extRondaExtintorId, extintor_numero: extintor?extintor.numero:null, tipo:'trimestral', observaciones: w.observaciones||null,
      ronda_id: w.extRonda.id,
    }).select().single();
    if(revErr) throw revErr;
    const respRows = w.checklist.map(q=>({ revision_id:rev.id, pregunta_id:q.id, pregunta_texto:q.pregunta, respuesta: w.respuestas[q.id] }));
    const { error:respErr } = await sb.from('mant_extintor_revision_respuestas').insert(respRows).select();
    if(respErr) throw respErr;
    toast('Extintor revisado','success');
    state.misRegistros=null; state.historial=null;
    w.extRondaRevisiones.push(Object.assign({}, rev, {mant_extintor_revision_respuestas: respRows}));
    w.extRondaExtintorId=null; w.respuestas={}; w.observaciones='';
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar revisión';
  }
}

async function guardarRevisionAnual(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-anual');
  const fileInput = document.getElementById('ext-pdf');
  btn.disabled=true; btn.textContent='Guardando…';
  try{
    let pdf_url = null;
    if(fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      const path = 'extintores/'+w.extRondaExtintorId+'-'+Date.now()+'.pdf';
      const { error:upErr } = await sb.storage.from('mant-pdfs').upload(path, file, { upsert:true });
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from('mant-pdfs').getPublicUrl(path);
      pdf_url = pub.publicUrl;
    }
    const extintor = (w.extintores||[]).find(e=>e.id===w.extRondaExtintorId);
    const { data:rev, error } = await sb.from('mant_extintor_revisiones').insert({
      trabajador_id: state.trabajador.id, numero_empleado: state.trabajador.numero_empleado, trabajador_nombre: state.trabajador.nombre,
      extintor_id: w.extRondaExtintorId, extintor_numero: extintor?extintor.numero:null, tipo:'anual', observaciones: w.observaciones||null, pdf_url,
      ronda_id: w.extRonda.id,
    }).select().single();
    if(error) throw error;
    toast('Extintor certificado','success');
    state.misRegistros=null; state.historial=null;
    w.extRondaRevisiones.push(rev);
    w.extRondaExtintorId=null; w.observaciones='';
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar inspección anual';
  }
}

async function cerrarRonda(){
  const w = state.wizard;
  const btn = document.getElementById('btn-cerrar-ronda');
  const win = window.open('', '_blank');
  if(win) win.document.write('<p style="font-family:sans-serif;padding:24px;">Generando documento…</p>');
  btn.disabled=true; btn.textContent='Cerrando…';
  try{
    const { data, error } = await sb.from('mant_extintor_rondas').update({
      cerrada:true, cerrada_ts:new Date().toISOString(), cerrada_por_id: state.trabajador.id, cerrada_por_nombre: state.trabajador.nombre,
    }).eq('id', w.extRonda.id).select().single();
    if(error) throw error;
    toast('Ronda cerrada','success');
    if(win && !win.closed){ escribirDocumentoRonda(win, data, w.extintores||[], w.extRondaRevisiones||[]); }
    else { toast('El documento no se pudo abrir automáticamente. Genéralo desde Catálogo → Extintores → Rondas.','error'); }
    if(state.catalogo.rondas) state.catalogo.rondas = null;
    w.extRondaTipo=null; w.extRonda=null; w.extRondaRevisiones=null; w.extRondaExtintorId=null;
    drawWizard();
  }catch(e){
    if(win && !win.closed) win.close();
    toast('Error al cerrar la ronda: '+e.message,'error');
    btn.disabled=false; btn.textContent='Cerrar ronda y generar documento';
  }
}

function escribirDocumentoRonda(win, ronda, extintores, revisiones){
  const activos = (extintores||[]).filter(e=>e.activo!==false);
  const fecha = ronda.cerrada_ts ? fmtFechaHora(ronda.cerrada_ts) : '';
  const estilos = 'body{font-family:Arial,Helvetica,sans-serif;padding:24px;color:#111;} h1{font-size:18px;margin:0 0 4px;} .meta{font-size:12.5px;color:#555;margin-bottom:16px;} table{border-collapse:collapse;width:100%;} th,td{border:1px solid #999;padding:6px 8px;font-size:11.5px;text-align:left;} th{background:#eee;}';
  let bodyHtml;
  if(ronda.tipo==='trimestral'){
    const preguntas = []; const seen = new Set();
    revisiones.forEach(r=>{ (r.mant_extintor_revision_respuestas||[]).forEach(resp=>{ if(!seen.has(resp.pregunta_texto)){ seen.add(resp.pregunta_texto); preguntas.push(resp.pregunta_texto); } }); });
    const thead = '<tr><th>Nº placa</th><th>Ubicación</th>'+preguntas.map(p=>`<th>${esc(p)}</th>`).join('')+'<th>Observaciones</th></tr>';
    const rows = activos.map(e=>{
      const rev = revisiones.find(r=>r.extintor_id===e.id);
      const respMap = {};
      (rev&&rev.mant_extintor_revision_respuestas||[]).forEach(r=> respMap[r.pregunta_texto]=r.respuesta);
      const cells = preguntas.map(p=> `<td>${respMap[p]===true?'Sí':respMap[p]===false?'No':'—'}</td>`).join('');
      return `<tr><td>${esc(e.numero)}</td><td>${esc(e.ubicacion||'')}</td>${cells}<td>${esc(rev&&rev.observaciones||'')}</td></tr>`;
    }).join('');
    bodyHtml = `<h1>Ronda de revisión trimestral de extintores</h1><div class="meta">Cerrada: ${esc(fecha)} · Por: ${esc(ronda.cerrada_por_nombre||'')}</div><table><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
  } else {
    const thead = '<tr><th>Nº placa</th><th>Ubicación</th><th>Certificado</th><th>Observaciones</th></tr>';
    const rows = activos.map(e=>{
      const rev = revisiones.find(r=>r.extintor_id===e.id);
      const cert = rev && rev.pdf_url ? `<a href="${esc(rev.pdf_url)}" target="_blank">Ver PDF</a>` : '—';
      return `<tr><td>${esc(e.numero)}</td><td>${esc(e.ubicacion||'')}</td><td>${cert}</td><td>${esc(rev&&rev.observaciones||'')}</td></tr>`;
    }).join('');
    bodyHtml = `<h1>Ronda de inspección anual de extintores</h1><div class="meta">Cerrada: ${esc(fecha)} · Por: ${esc(ronda.cerrada_por_nombre||'')}</div><table><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
  }
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ronda extintores</title><style>${estilos}</style></head><body>${bodyHtml}<script>window.onload=function(){window.print();};<\/script></body></html>`);
  win.document.close();
}

/* ---------- Flujo simple (compresores, gas, informático, residuos, otros) ---------- */
function drawSimpleFlow(w){
  const meta = TIPOS_MANTENIMIENTO.find(t=>t.code===w.tipoMant);
  let html = '<div class="card">';
  html += wizardBackHeader(meta?meta.label:'Mantenimiento');

  if(subtipos){
    html += '<div class="section-title">Subtipo</div><div class="chip-row" id="wiz-subtipo">';
    html += subtipos.map(s=>`<button class="chip-btn ${w.simpleSubtipo===s.code?'selected':''}" data-subtipo="${s.code}">${esc(s.label)}</button>`).join('');
    html += '</div>';
    if(!w.simpleSubtipo){ html += '</div>'; return html; }

function bindSimpleFlowEvents(){
  const w = state.wizard;
  bindBackHeader(w);

function bindSimpleFormEvents(w, onSave){

  const desc = document.getElementById('sf-descripcion'); if(desc) desc.oninput = e=> w.simpleDescripcion = e.target.value;
  const emp = document.getElementById('sf-empresa'); if(emp) emp.oninput = e=> w.simpleEmpresa = e.target.value;
  const btn = document.getElementById('btn-guardar-simple'); if(btn) btn.onclick = onSave;
}

async function guardarRegistroSimple(tipo){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-simple');
  const fileInput = document.getElementById('sf-pdf');
  if(!w.simpleDescripcion || !w.simpleDescripcion.trim()){ toast('Escribe una descripción','error'); return; }
  btn.disabled=true; btn.textContent='Guardando…';
  try{
    let pdf_url=null;
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      const path = tipo+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.pdf';
      const { error:upErr } = await sb.storage.from('mant-pdfs').upload(path, file);
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from('mant-pdfs').getPublicUrl(path);
      pdf_url = pub.publicUrl;
    }
    const { error } = await sb.from('mant_registros_simple').insert({
      trabajador_id: state.trabajador.id, numero_empleado: state.trabajador.numero_empleado, trabajador_nombre: state.trabajador.nombre,
      tipo, subtipo: w.simpleSubtipo || null, titulo: w.simpleTitulo || null,
      empresa_externa: w.simpleEmpresa || null, descripcion: w.simpleDescripcion, pdf_url,
    });
    if(error) throw error;
    toast('Registro guardado correctamente','success');
    state.misRegistros=null; state.historial=null;
    w.simpleTitulo=''; w.simpleDescripcion=''; w.simpleEmpresa=''; w.simpleSubtipo=null;
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar';
  }
}

/* ============================================================
   EVENTOS UNIFICADOS (líneas/vehículos + extintores + simples)
   ============================================================ */
async function loadAllEventos(scopeTrabajadorId){
  let qArbol = sb.from('mant_registros').select('*, mant_registro_items(*)').order('ts',{ascending:false}).limit(1000);
  let qExt = sb.from('mant_extintor_revisiones').select('*, mant_extintor_revision_respuestas(*)').order('ts',{ascending:false}).limit(1000);
  let qSimple = sb.from('mant_registros_simple').select('*').order('ts',{ascending:false}).limit(1000);
  let qFab = sb.from('mant_piezas3d_fabricacion').select('*, mant_piezas3d_fabricacion_items(*)').order('ts',{ascending:false}).limit(1000);
  let qBast = sb.from('mant_bastidor_registros').select('*, mant_bastidor_registro_piezas(*)').order('ts',{ascending:false}).limit(1000);
  if(scopeTrabajadorId){
    qArbol = qArbol.eq('trabajador_id', scopeTrabajadorId);
    qExt = qExt.eq('trabajador_id', scopeTrabajadorId);
    qSimple = qSimple.eq('trabajador_id', scopeTrabajadorId);
    qFab = qFab.eq('trabajador_id', scopeTrabajadorId);
    qBast = qBast.eq('trabajador_id', scopeTrabajadorId);
  }
  const [{data:arbol}, {data:ext}, {data:simple}, {data:fab}, {data:bast}] = await Promise.all([qArbol, qExt, qSimple, qFab, qBast]);
  const rows = [];
  (arbol||[]).forEach(r=>{
    const items = (r.mant_registro_items && r.mant_registro_items.length) ? r.mant_registro_items : [null];
    items.forEach(it=>{
      rows.push({
        ts: r.ts,
        tipoCode: r.ambito==='vehiculo' ? 'carretillas' : 'lineas_fabricacion',
        tipoLabel: r.ambito==='vehiculo' ? 'Carretillas (interno)' : 'Líneas de Fabricación',
        referenciaAmbito: r.ambito==='vehiculo' ? (r.vehiculo_nombre||'') : (r.linea_codigo||''),
        subtipo: r.tipo,
        numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
        detalle: it ? (it.elemento_nombre+' › '+it.tarea_nombre) : '',
        referencia: it?(it.referencia||''):'', ubicacion: it?(it.ubicacion||''):'',
        observaciones: r.observaciones||'',
        adjuntoUrl: it?(it.foto_url||''):'', adjuntoTipo: it&&it.foto_url?'foto':'',
        sourceTable:'mant_registros', sourceId:r.id,
      });
    });
  });
  (ext||[]).forEach(r=>{
    const resp = r.mant_extintor_revision_respuestas||[];
    let detalle;
    if(r.tipo==='trimestral'){
      const noOk = resp.filter(x=>x.respuesta===false).length;
      detalle = 'Checklist: '+resp.length+' preguntas'+(noOk?', '+noOk+' con incidencia':', todo correcto');
    } else {
      detalle = 'Inspección anual empresa externa';
    }
    rows.push({
      ts: r.ts, tipoCode:'extintores', tipoLabel:'Extintores',
      referenciaAmbito: 'Nº '+(r.extintor_numero||''),
      subtipo: r.tipo==='trimestral'?'Revisión trimestral':'Inspección anual',
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle, referencia:'', ubicacion:'',
      observaciones: r.observaciones||'',
      adjuntoUrl: r.pdf_url||'', adjuntoTipo: r.pdf_url?'pdf':'',
      sourceTable:'mant_extintor_revisiones', sourceId:r.id,
    });
  });
  (simple||[]).forEach(r=>{
    const esCarretillaExterna = r.tipo==='carretillas_externo';
    const esCarretillaAgua = r.tipo==='carretillas_agua';
    const esCarretilla = esCarretillaExterna || esCarretillaAgua;
    const subtipoTxt = r.subtipo ? subtipoLabelFor(r.tipo, r.subtipo)
      : esCarretillaExterna ? ('Externo'+(r.empresa_externa?(' · '+r.empresa_externa):''))
      : esCarretillaAgua ? 'Rellenado de agua de baterías'
      : (r.empresa_externa?('Empresa: '+r.empresa_externa):'');
    rows.push({
      ts: r.ts, tipoCode: esCarretilla?'carretillas':r.tipo,
      tipoLabel: tipoMantLabel(esCarretilla?'carretillas':r.tipo),
      referenciaAmbito: esCarretilla ? (r.referencia_nombre||'') : (r.titulo || r.empresa_externa || ''),
      subtipo: subtipoTxt,
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle: r.descripcion||'', referencia:'', ubicacion:'',
      observaciones:'',
      adjuntoUrl: r.pdf_url||'', adjuntoTipo: r.pdf_url?'pdf':'',
      sourceTable:'mant_registros_simple', sourceId:r.id,
    });
  });
  (fab||[]).forEach(r=>{
    const items = r.mant_piezas3d_fabricacion_items||[];
    const total = items.reduce((a,it)=>a+(it.cantidad||0),0);
    rows.push({
      ts: r.ts, tipoCode:'bastidores', tipoLabel:'Bastidores',
      referenciaAmbito: 'Fabricación de piezas 3D',
      subtipo: total+' unidad(es), '+items.length+' referencia(s)',
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle: items.map(it=>(it.referencia_snapshot||'')+' × '+it.cantidad).join(', '),
      referencia:'', ubicacion:'',
      observaciones: r.observaciones||'',
      adjuntoUrl:'', adjuntoTipo:'',
      sourceTable:'mant_piezas3d_fabricacion', sourceId:r.id,
    });
  });
  (bast||[]).forEach(r=>{
    const piezas = r.mant_bastidor_registro_piezas||[];
    const partes = [];
    if(r.limpieza) partes.push('Limpieza '+(r.limpieza_tipo==='total'?'total':'parcial'));
    if(r.reparacion) partes.push('Reparación');
    rows.push({
      ts: r.ts, tipoCode:'bastidores', tipoLabel:'Bastidores',
      referenciaAmbito: r.bastidor_nombre||'',
      subtipo: partes.join(' + ')||'Mantenimiento',
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle: piezas.length ? piezas.map(p=>(p.referencia_snapshot||'')+' × '+p.cantidad).join(', ') : '',
      referencia:'', ubicacion:'',
      observaciones: r.observaciones||'',
      adjuntoUrl:'', adjuntoTipo:'',
      sourceTable:'mant_bastidor_registros', sourceId:r.id,
    });
  });
  rows.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  return rows;
}
