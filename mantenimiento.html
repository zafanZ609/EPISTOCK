<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --steel-900:#111827;
    --steel-800:#1f2937;
    --steel-700:#374151;
    --steel-600:#4b5563;
    --steel-400:#9ca3af;
    --steel-200:#e5e7eb;
    --steel-100:#f3f4f6;
    --steel-50:#f9fafb;
    --amber:#f59e0b;
    --amber-dark:#b45309;
    --amber-50:#fffbeb;
    --green:#16a34a;
    --red:#dc2626;
    --red-50:#fef2f2;
    --blue:#2563eb;
    --radius:12px;
    --shadow:0 1px 2px rgba(17,24,39,.06), 0 1px 3px rgba(17,24,39,.08);
    --shadow-lg:0 10px 25px -5px rgba(17,24,39,.15), 0 8px 10px -6px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--steel-100);
    color:var(--steel-900);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--steel-900) 0%,var(--steel-800) 45%,var(--steel-700) 100%);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:400px;background:#fff;border-radius:16px;
    box-shadow:var(--shadow-lg);padding:32px 28px;
  }
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
  .login-brand img{width:56px;height:56px;object-fit:contain;border-radius:10px;}
  .login-brand .empresa{font-size:12.5px;color:var(--steel-600);font-weight:600;letter-spacing:.02em;}
  .login-brand h1{font-size:22px;font-weight:800;margin:0;color:var(--steel-900);}
  .login-brand .sub{font-size:13px;color:var(--amber-dark);font-weight:600;background:var(--amber-50);padding:2px 10px;border-radius:999px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--steel-700);margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 12px;border:1.5px solid var(--steel-200);border-radius:9px;
    font-size:15px;color:var(--steel-900);outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:9px;padding:11px 18px;font-size:14.5px;font-weight:700;
    transition:filter .15s, transform .05s;width:100%;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--steel-900);color:#fff;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-amber{background:var(--amber);color:#1a1200;}
  .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--steel-600);}
  .btn-ghost:hover{background:var(--steel-100);}
  .btn-outline{background:#fff;color:var(--steel-800);border:1.5px solid var(--steel-200);}
  .btn-outline:hover{border-color:var(--steel-400);}
  .btn-danger{background:var(--red-50);color:var(--red);}
  .btn-danger:hover{filter:brightness(0.98);}
  .btn-sm{width:auto;padding:7px 12px;font-size:13px;border-radius:7px;}
  .btn[disabled]{opacity:.5;pointer-events:none;}
  .login-alt{text-align:center;margin-top:16px;}
  .login-alt button{background:none;border:none;color:var(--steel-600);font-size:12.5px;text-decoration:underline;}
  .error-box{background:var(--red-50);color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .info-box{background:var(--amber-50);color:var(--amber-dark);border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}
  .hint{font-size:12px;color:var(--steel-400);margin-top:4px;}

  /* ---------- Shell ---------- */
  header.topbar{
    background:var(--steel-900);color:#fff;padding:12px 18px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-left img{width:32px;height:32px;border-radius:7px;object-fit:contain;background:#fff;}
  .topbar-titles{line-height:1.2;min-width:0;}
  .topbar-titles .app-name{font-weight:800;font-size:15px;}
  .topbar-titles .empresa-name{font-size:11px;color:var(--steel-400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .user-chip{font-size:12.5px;background:var(--steel-800);padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .user-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .logout-btn{background:transparent;border:1px solid var(--steel-700);color:var(--steel-200);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600;}
  .logout-btn:hover{background:var(--steel-800);}

  nav.tabs{
    background:#fff;border-bottom:1px solid var(--steel-200);display:flex;gap:2px;padding:0 12px;
    overflow-x:auto;position:sticky;top:56px;z-index:15;
  }
  nav.tabs button{
    background:none;border:none;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--steel-600);
    border-bottom:3px solid transparent;white-space:nowrap;
  }
  nav.tabs button.active{color:var(--steel-900);border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--steel-900);}

  main.content{flex:1;padding:20px 16px 60px;max-width:920px;margin:0 auto;width:100%;}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h2{font-size:15.5px;margin:0 0 14px;font-weight:700;color:var(--steel-900);}
  .card h3{font-size:13.5px;margin:0 0 10px;font-weight:700;color:var(--steel-700);}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--steel-400);margin:0 0 8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--steel-900);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
    z-index:100;display:flex;align-items:center;gap:8px;
  }
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}

  /* ---------- Wizard ---------- */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-btn{
    padding:9px 14px;border-radius:9px;border:1.5px solid var(--steel-200);background:#fff;
    font-size:13.5px;font-weight:600;color:var(--steel-700);
  }
  .chip-btn.selected{border-color:var(--amber);background:var(--amber-50);color:var(--amber-dark);}
  .tipo-row{display:flex;gap:10px;}
  .tipo-btn{
    flex:1;padding:14px;border-radius:10px;border:1.5px solid var(--steel-200);background:#fff;
    font-weight:700;font-size:14px;text-align:center;color:var(--steel-700);
  }
  .tipo-btn.preventivo.selected{border-color:var(--blue);background:#eff6ff;color:var(--blue);}
  .tipo-btn.correctivo.selected{border-color:var(--red);background:var(--red-50);color:var(--red);}

  .elemento-block{border:1px solid var(--steel-200);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .elemento-head{background:var(--steel-50);padding:11px 14px;font-weight:700;font-size:13.5px;color:var(--steel-800);}
  .elemento-body{padding:8px 14px 12px;}
  .tarea-node{margin:2px 0;}
  .tarea-group-label{font-size:12.5px;font-weight:700;color:var(--steel-600);margin:8px 0 2px;padding-left:2px;}
  .tarea-check{display:flex;align-items:flex-start;gap:9px;padding:7px 2px;border-radius:7px;cursor:pointer;}
  .tarea-check:hover{background:var(--steel-50);}
  .tarea-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--amber-dark);flex-shrink:0;}
  .tarea-check .label{font-size:13.5px;color:var(--steel-900);}
  .tarea-check .meta{font-size:11.5px;color:var(--steel-400);margin-top:1px;}
  .tarea-children{margin-left:22px;border-left:2px solid var(--steel-100);padding-left:8px;}

  /* ---------- Wizard: navegación en cascada por niveles ---------- */
  .elemento-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .elemento-card{
    position:relative;padding:14px 18px;border-radius:10px;border:1.5px solid var(--steel-200);background:#fff;
    font-weight:700;font-size:14px;color:var(--steel-700);min-width:110px;text-align:center;
  }
  .elemento-card.active{border-color:var(--steel-900);background:var(--steel-900);color:#fff;}
  .elemento-card-badge{
    position:absolute;top:-7px;right:-7px;background:var(--amber);color:#1a1200;font-size:11px;font-weight:800;
    width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .nivel-browser{margin-top:16px;border:1px solid var(--steel-200);border-radius:10px;padding:14px;background:var(--steel-50);}
  .breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px;font-size:12.5px;}
  .breadcrumb button{background:none;border:none;color:var(--amber-dark);font-weight:700;font-size:12.5px;padding:2px 4px;}
  .breadcrumb button:last-child{color:var(--steel-900);}
  .breadcrumb .crumb-sep{color:var(--steel-400);}
  .nivel-list{display:flex;flex-direction:column;gap:8px;}
  .nivel-card{
    display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--steel-200);border-radius:10px;
    padding:10px 12px;text-align:left;width:100%;
  }
  .nivel-card.branch{padding:4px;gap:4px;}
  .nivel-card.branch:hover{border-color:var(--steel-400);}
  .nivel-card .chevron{color:var(--steel-400);font-size:18px;}
  .nivel-card-inner{flex:1;background:none;border:none;display:flex;align-items:center;justify-content:space-between;padding:8px 8px;font-weight:700;color:var(--steel-800);font-size:14px;text-align:left;border-radius:7px;}
  .nivel-card-inner:hover{background:var(--steel-50);}
  .pdf-btn{display:inline-flex;align-items:center;gap:4px;background:var(--steel-100);color:var(--steel-700);font-size:12px;font-weight:700;padding:8px 10px;border-radius:8px;text-decoration:none;flex-shrink:0;white-space:nowrap;}
  .pdf-btn:hover{background:var(--steel-200);}
  .stock-badge{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#f0fdf4;color:var(--green);}
  .stock-badge.low{background:var(--amber-50);color:var(--amber-dark);}
  .stock-badge.zero{background:var(--red-50);color:var(--red);}

  /* ---------- Selector de tipo de mantenimiento ---------- */
  .wiz-subheader{margin-bottom:2px;}
  .btn-back{background:none;border:none;color:var(--amber-dark);font-weight:700;font-size:12.5px;padding:0;}
  .tipo-mant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .tipo-mant-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:12px;border:1.5px solid var(--steel-200);background:#fff;font-weight:700;font-size:13px;color:var(--steel-700);text-align:center;}
  .tipo-mant-card:hover{border-color:var(--steel-400);}
  .tipo-mant-icon{font-size:28px;}
  .tipo-mant-label{line-height:1.25;}

  /* ---------- Checklist extintores ---------- */
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .checklist-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--steel-200);border-radius:9px;background:#fff;}
  .checklist-q{font-size:13.5px;color:var(--steel-900);flex:1;}
  .checklist-toggle{display:flex;gap:6px;flex-shrink:0;}
  .chk-btn{padding:6px 12px;border-radius:7px;border:1.5px solid var(--steel-200);background:#fff;font-size:12.5px;font-weight:700;color:var(--steel-600);}
  .chk-btn.si.active{border-color:var(--green);background:#f0fdf4;color:var(--green);}
  .chk-btn.no.active{border-color:var(--red);background:var(--red-50);color:var(--red);}
  .nivel-card.leaf{cursor:pointer;}
  .nivel-card.leaf:hover{border-color:var(--steel-400);}
  .nivel-card.leaf.selected{border-color:var(--amber);background:var(--amber-50);}
  .nivel-card.leaf input{width:17px;height:17px;accent-color:var(--amber-dark);flex-shrink:0;}
  .nivel-photo{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--steel-200);flex-shrink:0;}
  .nivel-photo.ph{display:flex;align-items:center;justify-content:center;background:var(--steel-100);font-size:18px;}
  .nivel-info{min-width:0;}
  .nivel-card-name{font-size:13.5px;font-weight:700;color:var(--steel-900);}
  .nivel-meta{font-size:11.5px;color:var(--steel-600);margin-top:1px;}
  .nivel-card.leaf-wrap{flex-direction:column;align-items:stretch;padding:4px;gap:0;cursor:default;}
  .nivel-card.leaf-wrap:hover{border-color:var(--steel-200);}
  .nivel-card.leaf-wrap.selected{border-color:var(--amber);background:var(--amber-50);}
  .leaf-toggle{display:flex;align-items:center;gap:10px;padding:8px 8px;cursor:pointer;width:100%;}
  .leaf-toggle input{width:17px;height:17px;accent-color:var(--amber-dark);flex-shrink:0;}
  .leaf-toggle .nivel-card-name{flex:1;}
  .repuesto-subpicker{padding:2px 8px 8px 32px;display:flex;flex-direction:column;gap:8px;}
  .repuesto-hint{font-size:11.5px;color:var(--steel-500);margin:0 0 2px 32px;}

  .selected-summary{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .sel-chip{background:var(--steel-900);color:#fff;font-size:12px;font-weight:600;padding:6px 8px 6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;}
  .sel-chip button{background:none;border:none;color:var(--steel-400);font-size:13px;padding:0;line-height:1;}
  .sel-chip button:hover{color:#fff;}

  textarea{width:100%;padding:10px 12px;border:1.5px solid var(--steel-200);border-radius:9px;font-size:14px;resize:vertical;min-height:70px;outline:none;}
  textarea:focus{border-color:var(--amber);}

  /* ---------- Registros / historial ---------- */
  .registro-card{border:1px solid var(--steel-200);border-radius:10px;padding:14px;margin-bottom:10px;}
  .registro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .registro-linea{font-weight:800;font-size:14.5px;color:var(--steel-900);}
  .registro-fecha{font-size:12px;color:var(--steel-400);}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
  .badge.preventivo{background:#eff6ff;color:var(--blue);}
  .badge.correctivo{background:var(--red-50);color:var(--red);}
  .item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--steel-200);font-size:13px;}
  .item-row:first-of-type{border-top:none;}
  .item-row img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--steel-200);}
  .item-row .imgph{width:34px;height:34px;border-radius:6px;background:var(--steel-100);flex-shrink:0;}
  .item-text b{color:var(--steel-900);}
  .item-text .mini{color:var(--steel-400);font-size:11.5px;}
  .obs-line{font-size:12.5px;color:var(--steel-600);margin-top:8px;font-style:italic;}
  .worker-line{font-size:12px;color:var(--steel-400);margin-top:2px;}

  .filters-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filters-row select, .filters-row input{padding:8px 10px;border:1.5px solid var(--steel-200);border-radius:8px;font-size:13px;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel-400);padding:8px 10px;border-bottom:1.5px solid var(--steel-200);}
  table.admin-table td{padding:9px 10px;border-bottom:1px solid var(--steel-100);vertical-align:middle;}
  table.admin-table tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .hist-table{font-size:12.5px;}
  .hist-table th{white-space:nowrap;position:sticky;top:0;background:#fff;}
  .hist-table td{white-space:nowrap;color:var(--steel-800);}
  .hist-table td.obs-cell{white-space:normal;max-width:220px;color:var(--steel-600);}
  .hist-table tbody tr:nth-child(odd){background:var(--steel-50);}
  .hist-table tbody tr:hover{background:var(--amber-50);}
  .hist-thumb{width:26px;height:26px;object-fit:cover;border-radius:5px;border:1px solid var(--steel-200);display:block;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .pill.on{background:#f0fdf4;color:var(--green);}
  .pill.off{background:var(--steel-100);color:var(--steel-600);}

  .inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px;padding-top:12px;border-top:1px dashed var(--steel-200);}
  .inline-form .field{margin-bottom:0;min-width:140px;flex:1;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--steel-200);background:#fff;font-size:12.5px;font-weight:600;color:var(--steel-600);}
  .subtabs button.active{background:var(--steel-900);color:#fff;border-color:var(--steel-900);}

  .tree-node{margin:3px 0;}
  .tree-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:var(--steel-50);}
  .tree-row .name{font-size:13.5px;font-weight:600;flex:1;}
  .tree-row .meta{font-size:11px;color:var(--steel-400);}
  .tree-children{margin-left:20px;border-left:2px solid var(--steel-100);padding-left:10px;}
  .icon-btn{background:none;border:1px solid var(--steel-200);border-radius:6px;width:26px;height:26px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--steel-600);}
  .icon-btn:hover{background:#fff;border-color:var(--steel-400);}
  .task-edit-box{background:#fff;border:1px solid var(--steel-200);border-radius:9px;padding:10px;margin-top:6px;}
  .task-edit-box .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .task-edit-box input{padding:8px 9px;border:1.5px solid var(--steel-200);border-radius:7px;font-size:12.5px;flex:1;min-width:120px;}
  .thumb-preview{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--steel-200);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--steel-400);font-size:13.5px;}
  .spinner{width:26px;height:26px;border:3px solid var(--steel-200);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  @media (max-width:520px){
    .login-card{padding:26px 20px;}
    .topbar-titles .empresa-name{max-width:140px;}
  }
</style>
</head>
<body>
<div id="app"><div class="center-loading"><div class="spinner"></div></div></div>

<script>
/* ============================================================
   CONFIG

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtFechaHora(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('es-ES', {timeZone:'Europe/Madrid', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso; }
}
let toastTimer=null;
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  setTimeout(()=>el.remove(), 3200);
}

async function onContinuarNumero(){
  const numero = (document.getElementById('in-numero').value || '').trim();
  if(!numero){ state.loginError='Introduce tu número de empleado.'; render(); return; }
  state.loginNumero = numero;
  state.loginLoading = true; state.loginError=''; render();
  try{
    const { data, error } = await sb.rpc('trabajador_estado', { p_numero_empleado: numero });
    state.loginLoading = false;
    if(error){ state.loginError = 'No se pudo comprobar el número de empleado.'; render(); return; }
    if(!data || !data.existe){ state.loginError = 'Número de empleado no encontrado o inactivo.'; render(); return; }
    state.loginNombrePreview = data.nombre || '';
    if(data.tiene_password){ state.loginStep='password'; } else { state.loginStep='crear'; }
    render();
  }catch(e){
    state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render();
  }
}

async function onCrearPassword(){
  const p1 = document.getElementById('in-pass1').value;
  const p2 = document.getElementById('in-pass2').value;
  if(!p1 || p1.length<6){ state.loginError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(p1!==p2){ state.loginError='Las contraseñas no coinciden.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  try{
    const { data:signUpData, error:signUpErr } = await sb.auth.signUp({ email, password:p1 });
    if(signUpErr){ state.loginLoading=false; state.loginError = signUpErr.message.includes('already') ? 'Ya existe una cuenta para este número de empleado.' : signUpErr.message; render(); return; }
    const { error:vincErr } = await sb.rpc('vincular_trabajador', { p_numero_empleado: state.loginNumero });
    if(vincErr){ state.loginLoading=false; state.loginError = 'No se pudo vincular tu cuenta: '+vincErr.message; render(); return; }
    if(!signUpData.session){
      const { error:signInErr } = await sb.auth.signInWithPassword({ email, password:p1 });
      if(signInErr){ state.loginLoading=false; state.loginError = signInErr.message; render(); return; }
    }
    state.loginLoading=false;
  }catch(e){
    state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render();
  }
}

async function onEntrarPassword(){
  const pass = document.getElementById('in-pass').value;
  if(!pass){ state.loginError='Introduce tu contraseña.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  state.loginLoading=false;
  if(error){ state.loginError='Contraseña incorrecta.'; render(); return; }
}

async function onAdminEntrar(){

async function loadElementosParaAmbito(ambito, ambitoId){
  const w = state.wizard;
  const table = ambito==='linea' ? 'mant_linea_elementos' : 'mant_vehiculo_elementos';
  const fkCol = ambito==='linea' ? 'linea_id' : 'vehiculo_id';
  const { data:linkRows } = await sb.from(table).select('elemento_id, mant_elementos(id,nombre,activo)').eq(fkCol, ambitoId);
  w.elementos = (linkRows||[]).map(r=>r.mant_elementos).filter(e=>e && e.activo);

async function ensureElementoTree(elementoId){
  const w = state.wizard;
  if(w.treeCache[elementoId]) return;
  const elemento = w.elementos.find(e=>e.id===elementoId);
  const { data:tareas } = await sb.from('mant_tareas').select('*').eq('elemento_id', elementoId).eq('activo', true).order('orden');
  const tareaIds = (tareas||[]).map(t=>t.id);
  const repuestosPorTarea = {};
  if(tareaIds.length){
    const { data:links } = await sb.from('mant_tarea_repuestos').select('tarea_id, mant_repuestos(*)').in('tarea_id', tareaIds);
    (links||[]).forEach(l=>{
      if(!l.mant_repuestos || l.mant_repuestos.activo===false) return;
      (repuestosPorTarea[l.tarea_id] = repuestosPorTarea[l.tarea_id] || []).push(l.mant_repuestos);
    });
  }
  w.treeCache[elementoId] = buildTareaTree(tareas||[], elemento, repuestosPorTarea);
}

function buildTareaTree(tareas, elemento, repuestosPorTarea){
  repuestosPorTarea = repuestosPorTarea || {};
  const byId = {};
  tareas.forEach(t=> byId[t.id] = Object.assign({}, t, {children:[], repuestos: repuestosPorTarea[t.id] || []}));
  const roots = [];
  tareas.forEach(t=>{
    if(t.parent_id && byId[t.parent_id]){ byId[t.parent_id].children.push(byId[t.id]); }
    else { roots.push(byId[t.id]); }
  });
  const tareaIndex = {};
  function walk(node, pathParts){
    const path = pathParts.concat([node.nombre]);
    if(node.children.length===0){
      tareaIndex[node.id] = {
        elemento_id: elemento.id,
        elemento_nombre: elemento.nombre,
        tarea_nombre: path.join(' › '),
        tarea_id: node.id,
        repuestos: node.repuestos || [],
      };
    } else {
      node.children.forEach(c=> walk(c, path));
    }
  }
  roots.forEach(r=> walk(r, []));
  return { roots, byId, tareaIndex };
}

function countSelectedForElemento(elementoId){
  let n = 0;
  for(const info of state.wizard.selected.values()){ if(info.elemento_id===elementoId) n++; }
  return n;
}

function drawAmbitoChips(w, label){
  if(w.ambitos===null){ return `<div class="section-title">${esc(label)}</div><div class="spinner"></div>`; }
  let html = `<div class="section-title">${esc(label)}</div><div class="chip-row" id="wiz-ambitos">`;
  html += w.ambitos.map(a=>`<button class="chip-btn ${w.ambitoId===a.id?'selected':''}" data-ambito="${a.id}">${esc(a.label)}</button>`).join('');
  html += '</div>';
  return html;
}

function drawTipoRepYElemento(w){
  let html = '';
  html += '<div class="section-title" style="margin-top:18px;">Tipo de reparación</div>';
  html += `<div class="tipo-row">
    <button class="tipo-btn preventivo ${w.tipoRep==='preventivo'?'selected':''}" data-tiporep="preventivo">🔧 Preventivo</button>
    <button class="tipo-btn correctivo ${w.tipoRep==='correctivo'?'selected':''}" data-tiporep="correctivo">⚠️ Correctivo</button>
  </div>`;

  if(w.tipoRep){
    html += '<div class="section-title" style="margin-top:18px;">Elemento a reparar</div>';
    if(w.elementos===null){ html += '<div class="spinner"></div>'; }
    else if(w.elementos.length===0){ html += '<div class="empty-state">Todavía no hay elementos configurados aquí. Añádelos desde Catálogo.</div>'; }
    else {
      html += '<div class="elemento-grid" id="wiz-elementos">';
      html += w.elementos.map(e=>{
        const n = countSelectedForElemento(e.id);
        return `<button class="elemento-card ${w.elementoId===e.id?'active':''}" data-elemento="${e.id}"><span class="elemento-card-name">${esc(e.nombre)}</span>${n>0?`<span class="elemento-card-badge">${n}</span>`:''}</button>`;
      }).join('');
      html += '</div>';
      if(w.elementoId){
        const cache = w.treeCache[w.elementoId];
        if(!cache){ html += '<div class="spinner"></div>'; }
        else { const elemento=w.elementos.find(e=>e.id===w.elementoId); html += renderNivelBrowser(w, cache, elemento?elemento.nombre:''); }
      }
    }
  }

  if(w.selected.size>0){
    html += '<div class="section-title" style="margin-top:18px;">Seleccionado para este registro</div><div class="selected-summary">';
    for(const [tid, info] of w.selected){
      const repCount = info.repuestoIds ? info.repuestoIds.size : 0;
      const label = info.tarea_nombre + (repCount>0 ? ` · ${repCount} repuesto${repCount>1?'s':''}` : '');
      html += `<span class="sel-chip">${esc(label)}<button data-remove="${tid}">✕</button></span>`;
    }
    html += '</div>';
  }

  html += '<div class="section-title" style="margin-top:18px;">Observaciones (opcional)</div>';
  html += `<textarea id="wiz-obs" placeholder="Notas adicionales...">${esc(w.observaciones)}</textarea>`;

  const canSave = w.tipoRep && w.selected.size>0;
  html += `<div style="margin-top:18px;"><button class="btn btn-amber" id="btn-guardar-arbol" ${canSave?'':'disabled'}>Guardar registro</button></div>`;
  return html;
}

function renderNivelBrowser(w, cache, elementoNombre){
  const currentParent = w.navStack.length ? cache.byId[w.navStack[w.navStack.length-1]] : null;
  const currentNodes = currentParent ? currentParent.children : cache.roots;

  let html = '<div class="nivel-browser">';
  html += `<div class="breadcrumb"><button data-crumb="-1">${esc(elementoNombre)}</button>`;
  w.navStack.forEach((id,idx)=>{
    const node = cache.byId[id];
    html += `<span class="crumb-sep">›</span><button data-crumb="${idx}">${esc(node?node.nombre:'')}</button>`;
  });
  html += '</div>';

  if(currentNodes.length===0){
    html += '<div class="empty-state">No hay tareas configuradas aquí todavía. Añádelas desde Catálogo.</div>';
  } else {
    html += '<div class="nivel-list">';
    currentNodes.forEach(n=>{
      const isBranch = n.children && n.children.length>0;
      if(isBranch){
        html += `<div class="nivel-card branch">
          <button class="nivel-card-inner" data-drill="${n.id}"><span class="nivel-card-name">${esc(n.nombre)}</span><span class="chevron">›</span></button>
          ${n.pdf_url?`<a class="pdf-btn" href="${esc(n.pdf_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver instrucciones / plano">📄 PDF</a>`:''}
        </div>`;
      } else {
        const sel = w.selected.get(n.id);
        const checked = !!sel;
        const repuestos = n.repuestos || [];
        html += `<div class="nivel-card leaf-wrap ${checked?'selected':''}">
          <label class="leaf-toggle">
            <input type="checkbox" data-tarea="${n.id}" ${checked?'checked':''}>
            <span class="nivel-card-name">${esc(n.nombre)}</span>
          </label>
          ${n.pdf_url?`<a class="pdf-btn" style="margin:0 8px 6px 32px;align-self:flex-start;" href="${esc(n.pdf_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Ver instrucciones / plano">📄 PDF</a>`:''}`;
        if(checked && repuestos.length>0){
          html += `<div class="repuesto-hint">Repuestos usados en esta tarea (opcional):</div><div class="repuesto-subpicker">`;
          repuestos.forEach(r=>{
            const rChecked = sel.repuestoIds && sel.repuestoIds.has(r.id);
            const stockBadge = (r.stock!==null && r.stock!==undefined) ? `<span class="stock-badge ${r.stock<=0?'zero':r.stock<=2?'low':''}">Stock: ${r.stock}</span>` : '';
            html += `<label class="nivel-card leaf ${rChecked?'selected':''}">
              <input type="checkbox" data-repuesto="${n.id}|${r.id}" ${rChecked?'checked':''}>
              ${r.foto_url?`<img class="nivel-photo" src="${esc(r.foto_url)}">`:'<div class="nivel-photo ph">🔩</div>'}
              <div class="nivel-info">
                <div class="nivel-card-name">${esc(r.referencia)}</div>
                ${r.descripcion?`<div class="nivel-meta">${esc(r.descripcion)}</div>`:''}
                ${r.ubicacion?`<div class="nivel-meta">📍 ${esc(r.ubicacion)}</div>`:''}
                ${stockBadge}
              </div>
            </label>`;
          });
          html += '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function bindTipoRepYElementoEvents(w){
  document.querySelectorAll('.tipo-btn[data-tiporep]').forEach(btn=>{
    btn.onclick = ()=>{ w.tipoRep = btn.dataset.tiporep; drawWizard(); };
  });
  document.querySelectorAll('#wiz-elementos .elemento-card').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.elemento;
      w.elementoId=id; w.navStack=[];
      drawWizard();
      await ensureElementoTree(id);
      drawWizard();
    };
  });
  document.querySelectorAll('[data-crumb]').forEach(btn=>{
    btn.onclick = ()=>{ const idx=parseInt(btn.dataset.crumb,10); w.navStack = idx<0?[]:w.navStack.slice(0,idx+1); drawWizard(); };
  });
  document.querySelectorAll('[data-drill]').forEach(btn=>{
    btn.onclick = ()=>{ w.navStack.push(btn.dataset.drill); drawWizard(); };
  });
  document.querySelectorAll('.leaf-toggle input[data-tarea]').forEach(cb=>{
    cb.onchange = ()=>{
      const tid=cb.dataset.tarea; const cache=w.treeCache[w.elementoId];
      if(cb.checked){ w.selected.set(tid, Object.assign({}, cache.tareaIndex[tid], {repuestoIds:new Set()})); } else { w.selected.delete(tid); }
      drawWizard();
    };
  });
  document.querySelectorAll('input[data-repuesto]').forEach(cb=>{
    cb.onchange = ()=>{
      const [tid, rid] = cb.dataset.repuesto.split('|');
      const sel = w.selected.get(tid);
      if(!sel) return;
      if(!sel.repuestoIds) sel.repuestoIds = new Set();
      if(cb.checked){ sel.repuestoIds.add(rid); } else { sel.repuestoIds.delete(rid); }
      drawWizard();
    };
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{ btn.onclick=()=>{ w.selected.delete(btn.dataset.remove); drawWizard(); }; });
  const obs=document.getElementById('wiz-obs'); if(obs) obs.oninput = e=> w.observaciones=e.target.value;
  const btnG = document.getElementById('btn-guardar-arbol'); if(btnG) btnG.onclick = guardarRegistroArbol;
}

function bindArbolFlowEvents(){

      drawWizard();

      drawWizard();
    };

async function guardarRegistroArbol(){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-arbol');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const ambitoObj = (w.ambitos||[]).find(a=>a.id===w.ambitoId);
  const items = [];
  for(const it of w.selected.values()){
    const repIds = it.repuestoIds && it.repuestoIds.size ? Array.from(it.repuestoIds) : [];
    if(repIds.length===0){
      items.push({ tarea_id: it.tarea_id, elemento_nombre: it.elemento_nombre, tarea_nombre: it.tarea_nombre, repuesto_id:null, referencia:null, ubicacion:null, foto_url:null, descripcion:null });
    } else {
      repIds.forEach(rid=>{
        const r = (it.repuestos||[]).find(x=>x.id===rid);
        items.push({
          tarea_id: it.tarea_id, elemento_nombre: it.elemento_nombre, tarea_nombre: it.tarea_nombre,
          repuesto_id: rid, referencia: r?r.referencia:null, ubicacion: r?r.ubicacion:null, foto_url: r?r.foto_url:null, descripcion: r?r.descripcion:null,
        });
      });
    }
  }
  try{
    const { error } = await sb.rpc('registrar_mantenimiento_linea_vehiculo', {
      p_ambito: w.ambito,
      p_ambito_id: w.ambitoId,
      p_ambito_nombre: ambitoObj ? ambitoObj.label : null,
      p_tipo: w.tipoRep,
      p_observaciones: w.observaciones || null,
      p_items: items,
    });
    if(error) throw error;
    toast('Registro guardado correctamente', 'success');
    state.misRegistros = null; state.historial = null;
    resetArbolSelection(w);
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message, 'error');
    btn.disabled=false; btn.textContent='Guardar registro';
  }
}

async function guardarRegistroSimple(tipo){
  const w = state.wizard;
  const btn = document.getElementById('btn-guardar-simple');
  const fileInput = document.getElementById('sf-pdf');
  if(!w.simpleDescripcion || !w.simpleDescripcion.trim()){ toast('Escribe una descripción','error'); return; }
  btn.disabled=true; btn.textContent='Guardando…';
  try{
    let pdf_url=null;
    if(fileInput && fileInput.files && fileInput.files[0]){
      const file = fileInput.files[0];
      const path = tipo+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.pdf';
      const { error:upErr } = await sb.storage.from('mant-pdfs').upload(path, file);
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from('mant-pdfs').getPublicUrl(path);
      pdf_url = pub.publicUrl;
    }
    const { error } = await sb.from('mant_registros_simple').insert({
      trabajador_id: state.trabajador.id, numero_empleado: state.trabajador.numero_empleado, trabajador_nombre: state.trabajador.nombre,
      tipo, subtipo: w.simpleSubtipo || null, titulo: w.simpleTitulo || null,
      empresa_externa: w.simpleEmpresa || null, descripcion: w.simpleDescripcion, pdf_url,
    });

    state.misRegistros=null; state.historial=null;
    w.simpleTitulo=''; w.simpleDescripcion=''; w.simpleEmpresa=''; w.simpleSubtipo=null;
    drawWizard();
  }catch(e){
    toast('Error al guardar: '+e.message,'error');
    btn.disabled=false; btn.textContent='Guardar';
  }
}

/* ============================================================
   EVENTOS UNIFICADOS (líneas/vehículos + extintores + simples)
   ============================================================ */
async function loadAllEventos(scopeTrabajadorId){
  let qArbol = sb.from('mant_registros').select('*, mant_registro_items(*)').order('ts',{ascending:false}).limit(1000);
  let qExt = sb.from('mant_extintor_revisiones').select('*, mant_extintor_revision_respuestas(*)').order('ts',{ascending:false}).limit(1000);
  let qSimple = sb.from('mant_registros_simple').select('*').order('ts',{ascending:false}).limit(1000);
  if(scopeTrabajadorId){
    qArbol = qArbol.eq('trabajador_id', scopeTrabajadorId);
    qExt = qExt.eq('trabajador_id', scopeTrabajadorId);
    qSimple = qSimple.eq('trabajador_id', scopeTrabajadorId);
  }
  const [{data:arbol}, {data:ext}, {data:simple}] = await Promise.all([qArbol, qExt, qSimple]);
  const rows = [];
  (arbol||[]).forEach(r=>{
    const items = (r.mant_registro_items && r.mant_registro_items.length) ? r.mant_registro_items : [null];
    items.forEach(it=>{
      rows.push({
        ts: r.ts,
        tipoCode: r.ambito==='vehiculo' ? 'carretillas' : 'lineas_fabricacion',
        tipoLabel: r.ambito==='vehiculo' ? 'Carretillas (interno)' : 'Líneas de Fabricación',
        referenciaAmbito: r.ambito==='vehiculo' ? (r.vehiculo_nombre||'') : (r.linea_codigo||''),
        subtipo: r.tipo,
        numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
        detalle: it ? (it.elemento_nombre+' › '+it.tarea_nombre) : '',
        referencia: it?(it.referencia||''):'', ubicacion: it?(it.ubicacion||''):'',
        observaciones: r.observaciones||'',
        adjuntoUrl: it?(it.foto_url||''):'', adjuntoTipo: it&&it.foto_url?'foto':'',
        sourceTable:'mant_registros', sourceId:r.id,
      });
    });
  });
  (ext||[]).forEach(r=>{
    const resp = r.mant_extintor_revision_respuestas||[];
    let detalle;
    if(r.tipo==='trimestral'){
      const noOk = resp.filter(x=>x.respuesta===false).length;
      detalle = 'Checklist: '+resp.length+' preguntas'+(noOk?', '+noOk+' con incidencia':', todo correcto');
    } else {
      detalle = 'Inspección anual empresa externa';
    }
    rows.push({
      ts: r.ts, tipoCode:'extintores', tipoLabel:'Extintores',
      referenciaAmbito: 'Nº '+(r.extintor_numero||''),
      subtipo: r.tipo==='trimestral'?'Revisión trimestral':'Inspección anual',
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle, referencia:'', ubicacion:'',
      observaciones: r.observaciones||'',
      adjuntoUrl: r.pdf_url||'', adjuntoTipo: r.pdf_url?'pdf':'',
      sourceTable:'mant_extintor_revisiones', sourceId:r.id,
    });
  });
  (simple||[]).forEach(r=>{
    const esCarretillaExterna = r.tipo==='carretillas_externo';
    const subtipoTxt = r.subtipo ? subtipoLabelFor(r.tipo, r.subtipo)
      : esCarretillaExterna ? ('Externo'+(r.empresa_externa?(' · '+r.empresa_externa):''))
      : (r.empresa_externa?('Empresa: '+r.empresa_externa):'');
    rows.push({
      ts: r.ts, tipoCode: esCarretillaExterna?'carretillas':r.tipo,
      tipoLabel: tipoMantLabel(esCarretillaExterna?'carretillas':r.tipo),
      referenciaAmbito: esCarretillaExterna ? (r.referencia_nombre||'') : (r.titulo || r.empresa_externa || ''),
      subtipo: subtipoTxt,
      numeroEmpleado: r.numero_empleado, operario: r.trabajador_nombre,
      detalle: r.descripcion||'', referencia:'', ubicacion:'',
      observaciones:'',
      adjuntoUrl: r.pdf_url||'', adjuntoTipo: r.pdf_url?'pdf':'',
      sourceTable:'mant_registros_simple', sourceId:r.id,
    });
  });
  rows.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
  return rows;
}

function drawHistorial(){
  const el = document.getElementById('tab-content');
  const h = state.historial;
  const f = state.historialFiltros;
  const rows = h.all.filter(r=>{
    if(f.tipoMant && r.tipoCode!==f.tipoMant) return false;
    if(f.trabajador && !(r.operario||'').toLowerCase().includes(f.trabajador.toLowerCase())) return false;
    if(f.desde && r.ts < f.desde) return false;
    if(f.hasta && r.ts > f.hasta+'T23:59:59') return false;
    return true;
  });

  let html = '<div class="card">';
  html += '<div class="toolbar"><h2 style="margin:0;">Historial de mantenimientos</h2><button class="btn btn-outline btn-sm" id="btn-export">⬇ Exportar CSV</button></div>';
  html += `<div class="filters-row">
    <select id="f-tipomant"><option value="">Todos los tipos</option>${TIPOS_MANTENIMIENTO.map(t=>`<option value="${t.code}" ${f.tipoMant===t.code?'selected':''}>${esc(t.label)}</option>`).join('')}</select>
    <input id="f-trab" type="text" placeholder="Buscar operario…" value="${esc(f.trabajador)}">
    <input id="f-desde" type="date" value="${esc(f.desde)}">
    <input id="f-hasta" type="date" value="${esc(f.hasta)}">
  </div>`;
  html += `<div class="hint" style="margin-bottom:10px;">${rows.length} registro(s)</div>`;
  html += '</div>';
  html += `<div class="card" style="padding:0;overflow:hidden;">${renderHistorialTable(rows)}</div>`;

  el.innerHTML = html;
  document.getElementById('f-tipomant').onchange = e=>{ f.tipoMant=e.target.value; drawHistorial(); };
  document.getElementById('f-trab').oninput = e=>{ f.trabajador=e.target.value; drawHistorial(); };
  document.getElementById('f-desde').onchange = e=>{ f.desde=e.target.value; drawHistorial(); };
  document.getElementById('f-hasta').onchange = e=>{ f.hasta=e.target.value; drawHistorial(); };
  document.getElementById('btn-export').onclick = ()=> exportCSV(rows);
  document.querySelectorAll('[data-delete-evento]').forEach(b=>{
    b.onclick = ()=>{ const [sourceTable, id] = b.dataset.deleteEvento.split('|'); borrarEventoHistorial(sourceTable, id); };
  });
}

function renderHistorialTable(rows){
  if(!rows || rows.length===0) return '<div class="empty-state">No hay registros con estos filtros.</div>';
  let html = '<div class="table-scroll"><table class="admin-table hist-table"><thead><tr>';
  html += ['Fecha','Hora','Tipo','Referencia','Subtipo','Nº','Operario','Detalle','Ref. repuesto','Ubicación','Observaciones','Adjunto',''].map(h=>`<th>${h}</th>`).join('');
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    const d = new Date(r.ts);
    const fecha = d.toLocaleDateString('es-ES',{timeZone:'Europe/Madrid'});
    const hora = d.toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid', hour:'2-digit', minute:'2-digit'});
    html += `<tr>
      <td>${fecha}</td><td>${hora}</td>
      <td>${esc(r.tipoLabel)}</td>
      <td>${esc(r.referenciaAmbito)}</td>
      <td>${esc(r.subtipo)}</td>
      <td>${esc(r.numeroEmpleado||'')}</td>
      <td>${esc(r.operario||'')}</td>
      <td>${esc(r.detalle||'')}</td>
      <td>${esc(r.referencia||'')}</td>
      <td>${esc(r.ubicacion||'')}</td>
      <td class="obs-cell">${esc(r.observaciones||'')}</td>
      <td>${r.adjuntoUrl?(r.adjuntoTipo==='foto'?`<img class="hist-thumb" src="${esc(r.adjuntoUrl)}">`:`<a class="pdf-btn" href="${esc(r.adjuntoUrl)}" target="_blank" rel="noopener">📄</a>`):''}</td>
      <td>${r.sourceTable&&r.sourceId?`<button class="icon-btn" data-delete-evento="${r.sourceTable}|${r.sourceId}" title="Eliminar registro">🗑</button>`:''}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

async function borrarEventoHistorial(sourceTable, id){
  const h = state.historial;
  const relacionadas = h.all.filter(r=>r.sourceTable===sourceTable && r.sourceId===id).length;
  const msg = relacionadas>1
    ? `¿Eliminar este registro completo? Incluye ${relacionadas} líneas (tareas/repuestos) y no se puede deshacer.`
    : '¿Eliminar este registro? Esta acción no se puede deshacer.';
  if(!confirm(msg)) return;
  const { error } = await sb.from(sourceTable).delete().eq('id', id);
  if(error){ toast('Error al eliminar: '+error.message, 'error'); return; }
  h.all = h.all.filter(r=>!(r.sourceTable===sourceTable && r.sourceId===id));
  state.misRegistros = null;
  drawHistorial();
  toast('Registro eliminado','success');
}

function exportCSV(rows){
  const lines = [['Fecha','Hora','Tipo','Referencia','Subtipo','Nº empleado','Operario','Detalle','Ref. repuesto','Ubicacion','Observaciones','Adjunto'].join(';')];
  rows.forEach(r=>{
    const d = new Date(r.ts);
    const fecha = d.toLocaleDateString('es-ES',{timeZone:'Europe/Madrid'});
    const hora = d.toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid'});
    lines.push([fecha,hora,r.tipoLabel,r.referenciaAmbito,r.subtipo,r.numeroEmpleado||'',r.operario||'',r.detalle||'',r.referencia||'',r.ubicacion||'',r.observaciones||'',r.adjuntoUrl||''].map(csvEsc).join(';'));
  });
  const csv = '﻿'+lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mantenimientos_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEsc(v){ v = String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }

    if(!tareas){
      html += '<div class="spinner"></div>';
    } else {
      const tree = buildTareaTreeAdmin(tareas);
      html += `<div id="tarea-tree">${renderAdminTareaNodes(tree)}</div>`;
      html += `<div class="inline-form">
        <div class="field"><label>Nueva tarea raíz</label><input id="nt-nombre" placeholder="Ej. Limpiar"></div>
        <button class="btn btn-outline btn-sm" id="btn-add-tarea-root">+ Añadir tarea</button>
      </div>`;
    }
  }
  html += '</div>';
  return html;
}

function buildTareaTreeAdmin(tareas){
  const byId = {};
  tareas.forEach(t=> byId[t.id]=Object.assign({}, t, {children:[]}));
  const roots=[];
  tareas.forEach(t=>{ if(t.parent_id && byId[t.parent_id]) byId[t.parent_id].children.push(byId[t.id]); else roots.push(byId[t.id]); });
  const sortRec = arr => { arr.sort((a,b)=>(a.orden||0)-(b.orden||0)); arr.forEach(n=>sortRec(n.children)); };
  sortRec(roots);
  return roots;
}

function bindCatalogoEvents(){
  const c = state.catalogo;
  document.querySelectorAll('[data-ctab]').forEach(b=>{
    b.onclick = ()=>{ state.catalogoTab = b.dataset.ctab; c.elementoSel=null; c.editingTareaId=null; c.addingSubTo=null; c.vehiculoSel=null; c.repuestoEditId=null; drawCatalogo(); };
  });

  const btnAddLinea = document.getElementById('btn-add-linea');
  if(btnAddLinea) btnAddLinea.onclick = async ()=>{
    const codigo = document.getElementById('nl-codigo').value.trim();
    const nombre = document.getElementById('nl-nombre').value.trim();
    if(!codigo){ toast('Introduce un código de línea','error'); return; }
    const { error } = await sb.from('mant_lineas').insert({ codigo, nombre: nombre||null });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.lineas = null; state.wizard=null;
    await ensureCatalogoLoaded(); drawCatalogo();
    toast('Línea añadida','success');
  };
  document.querySelectorAll('[data-toggle-linea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.toggleLinea;
      const l = c.lineas.find(x=>x.id===id);
      const { error } = await sb.from('mant_lineas').update({ activo: !l.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      l.activo = !l.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-linea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.deleteLinea;
      const l = c.lineas.find(x=>x.id===id);
      if(!confirm('¿Eliminar la línea "'+l.codigo+'"? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_lineas').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: esta línea tiene registros de mantenimiento guardados.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.lineas = c.lineas.filter(x=>x.id!==id);
      c.lineaElementos = c.lineaElementos.filter(le=>le.linea_id!==id);
      state.wizard=null; state.historial=null;
      drawCatalogo();
      toast('Línea eliminada','success');
    };
  });

  const btnAddElemento = document.getElementById('btn-add-elemento');
  if(btnAddElemento) btnAddElemento.onclick = async ()=>{
    const nombre = document.getElementById('ne-nombre').value.trim();
    if(!nombre){ toast('Introduce un nombre','error'); return; }
    const { error } = await sb.from('mant_elementos').insert({ nombre });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.elementos=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Elemento añadido','success');
  };
  document.querySelectorAll('[data-manage-elemento]').forEach(b=>{
    b.onclick = ()=>{ c.elementoSel = (c.elementoSel===b.dataset.manageElemento)? null : b.dataset.manageElemento; drawCatalogo(); };
  });
  document.querySelectorAll('[data-delete-elemento]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.deleteElemento;
      const elemento = c.elementos.find(x=>x.id===id);
      if(!confirm('¿Eliminar el elemento "'+elemento.nombre+'" y todas sus tareas? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_elementos').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: este elemento tiene tareas con registros de mantenimiento guardados.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.elementos = c.elementos.filter(x=>x.id!==id);
      c.lineaElementos = c.lineaElementos.filter(le=>le.elemento_id!==id);
      c.vehiculoElementos = (c.vehiculoElementos||[]).filter(ve=>ve.elemento_id!==id);
      delete c.tareasPorElemento[id];
      if(c.elementoSel===id) c.elementoSel=null;
      state.wizard=null; state.historial=null;
      drawCatalogo();
      toast('Elemento eliminado','success');
    };
  });
  document.querySelectorAll('[data-toggle-asig]').forEach(b=>{
    b.onclick = async ()=>{
      const lineaId = b.dataset.toggleAsig;
      const elementoId = c.elementoSel;
      const existing = c.lineaElementos.find(le=>le.elemento_id===elementoId && le.linea_id===lineaId);
      if(existing){
        await sb.from('mant_linea_elementos').delete().eq('elemento_id', elementoId).eq('linea_id', lineaId);
        c.lineaElementos = c.lineaElementos.filter(le=>!(le.elemento_id===elementoId && le.linea_id===lineaId));
      } else {
        await sb.from('mant_linea_elementos').insert({ elemento_id: elementoId, linea_id: lineaId });
        c.lineaElementos.push({elemento_id:elementoId, linea_id:lineaId});
      }
      state.wizard=null;
      drawCatalogo();
    };
  });

  const ctElemento = document.getElementById('ct-elemento');
  if(ctElemento) ctElemento.onchange = async ()=>{
    c.elementoSel = ctElemento.value || null;
    c.editingTareaId=null; c.addingSubTo=null;
    if(c.elementoSel && !c.tareasPorElemento[c.elementoSel]){
      drawCatalogo();
      const { data } = await sb.from('mant_tareas').select('*').eq('elemento_id', c.elementoSel).order('orden');
      c.tareasPorElemento[c.elementoSel] = data||[];
    }
    drawCatalogo();
  };
  const btnAddTareaRoot = document.getElementById('btn-add-tarea-root');
  if(btnAddTareaRoot) btnAddTareaRoot.onclick = async ()=>{
    const nombre = document.getElementById('nt-nombre').value.trim();
    if(!nombre){ toast('Introduce un nombre','error'); return; }
    const { error } = await sb.from('mant_tareas').insert({ elemento_id: c.elementoSel, nombre, parent_id:null, orden: (c.tareasPorElemento[c.elementoSel]||[]).length });
    if(error){ toast('Error: '+error.message,'error'); return; }
    await recargarTareas(c.elementoSel);
    toast('Tarea añadida','success');
  };
  document.querySelectorAll('[data-edit-tarea]').forEach(b=>{
    b.onclick = ()=>{ c.editingTareaId = (c.editingTareaId===b.dataset.editTarea)?null:b.dataset.editTarea; c.addingSubTo=null; drawCatalogo(); };
  });
  document.querySelectorAll('[data-cancel-edit]').forEach(b=>{ b.onclick = ()=>{ c.editingTareaId=null; drawCatalogo(); }; });
  document.querySelectorAll('[data-add-sub]').forEach(b=>{
    b.onclick = ()=>{ c.addingSubTo = (c.addingSubTo===b.dataset.addSub)?null:b.dataset.addSub; c.editingTareaId=null; drawCatalogo(); };
  });
  document.querySelectorAll('[data-cancel-sub]').forEach(b=>{ b.onclick = ()=>{ c.addingSubTo=null; drawCatalogo(); }; });

  document.querySelectorAll('[data-save-sub]').forEach(b=>{
    b.onclick = async ()=>{
      const parentId = b.dataset.saveSub;
      const nombre = document.getElementById('as-nombre').value.trim();
      if(!nombre){ toast('Introduce un nombre','error'); return; }
      const { error } = await sb.from('mant_tareas').insert({ elemento_id: c.elementoSel, parent_id: parentId, nombre, orden: 0 });
      if(error){ toast('Error: '+error.message,'error'); return; }
      c.addingSubTo=null;
      await recargarTareas(c.elementoSel);
      toast('Subtarea añadida','success');
    };
  });

  document.querySelectorAll('[data-save-tarea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveTarea;
      const nombre = document.getElementById('et-nombre').value.trim();
      const pdfInput = document.getElementById('et-pdf');
      let pdf_url;
      b.disabled = true; b.textContent='Guardando…';
      if(pdfInput.files && pdfInput.files[0]){
        const file = pdfInput.files[0];
        const path = 'tareas/'+id+'-'+Date.now()+'.pdf';
        const { error:upErr } = await sb.storage.from('mant-pdfs').upload(path, file, { upsert:true });
        if(upErr){ toast('Error subiendo PDF: '+upErr.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }
        const { data:pub } = sb.storage.from('mant-pdfs').getPublicUrl(path);
        pdf_url = pub.publicUrl;
      }
      const payload = { nombre };
      if(pdf_url) payload.pdf_url = pdf_url;
      const { error } = await sb.from('mant_tareas').update(payload).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }
      c.editingTareaId=null;
      await recargarTareas(c.elementoSel);
      toast('Tarea actualizada','success');
    };
  });
  document.querySelectorAll('[data-toggle-tarea-repuesto]').forEach(b=>{
    b.onclick = async ()=>{
      const [tareaId, repuestoId] = b.dataset.toggleTareaRepuesto.split('|');
      const existing = (c.tareaRepuestos||[]).find(tr=>tr.tarea_id===tareaId && tr.repuesto_id===repuestoId);
      if(existing){
        await sb.from('mant_tarea_repuestos').delete().eq('tarea_id',tareaId).eq('repuesto_id',repuestoId);
        c.tareaRepuestos = c.tareaRepuestos.filter(tr=>!(tr.tarea_id===tareaId && tr.repuesto_id===repuestoId));
      } else {
        const { data, error } = await sb.from('mant_tarea_repuestos').insert({ tarea_id: tareaId, repuesto_id: repuestoId }).select().single();
        if(error){ toast('Error: '+error.message,'error'); return; }
        c.tareaRepuestos.push({ id:data.id, tarea_id:tareaId, repuesto_id:repuestoId });
      }
      state.wizard=null;
      drawCatalogo();
    };
  });
  document.querySelectorAll('[data-toggle-tarea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.toggleTarea;
      const tareas = c.tareasPorElemento[c.elementoSel];
      const t = tareas.find(x=>x.id===id);
      const { error } = await sb.from('mant_tareas').update({ activo: !t.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      c.editingTareaId=null;
      await recargarTareas(c.elementoSel);
    };
  });

  // Vehículos
  const btnAddVehiculo = document.getElementById('btn-add-vehiculo');
  if(btnAddVehiculo) btnAddVehiculo.onclick = async ()=>{
    const nombre = document.getElementById('nv-nombre').value.trim();
    const modelo = document.getElementById('nv-modelo').value.trim();
    const numero_serie = document.getElementById('nv-serie').value.trim();
    const tipo_bateria = document.getElementById('nv-bateria').value.trim();
    if(!nombre){ toast('Introduce un nombre','error'); return; }
    const { error } = await sb.from('mant_vehiculos').insert({ nombre, modelo:modelo||null, numero_serie:numero_serie||null, tipo_bateria:tipo_bateria||null });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.vehiculos=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Vehículo añadido','success');
  };
  document.querySelectorAll('[data-toggle-vehiculo]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.toggleVehiculo; const v=c.vehiculos.find(x=>x.id===id);
      const { error } = await sb.from('mant_vehiculos').update({ activo: !v.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      v.activo=!v.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-vehiculo]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.deleteVehiculo; const v=c.vehiculos.find(x=>x.id===id);
      if(!confirm('¿Eliminar el vehículo "'+v.nombre+'"? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_vehiculos').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: este vehículo tiene registros de mantenimiento guardados.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.vehiculos = c.vehiculos.filter(x=>x.id!==id);
      c.vehiculoElementos = c.vehiculoElementos.filter(ve=>ve.vehiculo_id!==id);
      if(c.vehiculoSel===id) c.vehiculoSel=null;
      state.wizard=null; state.historial=null;
      drawCatalogo();
      toast('Vehículo eliminado','success');
    };
  });
  document.querySelectorAll('[data-manage-vehiculo]').forEach(b=>{
    b.onclick = ()=>{ c.vehiculoSel = (c.vehiculoSel===b.dataset.manageVehiculo)?null:b.dataset.manageVehiculo; drawCatalogo(); };
  });
  document.querySelectorAll('[data-toggle-vehiculo-elemento]').forEach(b=>{
    b.onclick = async ()=>{
      const elementoId = b.dataset.toggleVehiculoElemento;
      const vehiculoId = c.vehiculoSel;
      const existing = c.vehiculoElementos.find(ve=>ve.elemento_id===elementoId && ve.vehiculo_id===vehiculoId);
      if(existing){
        await sb.from('mant_vehiculo_elementos').delete().eq('elemento_id',elementoId).eq('vehiculo_id',vehiculoId);
        c.vehiculoElementos = c.vehiculoElementos.filter(ve=>!(ve.elemento_id===elementoId && ve.vehiculo_id===vehiculoId));
      } else {
        await sb.from('mant_vehiculo_elementos').insert({ elemento_id: elementoId, vehiculo_id: vehiculoId });
        c.vehiculoElementos.push({elemento_id:elementoId, vehiculo_id:vehiculoId});
      }
      state.wizard=null;
      drawCatalogo();
    };
  });

  // Extintores
  const btnAddExtintor = document.getElementById('btn-add-extintor');
  if(btnAddExtintor) btnAddExtintor.onclick = async ()=>{
    const numero = document.getElementById('nex-numero').value.trim();
    const tipo = document.getElementById('nex-tipo').value.trim();
    const ubicacion = document.getElementById('nex-ubicacion').value.trim();
    const fecha_fabricacion = document.getElementById('nex-fabricacion').value || null;
    const fecha_retimbrado = document.getElementById('nex-retimbrado').value || null;
    if(!numero){ toast('Introduce un número de extintor','error'); return; }
    const { error } = await sb.from('mant_extintores').insert({ numero, tipo:tipo||null, ubicacion:ubicacion||null, fecha_fabricacion, fecha_retimbrado });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.extintores=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Extintor dado de alta','success');
  };
  document.querySelectorAll('[data-toggle-extintor]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.toggleExtintor; const e=c.extintores.find(x=>x.id===id);
      const { error } = await sb.from('mant_extintores').update({ activo: !e.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      e.activo=!e.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-extintor]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.deleteExtintor; const e=c.extintores.find(x=>x.id===id);
      if(!confirm('¿Eliminar el extintor Nº '+e.numero+'? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_extintores').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: este extintor tiene revisiones guardadas. Márcalo como obsoleto en su lugar.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.extintores = c.extintores.filter(x=>x.id!==id);
      state.wizard=null; state.historial=null;
      drawCatalogo();
      toast('Extintor eliminado','success');
    };
  });
  const btnAddChecklist = document.getElementById('btn-add-checklist');
  if(btnAddChecklist) btnAddChecklist.onclick = async ()=>{
    const pregunta = document.getElementById('ncl-pregunta').value.trim();
    if(!pregunta){ toast('Introduce una pregunta','error'); return; }
    const { error } = await sb.from('mant_extintor_checklist_items').insert({ pregunta, orden: (c.checklist||[]).length });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.checklist=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Pregunta añadida','success');
  };
  document.querySelectorAll('[data-toggle-checklist]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.toggleChecklist; const q=c.checklist.find(x=>x.id===id);
      const { error } = await sb.from('mant_extintor_checklist_items').update({ activo: !q.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      q.activo=!q.activo; drawCatalogo();
    };
  });

  // Repuestos
  const btnAddRepuesto = document.getElementById('btn-add-repuesto');
  if(btnAddRepuesto) btnAddRepuesto.onclick = async ()=>{
    const referencia = document.getElementById('nr-referencia').value.trim();
    const descripcion = document.getElementById('nr-descripcion').value.trim();
    const ubicacion = document.getElementById('nr-ubicacion').value.trim();
    const stockRaw = document.getElementById('nr-stock').value;
    const fotoInput = document.getElementById('nr-foto');
    if(!referencia){ toast('Introduce una referencia','error'); return; }
    btnAddRepuesto.disabled = true; btnAddRepuesto.textContent='Guardando…';
    let foto_url = null;
    if(fotoInput.files && fotoInput.files[0]){
      const file = fotoInput.files[0];
      const ext = (file.name.split('.').pop()||'jpg');
      const path = 'repuestos/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const { error:upErr } = await sb.storage.from('mant-fotos').upload(path, file);
      if(upErr){ toast('Error subiendo foto: '+upErr.message,'error'); btnAddRepuesto.disabled=false; btnAddRepuesto.textContent='+ Añadir repuesto'; return; }
      const { data:pub } = sb.storage.from('mant-fotos').getPublicUrl(path);
      foto_url = pub.publicUrl;
    }
    const { error } = await sb.from('mant_repuestos').insert({
      referencia, descripcion: descripcion||null, ubicacion: ubicacion||null,
      stock: stockRaw===''?null:parseInt(stockRaw,10), foto_url,
    });
    if(error){ toast('Error: '+error.message,'error'); btnAddRepuesto.disabled=false; btnAddRepuesto.textContent='+ Añadir repuesto'; return; }
    c.repuestos=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Repuesto añadido','success');
  };
  document.querySelectorAll('[data-edit-repuesto]').forEach(b=>{
    b.onclick = ()=>{ c.repuestoEditId = (c.repuestoEditId===b.dataset.editRepuesto)?null:b.dataset.editRepuesto; drawCatalogo(); };
  });
  document.querySelectorAll('[data-cancel-edit-repuesto]').forEach(b=>{ b.onclick=()=>{ c.repuestoEditId=null; drawCatalogo(); }; });
  document.querySelectorAll('[data-save-repuesto]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveRepuesto;
      const referencia = document.getElementById('er-referencia').value.trim();
      const descripcion = document.getElementById('er-descripcion').value.trim();
      const ubicacion = document.getElementById('er-ubicacion').value.trim();
      const stockRaw = document.getElementById('er-stock').value;
      const fotoInput = document.getElementById('er-foto');
      if(!referencia){ toast('Introduce una referencia','error'); return; }
      b.disabled = true; b.textContent='Guardando…';
      let foto_url;
      if(fotoInput.files && fotoInput.files[0]){
        const file = fotoInput.files[0];
        const ext = (file.name.split('.').pop()||'jpg');
        const path = 'repuestos/'+id+'-'+Date.now()+'.'+ext;
        const { error:upErr } = await sb.storage.from('mant-fotos').upload(path, file, { upsert:true });
        if(upErr){ toast('Error subiendo foto: '+upErr.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }
        const { data:pub } = sb.storage.from('mant-fotos').getPublicUrl(path);
        foto_url = pub.publicUrl;
      }
      const payload = { referencia, descripcion: descripcion||null, ubicacion: ubicacion||null, stock: stockRaw===''?null:parseInt(stockRaw,10) };
      if(foto_url) payload.foto_url = foto_url;
      const { error } = await sb.from('mant_repuestos').update(payload).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }
      c.repuestoEditId=null; c.repuestos=null; await ensureCatalogoLoaded(); drawCatalogo();
      toast('Repuesto actualizado','success');
    };
  });
  document.querySelectorAll('[data-toggle-repuesto]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.toggleRepuesto; const r=c.repuestos.find(x=>x.id===id);
      const { error } = await sb.from('mant_repuestos').update({ activo: !r.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      r.activo=!r.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-repuesto]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.deleteRepuesto; const r=c.repuestos.find(x=>x.id===id);
      if(!confirm('¿Eliminar el repuesto "'+r.referencia+'"? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_repuestos').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: este repuesto tiene registros de mantenimiento guardados. Desactívalo en su lugar.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.repuestos = c.repuestos.filter(x=>x.id!==id);
      c.tareaRepuestos = (c.tareaRepuestos||[]).filter(tr=>tr.repuesto_id!==id);
      state.wizard=null;
      drawCatalogo();
      toast('Repuesto eliminado','success');
    };
  });
  document.querySelectorAll('[data-reponer]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.reponer;
      const input = document.getElementById('rep-'+id);
      const cantidad = parseInt(input.value,10);
      if(!cantidad || cantidad<1){ toast('Introduce una cantidad válida','error'); return; }
      const item = c.repuestos.find(x=>x.id===id);
      const nuevoStock = (item.stock||0) + cantidad;
      const { error } = await sb.from('mant_repuestos').update({ stock: nuevoStock }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      item.stock = nuevoStock;
      drawCatalogo();
      toast('Stock repuesto','success');
    };
  });
}

async function recargarTareas(elementoId){
  const { data } = await sb.from('mant_tareas').select('*').eq('elemento_id', elementoId).order('orden');
  state.catalogo.tareasPorElemento[elementoId] = data||[];
  drawCatalogo();
}

/* ============================================================
   TAB: ACCESOS (admin)
   ============================================================ */
async function renderTabAccesos(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="spinner"></div>';
  const [{data:trabs, error}, {data:permisos}] = await Promise.all([
    sb.from('trabajadores').select('*').order('numero_empleado'),
    sb.from('mant_tipos_permisos').select('*'),
  ]);
  if(error){ el.innerHTML = '<div class="card"><div class="error-box">No se pudo cargar la lista de trabajadores.</div></div>'; return; }
  state.accesos = trabs||[];
  state.accesosPermisos = permisos||[];
  drawAccesos();
}

function drawAccesos(){
  const el = document.getElementById('tab-content');
  const rows = state.accesos;
  let html = '<div class="card"><h2>Accesos y permisos de trabajadores</h2>';
  html += '<div class="hint" style="margin-bottom:12px;">Cada trabajador crea su propia contraseña la primera vez que entra con su número de empleado. Usa 🔧 para elegir qué tipos de mantenimiento puede registrar cada uno.</div>';
  html += '<table class="admin-table"><thead><tr><th>Nº</th><th>Nombre</th><th>Estado</th><th>Acceso</th><th></th></tr></thead><tbody>';
  rows.forEach(t=>{
    const tieneAcceso = !!t.auth_user_id;
    html += `<tr><td>${esc(t.numero_empleado)}</td><td>${esc(t.nombre)}</td>
      <td><span class="pill ${t.activo?'on':'off'}">${t.activo?'Activo':'Inactivo'}</span></td>
      <td><span class="pill ${tieneAcceso?'on':'off'}">${tieneAcceso?'Configurado':'Pendiente'}</span></td>
      <td>
        <button class="icon-btn" data-toggle-permisos="${t.id}" title="Tipos de mantenimiento">🔧</button>
        ${tieneAcceso?`<button class="btn btn-outline btn-sm" data-reset="${t.id}">Restablecer</button>`:''}
      </td></tr>`;
    if(state.accesosExpanded===t.id){
      const misPermisos = state.accesosPermisos.filter(p=>p.trabajador_id===t.id).map(p=>p.tipo);
      html += `<tr><td colspan="5" style="background:var(--steel-50);"><div class="chip-row" style="padding:10px 0;">`;
      html += TIPOS_MANTENIMIENTO.map(tm=>`<button class="chip-btn ${misPermisos.includes(tm.code)?'selected':''}" data-toggle-permiso="${t.id}|${tm.code}">${tm.icon} ${esc(tm.label)}</button>`).join('');
      html += `</div></td></tr>`;
    }
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
  document.querySelectorAll('[data-toggle-permisos]').forEach(b=>{
    b.onclick = ()=>{ state.accesosExpanded = state.accesosExpanded===b.dataset.togglePermisos ? null : b.dataset.togglePermisos; drawAccesos(); };
  });
  document.querySelectorAll('[data-toggle-permiso]').forEach(b=>{
    b.onclick = async ()=>{
      const [trabajadorId, tipo] = b.dataset.togglePermiso.split('|');
      const existing = state.accesosPermisos.find(p=>p.trabajador_id===trabajadorId && p.tipo===tipo);
      if(existing){
        await sb.from('mant_tipos_permisos').delete().eq('trabajador_id',trabajadorId).eq('tipo',tipo);
        state.accesosPermisos = state.accesosPermisos.filter(p=>!(p.trabajador_id===trabajadorId && p.tipo===tipo));
      } else {
        await sb.from('mant_tipos_permisos').insert({trabajador_id:trabajadorId, tipo});
        state.accesosPermisos.push({trabajador_id:trabajadorId, tipo});
      }
      drawAccesos();
    };
  });
  document.querySelectorAll('[data-reset]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Restablecer el acceso de este trabajador? Tendrá que crear una contraseña nueva en su próximo inicio de sesión.')) return;
      const id = b.dataset.reset;
      const { error } = await sb.rpc('admin_resetear_trabajador', { p_trabajador_id: id });
      if(error){ toast('Error: '+error.message,'error'); return; }
      toast('Acceso restablecido','success');
      state.accesos=null; renderTabAccesos();
    };
  });
}

/* ============================================================
   INIT
   ============================================================ */
bootstrap();

</script>
</body>
</html>
