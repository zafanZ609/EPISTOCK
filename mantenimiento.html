function drawHistorial(){
  const el = document.getElementById('tab-content');
  const h = state.historial;
  const f = state.historialFiltros;
  const rows = h.all.filter(r=>{
    if(f.tipoMant && r.tipoCode!==f.tipoMant) return false;
    if(f.trabajador && !(r.operario||'').toLowerCase().includes(f.trabajador.toLowerCase())) return false;
    if(f.desde && r.ts < f.desde) return false;
    if(f.hasta && r.ts > f.hasta+'T23:59:59') return false;
    return true;
  });

  let html = '<div class="card">';
  html += '<div class="toolbar"><h2 style="margin:0;">Historial de mantenimientos</h2><button class="btn btn-outline btn-sm" id="btn-export">⬇ Exportar CSV</button></div>';
  html += `<div class="filters-row">
    <select id="f-tipomant"><option value="">Todos los tipos</option>${TIPOS_MANTENIMIENTO.map(t=>`<option value="${t.code}" ${f.tipoMant===t.code?'selected':''}>${esc(t.label)}</option>`).join('')}</select>
    <input id="f-trab" type="text" placeholder="Buscar operario…" value="${esc(f.trabajador)}">
    <input id="f-desde" type="date" value="${esc(f.desde)}">
    <input id="f-hasta" type="date" value="${esc(f.hasta)}">
  </div>`;
  html += `<div class="hint" style="margin-bottom:10px;">${rows.length} registro(s)</div>`;
  html += '</div>';
  html += `<div class="card" style="padding:0;overflow:hidden;">${renderHistorialTable(rows)}</div>`;

  el.innerHTML = html;
  document.getElementById('f-tipomant').onchange = e=>{ f.tipoMant=e.target.value; drawHistorial(); };
  document.getElementById('f-trab').oninput = e=>{ f.trabajador=e.target.value; drawHistorial(); };
  document.getElementById('f-desde').onchange = e=>{ f.desde=e.target.value; drawHistorial(); };
  document.getElementById('f-hasta').onchange = e=>{ f.hasta=e.target.value; drawHistorial(); };
  document.getElementById('btn-export').onclick = ()=> exportCSV(rows);
  document.querySelectorAll('[data-delete-evento]').forEach(b=>{
    b.onclick = ()=>{ const [sourceTable, id] = b.dataset.deleteEvento.split('|'); borrarEventoHistorial(sourceTable, id); };
  });
  document.querySelectorAll('[data-doc-evento]').forEach(b=>{
    b.onclick = ()=>{ const [sourceTable, id] = b.dataset.docEvento.split('|'); generarDocumentoHistorial(sourceTable, id); };
  });
}

function renderHistorialTable(rows){
  if(!rows || rows.length===0) return '<div class="empty-state">No hay registros con estos filtros.</div>';
  let html = '<div class="table-scroll"><table class="admin-table hist-table"><thead><tr>';
  html += ['Fecha','Hora','Tipo','Referencia','Subtipo','Nº','Operario','Detalle','Ref. repuesto','Ubicación','Observaciones','Adjunto',''].map(h=>`<th>${h}</th>`).join('');
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    const d = new Date(r.ts);
    const fecha = d.toLocaleDateString('es-ES',{timeZone:'Europe/Madrid'});
    const hora = d.toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid', hour:'2-digit', minute:'2-digit'});
    html += `<tr>
      <td>${fecha}</td><td>${hora}</td>
      <td>${esc(r.tipoLabel)}</td>
      <td>${esc(r.referenciaAmbito)}</td>
      <td>${esc(r.subtipo)}</td>
      <td>${esc(r.numeroEmpleado||'')}</td>
      <td>${esc(r.operario||'')}</td>
      <td>${esc(r.detalle||'')}</td>
      <td>${esc(r.referencia||'')}</td>
      <td>${esc(r.ubicacion||'')}</td>
      <td class="obs-cell">${esc(r.observaciones||'')}</td>
      <td>${r.adjuntoUrl?(r.adjuntoTipo==='foto'?`<img class="hist-thumb" src="${esc(r.adjuntoUrl)}">`:`<a class="pdf-btn" href="${esc(r.adjuntoUrl)}" target="_blank" rel="noopener">📄</a>`):''}</td>
      <td>${r.sourceTable&&r.sourceId?`<button class="icon-btn" data-doc-evento="${r.sourceTable}|${r.sourceId}" title="Generar documento imprimible">📄</button><button class="icon-btn" data-delete-evento="${r.sourceTable}|${r.sourceId}" title="Eliminar registro">🗑</button>`:''}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

async function borrarEventoHistorial(sourceTable, id){
  const h = state.historial;
  const relacionadas = h.all.filter(r=>r.sourceTable===sourceTable && r.sourceId===id).length;
  const msg = relacionadas>1
    ? `¿Eliminar este registro completo? Incluye ${relacionadas} líneas (tareas/repuestos) y no se puede deshacer.`
    : '¿Eliminar este registro? Esta acción no se puede deshacer.';
  if(!confirm(msg)) return;
  const { error } = await sb.from(sourceTable).delete().eq('id', id);
  if(error){ toast('Error al eliminar: '+error.message, 'error'); return; }
  h.all = h.all.filter(r=>!(r.sourceTable===sourceTable && r.sourceId===id));
  state.misRegistros = null;
  drawHistorial();
  toast('Registro eliminado','success');
}

/* ---------- Documentos imprimibles individuales (desde Historial) ---------- */
async function generarDocumentoHistorial(sourceTable, sourceId){
  const win = window.open('', '_blank');
  if(win) win.document.write('<p style="font-family:sans-serif;padding:24px;">Generando documento…</p>');
  try{
    if(sourceTable==='mant_registros'){
      const { data:r, error } = await sb.from('mant_registros').select('*, mant_registro_items(*)').eq('id', sourceId).single();
      if(error) throw error;
      escribirFichaArbol(win, r, r.mant_registro_items||[]);
    } else if(sourceTable==='mant_registros_simple'){
      const { data:r, error } = await sb.from('mant_registros_simple').select('*').eq('id', sourceId).single();
      if(error) throw error;
      escribirFichaSimple(win, r);
    } else if(sourceTable==='mant_extintor_revisiones'){
      const { data:r, error } = await sb.from('mant_extintor_revisiones').select('*, mant_extintor_revision_respuestas(*)').eq('id', sourceId).single();
      if(error) throw error;
      escribirFichaExtintorRevision(win, r);
    } else if(sourceTable==='mant_piezas3d_fabricacion'){
      const { data:r, error } = await sb.from('mant_piezas3d_fabricacion').select('*, mant_piezas3d_fabricacion_items(*)').eq('id', sourceId).single();
      if(error) throw error;
      const items = (r.mant_piezas3d_fabricacion_items||[]).map(it=>({ referencia: it.referencia_snapshot, cantidad: it.cantidad }));
      escribirDocumentoFabricacion(win, r, items);
    } else if(sourceTable==='mant_bastidor_registros'){
      const { data:r, error } = await sb.from('mant_bastidor_registros').select('*, mant_bastidor_registro_piezas(*)').eq('id', sourceId).single();
      if(error) throw error;
      escribirFichaBastidor(win, r, r.mant_bastidor_registro_piezas||[]);
    } else {
      if(win && !win.closed) win.close();
      toast('No se puede generar documento para este tipo de registro.','error');
    }
  }catch(e){
    if(win && !win.closed) win.close();
    toast('Error al generar el documento: '+e.message,'error');
  }
}

function escribirFichaArbol(win, r, items){
  const fecha = fmtFechaHora(r.ts);
  const estilos = fichaEstilosTabla();
  const ambitoLabel = r.ambito==='vehiculo' ? 'Vehículo' : 'Línea';
  const ambitoNombre = r.ambito==='vehiculo' ? (r.vehiculo_nombre||'') : (r.linea_codigo||'');
  const thead = '<tr><th>Elemento</th><th>Tarea</th><th>Repuesto</th></tr>';
  const rows = (items.length?items:[null]).map(it=>
    `<tr><td>${esc(it?it.elemento_nombre:'')}</td><td>${esc(it?it.tarea_nombre:'')}</td><td>${esc(it&&it.referencia?it.referencia:'—')}</td></tr>`
  ).join('');
  const bodyHtml = `<h1>Mantenimiento de ${esc(ambitoLabel.toLowerCase())}</h1>
    <div class="meta">${esc(ambitoLabel)}: ${esc(ambitoNombre)} · Tipo: ${r.tipo==='correctivo'?'Correctivo':'Preventivo'} · Fecha: ${esc(fecha)} · Operario: ${esc(r.trabajador_nombre||'')}</div>
    <table><thead>${thead}</thead><tbody>${rows}</tbody></table>
    ${r.observaciones?`<div style="margin-top:14px;font-size:12px;"><b>Observaciones:</b> ${esc(r.observaciones)}</div>`:''}`;
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ficha de mantenimiento</title><style>${estilos}</style></head><body>${bodyHtml}<script>window.onload=function(){window.print();};<\/script></body></html>`);
  win.document.close();
}

function escribirFichaSimple(win, r){
  const fecha = fmtFechaHora(r.ts);
  const estilos = fichaEstilosTabla();
  const esCarretillaExterna = r.tipo==='carretillas_externo';
  const esCarretillaAgua = r.tipo==='carretillas_agua';
  const esCarretilla = esCarretillaExterna || esCarretillaAgua;
  const tituloTipo = tipoMantLabel(esCarretilla?'carretillas':r.tipo);
  const subtitulo = r.subtipo ? subtipoLabelFor(r.tipo, r.subtipo)
    : esCarretillaExterna ? ('Externo'+(r.empresa_externa?(' · '+r.empresa_externa):''))
    : esCarretillaAgua ? 'Rellenado de agua de baterías'
    : (r.empresa_externa?('Empresa: '+r.empresa_externa):'');
  let bodyHtml = `<h1>${esc(tituloTipo)}</h1><div class="meta">Fecha: ${esc(fecha)} · Operario: ${esc(r.trabajador_nombre||'')}</div>`;
  if(esCarretilla && r.referencia_nombre) bodyHtml += `<div class="row"><span class="label">Vehículo:</span> ${esc(r.referencia_nombre)}</div>`;
  if(r.titulo) bodyHtml += `<div class="row"><span class="label">Título:</span> ${esc(r.titulo)}</div>`;
  if(subtitulo) bodyHtml += `<div class="row"><span class="label">Detalle:</span> ${esc(subtitulo)}</div>`;
  if(r.descripcion) bodyHtml += `<div class="row"><span class="label">Descripción:</span> ${esc(r.descripcion)}</div>`;
  if(r.pdf_url) bodyHtml += `<div class="row"><span class="label">Adjunto:</span> <a href="${esc(r.pdf_url)}" target="_blank">Ver PDF</a></div>`;
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ficha de mantenimiento</title><style>${estilos}</style></head><body>${bodyHtml}<script>window.onload=function(){window.print();};<\/script></body></html>`);

}

function escribirFichaExtintorRevision(win, r){

function escribirFichaBastidor(win, r, piezas){
  const fecha = fmtFechaHora(r.ts);
  const estilos = fichaEstilosTabla();

  let bodyHtml = `<h1>Mantenimiento de bastidor</h1>
    <div class="meta">Bastidor: ${esc(r.bastidor_nombre||'')} · ${esc(partes.join(' + ')||'—')} · Fecha: ${esc(fecha)} · Operario: ${esc(r.trabajador_nombre||'')}</div>`;

    const rows = piezas.map(p=>`<tr><td>${esc(p.referencia_snapshot||'')}</td><td>${esc(p.cantidad)}</td></tr>`).join('');
    bodyHtml += `<table><thead><tr><th>Repuesto</th><th>Cantidad</th></tr></thead><tbody>${rows}</tbody></table>`;

  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ficha de bastidor</title><style>${estilos}</style></head><body>${bodyHtml}<script>window.onload=function(){window.print();};<\/script></body></html>`);
  win.document.close();
}

function exportCSV(rows){
  const lines = [['Fecha','Hora','Tipo','Referencia','Subtipo','Nº empleado','Operario','Detalle','Ref. repuesto','Ubicacion','Observaciones','Adjunto'].join(';')];
  rows.forEach(r=>{
    const d = new Date(r.ts);
    const fecha = d.toLocaleDateString('es-ES',{timeZone:'Europe/Madrid'});
    const hora = d.toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid'});
    lines.push([fecha,hora,r.tipoLabel,r.referenciaAmbito,r.subtipo,r.numeroEmpleado||'',r.operario||'',r.detalle||'',r.referencia||'',r.ubicacion||'',r.observaciones||'',r.adjuntoUrl||''].map(csvEsc).join(';'));
  });
  const csv = '﻿'+lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mantenimientos_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEsc(v){ v = String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }

function drawCatalogo(){

  const catLabels = {lineas:'Líneas', elementos:'Elementos', tareas:'Árbol de tareas', vehiculos:'Vehículos', extintores:'Extintores', repuestos:'Repuestos', bastidores:'Bastidores', piezas3d:'Piezas 3D'};

  else if(state.catalogoTab==='elementos') html += drawCatElementos();
  else if(state.catalogoTab==='tareas') html += drawCatTareas();

function drawCatTareas(){
  const c = state.catalogo;

function buildTareaTreeAdmin(tareas){
  const byId = {};
  tareas.forEach(t=> byId[t.id]=Object.assign({}, t, {children:[]}));
  const roots=[];
  tareas.forEach(t=>{ if(t.parent_id && byId[t.parent_id]) byId[t.parent_id].children.push(byId[t.id]); else roots.push(byId[t.id]); });
  const sortRec = arr => { arr.sort((a,b)=>(a.orden||0)-(b.orden||0)); arr.forEach(n=>sortRec(n.children)); };
  sortRec(roots);
  return roots;
}

function bindCatalogoEvents(){
  const c = state.catalogo;
  document.querySelectorAll('[data-ctab]').forEach(b=>{
    b.onclick = ()=>{ state.catalogoTab = b.dataset.ctab; c.elementoSel=null; c.editingTareaId=null; c.addingSubTo=null; c.vehiculoSel=null; c.repuestoEditId=null; c.bastidorSel=null; c.bastidorEditId=null; c.piezaEditId=null; drawCatalogo(); };
  });

  const btnAddLinea = document.getElementById('btn-add-linea');
  if(btnAddLinea) btnAddLinea.onclick = async ()=>{
    const codigo = document.getElementById('nl-codigo').value.trim();
    const nombre = document.getElementById('nl-nombre').value.trim();
    if(!codigo){ toast('Introduce un código de línea','error'); return; }
    const { error } = await sb.from('mant_lineas').insert({ codigo, nombre: nombre||null });
    if(error){ toast('Error: '+error.message,'error'); return; }
    c.lineas = null; state.wizard=null;
    await ensureCatalogoLoaded(); drawCatalogo();
    toast('Línea añadida','success');
  };
  document.querySelectorAll('[data-toggle-linea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.toggleLinea;
      const l = c.lineas.find(x=>x.id===id);
      const { error } = await sb.from('mant_lineas').update({ activo: !l.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      l.activo = !l.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-linea]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.deleteLinea;
      const l = c.lineas.find(x=>x.id===id);
      if(!confirm('¿Eliminar la línea "'+l.codigo+'"? Esta acción no se puede deshacer.')) return;

      if(upErr){ toast('Error subiendo foto: '+upErr.message,'error'); btnAddBastidor.disabled=false; btnAddBastidor.textContent='+ Añadir bastidor'; return; }
      const { data:pub } = sb.storage.from('mant-fotos').getPublicUrl(path);
      foto_url = pub.publicUrl;
    }
    const { error } = await sb.from('mant_bastidores').insert({
      nombre, stock: stockRaw===''?null:parseInt(stockRaw,10), foto_url,

  document.querySelectorAll('[data-cancel-edit-bastidor]').forEach(b=>{ b.onclick=()=>{ c.bastidorEditId=null; drawCatalogo(); }; });

      const id = b.dataset.saveBastidor;

        foto_url = pub.publicUrl;
      }
      const payload = { nombre, stock: stockRaw===''?null:parseInt(stockRaw,10) };
      if(foto_url) payload.foto_url = foto_url;
      const { error } = await sb.from('mant_bastidores').update(payload).eq('id', id);

  document.querySelectorAll('[data-manage-bastidor]').forEach(b=>{
    b.onclick = ()=>{ c.bastidorSel = (c.bastidorSel===b.dataset.manageBastidor)?null:b.dataset.manageBastidor; c.bastidorEditId=null; drawCatalogo(); };

  document.querySelectorAll('[data-add-documento]').forEach(b=>{

      b.disabled = true; b.textContent='Subiendo…';

      const path = 'bastidores/'+bastidorId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.pdf';

      if(upErr){ toast('Error subiendo PDF: '+upErr.message,'error'); b.disabled=false; b.textContent='+ Añadir PDF'; return; }
      const { data:pub } = sb.storage.from('mant-pdfs').getPublicUrl(path);
      const { data, error } = await sb.from('mant_bastidor_documentos').insert({ bastidor_id: bastidorId, nombre: nombre||null, pdf_url: pub.publicUrl }).select().single();
      if(error){ toast('Error: '+error.message,'error'); b.disabled=false; b.textContent='+ Añadir PDF'; return; }
      c.bastidorDocumentos.push(data);
      drawCatalogo();
      toast('Documento añadido','success');
    };
  });
  document.querySelectorAll('[data-delete-documento]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Eliminar este documento?')) return;
      const id = b.dataset.deleteDocumento;
      const { error } = await sb.from('mant_bastidor_documentos').delete().eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      c.bastidorDocumentos = c.bastidorDocumentos.filter(d=>d.id!==id);
      drawCatalogo();
      toast('Documento eliminado','success');
    };
  });
  document.querySelectorAll('[data-toggle-bastidor-pieza]').forEach(b=>{
    b.onclick = async ()=>{
      const [bastidorId, piezaId] = b.dataset.toggleBastidorPieza.split('|');

      if(existing){
        await sb.from('mant_bastidor_piezas').delete().eq('bastidor_id',bastidorId).eq('pieza_id',piezaId);
        c.bastidorPiezas = c.bastidorPiezas.filter(bp=>!(bp.bastidor_id===bastidorId && bp.pieza_id===piezaId));
      } else {
        const { data, error } = await sb.from('mant_bastidor_piezas').insert({ bastidor_id: bastidorId, pieza_id: piezaId }).select().single();
        if(error){ toast('Error: '+error.message,'error'); return; }
        c.bastidorPiezas.push({ id:data.id, bastidor_id:bastidorId, pieza_id:piezaId });
      }
      state.wizard=null;
      drawCatalogo();
    };
  });
  document.querySelectorAll('[data-reponer-bastidor]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.reponerBastidor;
      const input = document.getElementById('bst-'+id);
      const cantidad = parseInt(input.value,10);
      if(!cantidad || cantidad<1){ toast('Introduce una cantidad válida','error'); return; }
      const item = c.bastidores.find(x=>x.id===id);
      const nuevoStock = (item.stock||0) + cantidad;
      const { error } = await sb.from('mant_bastidores').update({ stock: nuevoStock }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      item.stock = nuevoStock;
      drawCatalogo();
      toast('Stock repuesto','success');
    };
  });
  document.querySelectorAll('[data-toggle-bastidor]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.toggleBastidor; const bst=c.bastidores.find(x=>x.id===id);
      const { error } = await sb.from('mant_bastidores').update({ activo: !bst.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      bst.activo=!bst.activo; state.wizard=null; drawCatalogo();
    };
  });
  document.querySelectorAll('[data-delete-bastidor]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.deleteBastidor; const bst=c.bastidores.find(x=>x.id===id);
      if(!confirm('¿Eliminar el bastidor "'+bst.nombre+'"? Esta acción no se puede deshacer.')) return;
      const { error } = await sb.from('mant_bastidores').delete().eq('id', id);
      if(error){
        if(error.code==='23503'){ toast('No se puede eliminar: este bastidor tiene registros de mantenimiento guardados. Desactívalo en su lugar.','error'); }
        else { toast('Error: '+error.message,'error'); }
        return;
      }
      c.bastidores = c.bastidores.filter(x=>x.id!==id);
      c.bastidorDocumentos = (c.bastidorDocumentos||[]).filter(d=>d.bastidor_id!==id);
      c.bastidorPiezas = (c.bastidorPiezas||[]).filter(bp=>bp.bastidor_id!==id);
      if(c.bastidorSel===id) c.bastidorSel=null;
      state.wizard=null; state.historial=null;
      drawCatalogo();
      toast('Bastidor eliminado','success');
    };
  });
  document.querySelectorAll('[data-doc-fabricacion]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.docFabricacion;
      const fab = (c.producciones||[]).find(x=>x.id===id);
      if(!fab) return;
      const win = window.open('', '_blank');
      if(win) win.document.write('<p style="font-family:sans-serif;padding:24px;">Generando documento…</p>');
      const items = (fab.mant_piezas3d_fabricacion_items||[]).map(it=>({ referencia: it.referencia_snapshot, cantidad: it.cantidad }));
      if(win && !win.closed){ escribirDocumentoFabricacion(win, fab, items); }
      else { toast('El navegador bloqueó la ventana del documento.','error'); }
    };
  });

  // Piezas 3D
  const btnAddPieza = document.getElementById('btn-add-pieza');
  if(btnAddPieza) btnAddPieza.onclick = async ()=>{
    const referencia = document.getElementById('np-referencia').value.trim();
    const descripcion = document.getElementById('np-descripcion').value.trim();
    const stockRaw = document.getElementById('np-stock').value;
    const fotoInput = document.getElementById('np-foto');
    if(!referencia){ toast('Introduce una referencia','error'); return; }
    btnAddPieza.disabled = true; btnAddPieza.textContent='Guardando…';

    if(fotoInput.files && fotoInput.files[0]){
      const file = fotoInput.files[0];
      const ext = (file.name.split('.').pop()||'jpg');
      const path = 'piezas3d/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const { error:upErr } = await sb.storage.from('mant-fotos').upload(path, file);
      if(upErr){ toast('Error subiendo foto: '+upErr.message,'error'); btnAddPieza.disabled=false; btnAddPieza.textContent='+ Añadir pieza'; return; }
      const { data:pub } = sb.storage.from('mant-fotos').getPublicUrl(path);
      foto_url = pub.publicUrl;
    }
    const { error } = await sb.from('mant_piezas3d').insert({
      referencia, descripcion: descripcion||null, stock: stockRaw===''?null:parseInt(stockRaw,10), foto_url,
    });
    if(error){ toast('Error: '+error.message,'error'); btnAddPieza.disabled=false; btnAddPieza.textContent='+ Añadir pieza'; return; }
    c.piezas3d=null; await ensureCatalogoLoaded(); drawCatalogo();
    toast('Pieza añadida','success');
  };
  document.querySelectorAll('[data-edit-pieza]').forEach(b=>{
    b.onclick = ()=>{ c.piezaEditId = (c.piezaEditId===b.dataset.editPieza)?null:b.dataset.editPieza; drawCatalogo(); };
  });
  document.querySelectorAll('[data-cancel-edit-pieza]').forEach(b=>{ b.onclick=()=>{ c.piezaEditId=null; drawCatalogo(); }; });
  document.querySelectorAll('[data-save-pieza]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.savePieza;
      const referencia = document.getElementById('ep-referencia').value.trim();
      const descripcion = document.getElementById('ep-descripcion').value.trim();
      const stockRaw = document.getElementById('ep-stock').value;
      const fotoInput = document.getElementById('ep-foto');
      if(!referencia){ toast('Introduce una referencia','error'); return; }

      if(fotoInput.files && fotoInput.files[0]){
        const file = fotoInput.files[0];

        const path = 'piezas3d/'+id+'-'+Date.now()+'.'+ext;
        const { error:upErr } = await sb.storage.from('mant-fotos').upload(path, file, { upsert:true });
        if(upErr){ toast('Error subiendo foto: '+upErr.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }
        const { data:pub } = sb.storage.from('mant-fotos').getPublicUrl(path);
        foto_url = pub.publicUrl;
      }
      const payload = { referencia, descripcion: descripcion||null, stock: stockRaw===''?null:parseInt(stockRaw,10) };
      if(foto_url) payload.foto_url = foto_url;
      const { error } = await sb.from('mant_piezas3d').update(payload).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); b.disabled=false; b.textContent='Guardar'; return; }

      toast('Pieza actualizada','success');

  document.querySelectorAll('[data-toggle-pieza]').forEach(b=>{
    b.onclick = async ()=>{
      const id=b.dataset.togglePieza; const p=c.piezas3d.find(x=>x.id===id);
      const { error } = await sb.from('mant_piezas3d').update({ activo: !p.activo }).eq('id', id);
      if(error){ toast('Error: '+error.message,'error'); return; }
      p.activo=!p.activo; state.wizard=null; drawCatalogo();

  document.querySelectorAll('[data-delete-pieza]').forEach(b=>{

      }

  document.querySelectorAll('[data-reponer-pieza]').forEach(b=>{
    b.onclick = async ()=>{

      if(!cantidad || cantidad<1){ toast('Introduce una cantidad válida','error'); return; }
      const item = c.piezas3d.find(x=>x.id===id);

async function recargarTareas(elementoId){
  const { data } = await sb.from('mant_tareas').select('*').eq('elemento_id', elementoId).order('orden');
  state.catalogo.tareasPorElemento[elementoId] = data||[];
  drawCatalogo();
}

/* ============================================================
   TAB: ACCESOS (admin)
   ============================================================ */
async function renderTabAccesos(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="spinner"></div>';
  const [{data:trabs, error}, {data:permisos}] = await Promise.all([
    sb.from('trabajadores').select('*').order('numero_empleado'),
    sb.from('mant_tipos_permisos').select('*'),
  ]);
  if(error){ el.innerHTML = '<div class="card"><div class="error-box">No se pudo cargar la lista de trabajadores.</div></div>'; return; }
  state.accesos = trabs||[];
  state.accesosPermisos = permisos||[];
  drawAccesos();
}

function drawAccesos(){
  const el = document.getElementById('tab-content');
  const rows = state.accesos;
  let html = '<div class="card"><h2>Accesos y permisos de trabajadores</h2>';
  html += '<div class="hint" style="margin-bottom:12px;">Cada trabajador crea su propia contraseña la primera vez que entra con su número de empleado. Usa 🔧 para elegir qué tipos de mantenimiento puede registrar cada uno.</div>';
  html += '<table class="admin-table"><thead><tr><th>Nº</th><th>Nombre</th><th>Estado</th><th>Acceso</th><th></th></tr></thead><tbody>';
  rows.forEach(t=>{
    const tieneAcceso = !!t.auth_user_id;
    html += `<tr><td>${esc(t.numero_empleado)}</td><td>${esc(t.nombre)}</td>
      <td><span class="pill ${t.activo?'on':'off'}">${t.activo?'Activo':'Inactivo'}</span></td>
      <td><span class="pill ${tieneAcceso?'on':'off'}">${tieneAcceso?'Configurado':'Pendiente'}</span></td>
      <td>
        <button class="icon-btn" data-toggle-permisos="${t.id}" title="Tipos de mantenimiento">🔧</button>
        ${tieneAcceso?`<button class="btn btn-outline btn-sm" data-reset="${t.id}">Restablecer</button>`:''}
      </td></tr>`;
    if(state.accesosExpanded===t.id){
      const misPermisos = state.accesosPermisos.filter(p=>p.trabajador_id===t.id).map(p=>p.tipo);
      html += `<tr><td colspan="5" style="background:var(--steel-50);"><div class="chip-row" style="padding:10px 0;">`;
      html += TIPOS_MANTENIMIENTO.map(tm=>`<button class="chip-btn ${misPermisos.includes(tm.code)?'selected':''}" data-toggle-permiso="${t.id}|${tm.code}">${tm.icon} ${esc(tm.label)}</button>`).join('');
      html += `</div></td></tr>`;
    }
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
  document.querySelectorAll('[data-toggle-permisos]').forEach(b=>{
    b.onclick = ()=>{ state.accesosExpanded = state.accesosExpanded===b.dataset.togglePermisos ? null : b.dataset.togglePermisos; drawAccesos(); };
  });
  document.querySelectorAll('[data-toggle-permiso]').forEach(b=>{
    b.onclick = async ()=>{
      const [trabajadorId, tipo] = b.dataset.togglePermiso.split('|');
      const existing = state.accesosPermisos.find(p=>p.trabajador_id===trabajadorId && p.tipo===tipo);
      if(existing){
        await sb.from('mant_tipos_permisos').delete().eq('trabajador_id',trabajadorId).eq('tipo',tipo);
        state.accesosPermisos = state.accesosPermisos.filter(p=>!(p.trabajador_id===trabajadorId && p.tipo===tipo));
      } else {
        await sb.from('mant_tipos_permisos').insert({trabajador_id:trabajadorId, tipo});
        state.accesosPermisos.push({trabajador_id:trabajadorId, tipo});
      }
      drawAccesos();
    };
  });
  document.querySelectorAll('[data-reset]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('¿Restablecer el acceso de este trabajador? Tendrá que crear una contraseña nueva en su próximo inicio de sesión.')) return;
      const id = b.dataset.reset;
      const { error } = await sb.rpc('admin_resetear_trabajador', { p_trabajador_id: id });
      if(error){ toast('Error: '+error.message,'error'); return; }
      toast('Acceso restablecido','success');
      state.accesos=null; renderTabAccesos();
    };
  });
}

bootstrap();
