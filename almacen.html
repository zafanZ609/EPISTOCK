<style>
  :root{
    --steel-900:#111827; --steel-800:#1f2937; --steel-700:#374151; --steel-600:#4b5563;

    --amber:#f59e0b; --amber-dark:#b45309; --amber-50:#fffbeb;

    --shadow:0 1px 2px rgba(17,24,39,.06), 0 1px 3px rgba(17,24,39,.08);
    --shadow-lg:0 10px 25px -5px rgba(17,24,39,.15), 0 8px 10px -6px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--steel-100); color:var(--steel-900); -webkit-font-smoothing:antialiased; }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--steel-900) 0%,var(--steel-800) 45%,var(--steel-700) 100%);padding:24px;}
  .login-card{width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:32px 28px;}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
  .login-brand img{width:56px;height:56px;object-fit:contain;border-radius:10px;}
  .login-brand .empresa{font-size:12.5px;color:var(--steel-600);font-weight:600;letter-spacing:.02em;}
  .login-brand h1{font-size:22px;font-weight:800;margin:0;color:var(--steel-900);}
  .login-brand .sub{font-size:13px;color:var(--amber-dark);font-weight:600;background:var(--amber-50);padding:2px 10px;border-radius:999px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--steel-700);margin-bottom:6px;}
  .field input,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--steel-200);border-radius:9px;font-size:15px;color:var(--steel-900);outline:none;transition:border-color .15s;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:11px 18px;font-size:14.5px;font-weight:700;transition:filter .15s, transform .05s;width:100%;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--steel-900);color:#fff;} .btn-primary:hover{filter:brightness(1.15);}
  .btn-amber{background:var(--amber);color:#1a1200;} .btn-amber:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--steel-600);} .btn-ghost:hover{background:var(--steel-100);}
  .btn-outline{background:#fff;color:var(--steel-800);border:1.5px solid var(--steel-200);} .btn-outline:hover{border-color:var(--steel-400);}
  .btn-danger{background:var(--red-50);color:var(--red);} .btn-danger:hover{filter:brightness(0.98);}

  .hint{font-size:12px;color:var(--steel-400);margin-top:4px;}

  header.topbar{background:var(--steel-900);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow);}
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-left img{width:32px;height:32px;border-radius:7px;object-fit:contain;background:#fff;}

  .topbar-titles .app-name{font-weight:800;font-size:15px;}

  .topbar-right{display:flex;align-items:center;gap:10px;}

  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .card h2{font-size:15.5px;margin:0 0 14px;font-weight:700;color:var(--steel-900);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--steel-900);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:100;display:flex;align-items:center;gap:8px;}
  .toast.error{background:var(--red);} .toast.success{background:var(--green);}

  .empty-state{text-align:center;padding:40px 20px;color:var(--steel-400);font-size:13.5px;}
  .spinner{width:26px;height:26px;border:3px solid var(--steel-200);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .center-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  .foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin:14px 0;}

  .foto-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .foto-thumb .del{position:absolute;top:4px;right:4px;background:rgba(17,24,39,.75);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;}
  .foto-thumb .estado{position:absolute;bottom:0;left:0;right:0;font-size:10px;font-weight:700;text-align:center;padding:3px 2px;color:#fff;background:rgba(17,24,39,.65);}

  .add-foto-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--steel-400);border-radius:9px;aspect-ratio:3/4;color:var(--steel-600);font-size:11px;font-weight:700;background:var(--steel-50);}
  .add-foto-tile:hover{border-color:var(--amber);color:var(--amber-dark);}
  .add-foto-tile .plus{font-size:26px;line-height:1;}

  .progress-bar{height:8px;border-radius:999px;background:var(--steel-200);overflow:hidden;margin:10px 0;}
  .progress-bar > div{height:100%;background:var(--amber);transition:width .2s;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.admin-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel-400);padding:8px 8px;border-bottom:1.5px solid var(--steel-200);white-space:nowrap;}
  table.admin-table td{padding:8px 8px;border-bottom:1px solid var(--steel-100);vertical-align:top;}
  .table-scroll{overflow-x:auto;}
  tr.row-dup td{background:var(--amber-50);}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;display:inline-block;}
  .badge.dup{background:var(--amber-50);color:var(--amber-dark);}
  .badge.err{background:var(--red-50);color:var(--red);}
  .badge.ok{background:#f0fdf4;color:var(--green);}
  .filters-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filters-row select,.filters-row input{padding:8px 10px;border:1.5px solid var(--steel-200);border-radius:8px;font-size:13px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}

  .descarga-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--steel-200);border-radius:10px;margin-bottom:9px;background:#fff;text-align:left;width:100%;}
  .descarga-item:hover{border-color:var(--steel-400);}
  .descarga-item .nombre{font-weight:700;font-size:14px;color:var(--steel-900);}
  .descarga-item .meta{font-size:12px;color:var(--steel-400);margin-top:2px;}
  .descarga-item .chevron{color:var(--steel-400);font-size:18px;}
  .doc-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--blue);background:#eff6ff;padding:2px 8px;border-radius:999px;}

  .detalle-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .back-link{background:none;border:none;color:var(--amber-dark);font-weight:700;font-size:12.5px;padding:0;margin-bottom:10px;}
  .doc-transporte-box{border:1.5px dashed var(--steel-200);border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .doc-transporte-box img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--steel-200);}
  .doc-transporte-box a.ver{font-size:12.5px;font-weight:700;color:var(--blue);}

  /* ---------- Áreas de Almacén ---------- */
  .area-switch{display:flex;gap:8px;padding:10px 12px 0;background:#fff;border-bottom:1px solid var(--steel-200);}
  .area-switch button{flex:1;padding:10px;margin-bottom:10px;border-radius:9px;border:1.5px solid var(--steel-200);background:#fff;font-weight:700;font-size:13px;color:var(--steel-700);}
  .area-switch button.active{background:var(--steel-900);color:#fff;border-color:var(--steel-900);}
  .stock-ref-card{border:1px solid var(--steel-200);border-radius:10px;padding:12px;margin-bottom:9px;}
  .stock-ref-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .cap-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
  .cap-row label{flex:1;font-size:13px;color:var(--steel-700);}
  .cap-row input{width:90px;padding:7px 8px;border:1.5px solid var(--steel-200);border-radius:7px;font-size:13px;}
  .chip-cap{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:var(--steel-100);color:var(--steel-700);padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0;}

  @media (max-width:520px){ .login-card{padding:26px 20px;} .topbar-titles .empresa-name{max-width:140px;} }
</style>

<body>
<div id="app"><div class="center-loading"><div class="spinner"></div></div></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://tqquotgibizuqtcufknu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcXVvdGdpYml6dXF0Y3Vma251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY2MzEsImV4cCI6MjEwMzM2MjYzMX0.pz7hiQu301-h2jeHkp0KXKqA9D7NW490QP1xVDgk3H0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const EDGE_FN_URL = `${SUPABASE_URL}/functions/v1/alm-extraer-etiqueta`;

const COLUMNS = [
  ['tipo_documento','Tipo documento'], ['producto','Producto / Denominación'], ['referencia','Referencia'],
  ['variante','Variante'], ['cantidad','Cantidad'], ['ua','UA'], ['turno','Turno'],
  ['fecha_etiqueta','Fecha'], ['lote','Nº Lote'], ['fabricante','Fabricante'], ['cliente','Cliente'], ['notas','Notas'],
];
const CONCURRENCIA = 4;

/* ============================================================
   STATE
   ============================================================ */
const state = {
  ready:false, session:null, perfil:null, trabajador:null, empresa:null,
  loginMode:'trabajador', loginStep:'numero', loginNumero:'', loginNombrePreview:'', loginError:'', loginLoading:false,
  tab:'nueva',
  area:'recepcion', // 'recepcion' | 'stock'
  nuevaDescarga:{ nombre:'', notas:'', docFile:null, docPreviewUrl:null, descargaId:null, _creando:null },
  cola:[],
  activeWorkers:0, finalizando:false,
  misDescargas:null,
  catalogoDescargas:null, catalogoFiltros:{ texto:'', desde:'', hasta:'' },
  detalle:null,
  // --- Stock de almacén ---
  stockCatalogo:null,
  stockNuevaRefForm:null,
  stockDraft:{ items:[] },
  stockVistaRecuento:'draft',
  misRecuentos:null,
  adminRecuentos:null,
  detalleRecuento:null,
};

/* ============================================================
   UTILS
   ============================================================ */
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtFecha(iso){ try{ const d=new Date(iso); return d.toLocaleDateString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return iso; } }
function fmtFechaHora(iso){ try{ const d=new Date(iso); return d.toLocaleString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
function toast(msg,type){ const el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function comprimirImagen(file, maxDim=1400, calidad=0.82){
  return new Promise((resolve,reject)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width,height} = img;
      if(width>height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
      else if(height>=width && height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
      const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      canvas.toBlob(blob=>{ URL.revokeObjectURL(url); if(!blob){ reject(new Error('No se pudo procesar la imagen')); return; } resolve(blob); }, 'image/jpeg', calidad);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function subirDocumentoTransporte(descargaId, file){
  const comprimida = await comprimirImagen(file, 2000, 0.88);
  const nombre = (file.name||'documento.jpg').replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `documentos/${descargaId}-${Date.now()}-${nombre}`;
  const { error: upErr } = await sb.storage.from('alm-fotos').upload(path, comprimida, { contentType:'image/jpeg' });
  if(upErr) throw upErr;
  const { data: pub } = sb.storage.from('alm-fotos').getPublicUrl(path);
  const { error: updErr } = await sb.from('alm_descargas').update({ documento_transporte_url: pub.publicUrl }).eq('id', descargaId);
  if(updErr) throw updErr;
  return pub.publicUrl;
}

/* ============================================================
   AUTH / BOOTSTRAP
   ============================================================ */
async function loadEmpresa(){
  try{ const {data} = await sb.from('empresa_config').select('*').eq('id',1).maybeSingle(); state.empresa = data || null; }
  catch(e){ state.empresa = null; }
}
async function loadPerfilYTrabajador(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ state.perfil=null; state.trabajador=null; return; }
  const { data:perfil } = await sb.from('perfiles').select('rol, trabajador_id').eq('id', user.id).maybeSingle();
  state.perfil = perfil || null;
  if(perfil && perfil.trabajador_id){
    const { data:trab } = await sb.from('trabajadores').select('id, numero_empleado, nombre').eq('id', perfil.trabajador_id).maybeSingle();
    state.trabajador = trab || null;
  } else { state.trabajador = null; }
}
async function bootstrap(){
  await loadEmpresa();
  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  if(session){ await loadPerfilYTrabajador(); }
  state.ready = true; render();
}
sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if(session){ await loadPerfilYTrabajador(); }
  else { state.perfil=null; state.trabajador=null; state.loginStep='numero'; state.loginMode='trabajador'; state.loginNumero=''; state.loginError=''; }
  render();
});
async function logout(){ await sb.auth.signOut(); state.tab='nueva'; }

async function onContinuarNumero(){
  const numero = (document.getElementById('in-numero').value||'').trim();
  if(!numero){ state.loginError='Introduce tu número de empleado.'; render(); return; }
  state.loginNumero = numero; state.loginLoading=true; state.loginError=''; render();
  try{
    const { data, error } = await sb.rpc('trabajador_estado', { p_numero_empleado: numero });
    state.loginLoading=false;
    if(error){ state.loginError='No se pudo comprobar el número de empleado.'; render(); return; }
    if(!data || !data.existe){ state.loginError='Número de empleado no encontrado o inactivo.'; render(); return; }
    state.loginNombrePreview = data.nombre || '';
    state.loginStep = data.tiene_password ? 'password' : 'crear';
    render();
  }catch(e){ state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render(); }
}
async function onCrearPassword(){
  const p1=document.getElementById('in-pass1').value, p2=document.getElementById('in-pass2').value;
  if(!p1||p1.length<6){ state.loginError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(p1!==p2){ state.loginError='Las contraseñas no coinciden.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  try{
    const { data:signUpData, error:signUpErr } = await sb.auth.signUp({ email, password:p1 });
    if(signUpErr){ state.loginLoading=false; state.loginError = signUpErr.message.includes('already') ? 'Ya existe una cuenta para este número de empleado.' : signUpErr.message; render(); return; }
    const { error:vincErr } = await sb.rpc('vincular_trabajador', { p_numero_empleado: state.loginNumero });
    if(vincErr){ state.loginLoading=false; state.loginError='No se pudo vincular tu cuenta: '+vincErr.message; render(); return; }
    if(!signUpData.session){
      const { error:signInErr } = await sb.auth.signInWithPassword({ email, password:p1 });
      if(signInErr){ state.loginLoading=false; state.loginError=signInErr.message; render(); return; }
    }
    state.loginLoading=false;
  }catch(e){ state.loginLoading=false; state.loginError='Error de conexión. Inténtalo de nuevo.'; render(); }
}
async function onEntrarPassword(){
  const pass=document.getElementById('in-pass').value;
  if(!pass){ state.loginError='Introduce tu contraseña.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const email = `empleado-${state.loginNumero}@epistock.local`;
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  state.loginLoading=false;
  if(error){ state.loginError='Contraseña incorrecta.'; render(); return; }
}
async function onAdminEntrar(){
  const email=(document.getElementById('in-email').value||'').trim(), pass=document.getElementById('in-adminpass').value;
  if(!email||!pass){ state.loginError='Introduce email y contraseña.'; render(); return; }
  state.loginLoading=true; state.loginError=''; render();
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  state.loginLoading=false;
  if(error){ state.loginError='Credenciales incorrectas.'; render(); return; }
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!state.ready){ app.innerHTML='<div class="center-loading"><div class="spinner"></div></div>'; return; }
  if(!state.session){ app.innerHTML=renderLogin(); bindLoginEvents(); return; }
  if(!state.perfil){ app.innerHTML='<div class="center-loading"><div class="spinner"></div></div>'; return; }
  app.innerHTML = renderShell(); bindShellEvents();
}

/* ============================================================
   LOGIN VIEW
   ============================================================ */

        <button class="btn btn-amber" id="btn-crear" ${state.loginLoading?'disabled':''}>${state.loginLoading?'Creando acceso…':'Crear acceso y entrar'}</button>
        <div class="login-alt"><button id="btn-volver">Volver</button></div>`;
    } else if(state.loginStep==='password'){
      body = `
        <div class="field"><label>Contraseña</label><input id="in-pass" type="password" autofocus></div>
        ${state.loginError?`<div class="error-box">${esc(state.loginError)}</div>`:''}
        <button class="btn btn-primary" id="btn-entrar" ${state.loginLoading?'disabled':''}>${state.loginLoading?'Entrando…':'Entrar'}</button>

function bindLoginEvents(){
  const $ = id => document.getElementById(id);
  if(state.loginMode==='trabajador' && state.loginStep==='numero'){
    $('btn-modo-admin').onclick=()=>{ state.loginMode='admin'; state.loginError=''; render(); };
    $('btn-continuar').onclick=onContinuarNumero;
    $('in-numero').addEventListener('keydown', e=>{ if(e.key==='Enter') onContinuarNumero(); });
    $('in-numero').oninput=e=> state.loginNumero=e.target.value;
  } else if(state.loginMode==='trabajador' && state.loginStep==='crear'){
    $('btn-volver').onclick=()=>{ state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-crear').onclick=onCrearPassword;
  } else if(state.loginMode==='trabajador' && state.loginStep==='password'){
    $('btn-volver').onclick=()=>{ state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-entrar').onclick=onEntrarPassword;
    $('in-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') onEntrarPassword(); });
  } else if(state.loginMode==='admin'){
    $('btn-modo-trabajador').onclick=()=>{ state.loginMode='trabajador'; state.loginStep='numero'; state.loginError=''; render(); };
    $('btn-admin-entrar').onclick=onAdminEntrar;
  }
}

/* ============================================================
   SHELL
   ============================================================ */
function availableTabs(){
  const tabs = [];
  if(state.area === 'recepcion'){
    if(state.trabajador){ tabs.push(['nueva','Nueva descarga'], ['mis','Mis registros']); }
    if(state.perfil.rol==='admin'){ tabs.push(['catalogo','Catálogo']); }
  } else {
    if(state.trabajador){ tabs.push(['stock_nuevo','Nuevo recuento'], ['stock_mis','Mis recuentos']); }
    if(state.perfil.rol==='admin'){ tabs.push(['stock_referencias','Referencias'], ['stock_recuentos','Recuentos']); }
  }
  return tabs;
}
function renderShell(){
  const empresa = state.empresa;
  const logo = empresa && empresa.logo_url ? `<img src="${esc(empresa.logo_url)}" alt="logo">` : '';
  const nombreEmpresa = empresa ? esc(empresa.nombre) : '';
  const who = state.trabajador ? `${esc(state.trabajador.nombre)} · Nº ${esc(state.trabajador.numero_empleado)}` : (state.perfil.rol==='admin' ? 'Administrador' : '');
  const tabs = availableTabs();
  if(!tabs.find(t=>t[0]===state.tab)) state.tab = tabs.length ? tabs[0][0] : null;
  return `
    <header class="topbar">
      <div class="topbar-left">${logo}
        <div class="topbar-titles"><div class="app-name">Almacén</div>${nombreEmpresa?`<div class="empresa-name">${nombreEmpresa}</div>`:''}</div>
      </div>
      <div class="topbar-right"><div class="user-chip"><span class="dot"></span>${esc(who)}</div>
        <button class="logout-btn" id="btn-logout">Salir</button></div>
    </header>
    <div class="area-switch">
      <button data-area="recepcion" class="${state.area==='recepcion'?'active':''}">Recepción de materiales</button>
      <button data-area="stock" class="${state.area==='stock'?'active':''}">Stock de almacén</button>
    </div>
    <nav class="tabs">${tabs.map(([key,label])=>`<button data-tab="${key}" class="${state.tab===key?'active':''}">${label}</button>`).join('')}</nav>
    <main class="content" id="tab-content"><div class="spinner"></div></main>`;
}
function bindShellEvents(){
  document.getElementById('btn-logout').onclick = logout;
  document.querySelectorAll('.area-switch button').forEach(btn=>{
    btn.onclick = ()=>{ state.area = btn.dataset.area; state.tab=null; state.detalle=null; state.detalleRecuento=null; render(); };
  });
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.onclick=()=>{ state.tab=btn.dataset.tab; state.detalle=null; state.detalleRecuento=null; renderTab(); };
  });
  renderTab();
}
function renderTab(){
  document.querySelectorAll('nav.tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab===state.tab));
  const map = {
    nueva:renderTabNueva, mis:renderTabMis, catalogo:renderTabCatalogo,
    stock_nuevo:renderTabStockNuevo, stock_mis:renderTabStockMis,
    stock_referencias:renderTabStockReferencias, stock_recuentos:renderTabStockRecuentos,
  };
  (map[state.tab] || renderTabNueva)();
}

/* ============================================================
   TAB: NUEVA DESCARGA
   ============================================================ */
function renderTabNueva(){
  const c = document.getElementById('tab-content');
  const nd = state.nuevaDescarga;
  const tiles = state.cola.map(item => `
    <div class="foto-thumb">

      ${item.estado==='ok' ? `<div class="estado ok">Extraída</div>` : ''}
      ${item.estado==='error' ? `<div class="estado err">Error</div>` : ''}
      ${(item.estado==='subiendo'||item.estado==='pendiente') ? `<div class="estado">Procesando…</div>` : ''}
    </div>`).join('');
  const enCurso = state.cola.filter(f=>f.estado==='pendiente'||f.estado==='subiendo').length;
  const okCount = state.cola.filter(f=>f.estado==='ok').length;
  const errCount = state.cola.filter(f=>f.estado==='error').length;
  c.innerHTML = `

      <div class="field"><label>Notas (opcional)</label>
        <textarea id="nd-notas" rows="2" placeholder="Cualquier incidencia o comentario sobre esta descarga…">${esc(nd.notas)}</textarea></div>
      <div class="field"><label>Foto del documento de transporte / albarán (opcional, se guarda de forma permanente)</label>

      </div>

      <div class="section-title" style="margin-top:16px">Fotos de etiquetas</div>
      <p class="hint" style="margin:-4px 0 4px;">Se van procesando solas según las añades. Puedes seguir haciendo fotos sin esperar. No se guardan, solo se usan para extraer los datos.</p>
      <div class="foto-grid">
        ${tiles}
        <label class="add-foto-tile">
          <span class="plus">＋</span><span>Añadir foto</span>
          <input type="file" accept="image/*" capture="environment" id="input-foto" style="display:none">
        </label>
      </div>
      <p class="hint">${okCount} extraídas${errCount?`, ${errCount} con error`:''}${enCurso?`, ${enCurso} procesando…`:''}</p>
      <button class="btn btn-amber" id="btn-finalizar" ${(state.cola.length===0 || state.finalizando) ? 'disabled':''}>
        ${state.finalizando ? 'Terminando…' : `Finalizar descarga`}
      </button>
      ${state.cola.length && !state.finalizando && enCurso===0 && okCount>0 ? `<div style="margin-top:10px"><button class="btn btn-outline" id="btn-nueva-limpiar">Empezar una descarga nueva</button></div>` : ''}
    </div>`;

  if(btnFin) btnFin.onclick = onFinalizarDescarga;
  const btnLimpiar = document.getElementById('btn-nueva-limpiar');

function onAddFoto(e){
  const file = e.target.files[0]; e.target.value='';
  if(!file) return;
  state.cola.push({ id:uid(), file, previewUrl:URL.createObjectURL(file), estado:'pendiente' });
  renderTabNueva();
  lanzarProcesamiento();
}
function onDelFoto(id){ state.cola = state.cola.filter(f=>f.id!==id); renderTabNueva(); }

// Crea la descarga en la base de datos la primera vez que hace falta
// (primera foto o al finalizar), y comparte la misma creación si llegan
// varias fotos casi a la vez.
function asegurarDescarga(){
  const nd = state.nuevaDescarga;
  if(nd.descargaId) return Promise.resolve(nd.descargaId);
  if(!nd._creando){
    nd._creando = (async ()=>{
      const { data, error } = await sb.from('alm_descargas').insert({
        trabajador_id: state.trabajador.id,
        numero_empleado: state.trabajador.numero_empleado,
        trabajador_nombre: state.trabajador.nombre,
        nombre: nd.nombre || null,
        notas: nd.notas || null,
      }).select().single();
      if(error) throw error;
      nd.descargaId = data.id;
      return data.id;
    })();
  }
  return nd._creando;
}

// Va lanzando el procesado de fotos pendientes sin bloquear la cola:
// como mucho CONCURRENCIA a la vez, y arranca la siguiente en cuanto una termina.
function lanzarProcesamiento(){
  while(state.activeWorkers < CONCURRENCIA){
    const item = state.cola.find(f=>f.estado==='pendiente');
    if(!item) break;
    item.estado = 'subiendo';
    state.activeWorkers++;
    procesarItemAsync(item).finally(()=>{
      state.activeWorkers--;
      lanzarProcesamiento();
    });
  }
  renderTabNueva();
}
async function procesarItemAsync(item){
  try{
    const descargaId = await asegurarDescarga();
    const accessToken = state.session.access_token;
    const comprimida = await comprimirImagen(item.file);
    const base64 = await blobToBase64(comprimida);
    const nombreArchivo = item.file.name || `foto-${item.id}.jpg`;
    const res = await fetch(EDGE_FN_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${accessToken}` },
      body: JSON.stringify({ sesion_id: descargaId, archivo_origen: nombreArchivo, image_base64: base64, media_type:'image/jpeg' }),
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'Error al extraer los datos'); }
    item.estado = 'ok';
  }catch(err){
    item.estado = 'error'; item.errorMsg = err.message || String(err);
  }
  renderTabNueva();
}

async function onFinalizarDescarga(){
  if(!state.cola.length) return;
  state.finalizando = true; renderTabNueva();

  // Espera a que terminen las fotos que sigan en curso (no bloquea nuevas
  // fotos añadidas antes de llegar aquí, solo espera a que acaben).
  while(state.cola.some(f=>f.estado==='pendiente'||f.estado==='subiendo')){
    await new Promise(r=>setTimeout(r, 300));
  }

  let descargaId;
  try{ descargaId = await asegurarDescarga(); }
  catch(e){ state.finalizando=false; toast('Error al crear la descarga: '+e.message,'error'); renderTabNueva(); return; }

  const nd = state.nuevaDescarga;
  await sb.from('alm_descargas').update({ nombre: nd.nombre||null, notas: nd.notas||null }).eq('id', descargaId);

  if(nd.docFile){
    try{ await subirDocumentoTransporte(descargaId, nd.docFile); }
    catch(e){ toast('No se pudo guardar el documento de transporte: '+e.message,'error'); }
  }

  try{ await sb.rpc('alm_marcar_duplicados', { p_sesion_id: descargaId }); }catch(e){ /* no crítico */ }

  const okCount = state.cola.filter(f=>f.estado==='ok').length;
  const errCount = state.cola.filter(f=>f.estado==='error').length;
  state.finalizando = false;
  toast(`Descarga finalizada: ${okCount} fotos extraídas${errCount?`, ${errCount} con error`:''}`, errCount?'error':'success');
  state.misDescargas = null;
  state.cola = []; state.nuevaDescarga = {nombre:'',notas:'',docFile:null,docPreviewUrl:null,descargaId:null,_creando:null};
  state.tab='mis'; state.detalle=null;
  render(); bindShellEvents();
  abrirDetalle(descargaId, 'mis');
}

/* ============================================================
   TAB: MIS REGISTROS
   ============================================================ */
async function renderTabMis(){
  if(state.detalle && state.detalle.origen==='mis'){ renderDetalle(); return; }
  const c = document.getElementById('tab-content');
  if(state.misDescargas===null){
    c.innerHTML = '<div class="spinner"></div>';
    const { data, error } = await sb.from('alm_descargas')
      .select('*, alm_fotos(count)')
      .eq('trabajador_id', state.trabajador.id)
      .order('created_at', { ascending:false }).limit(200);
    if(error){ toast('Error al cargar tus descargas: '+error.message,'error'); state.misDescargas=[]; }
    else state.misDescargas = data || [];
  }
  renderListaDescargas(state.misDescargas, 'mis', 'Mis registros');
}

/* ============================================================
   TAB: CATÁLOGO (admin)
   ============================================================ */
async function renderTabCatalogo(){
  if(state.detalle && state.detalle.origen==='catalogo'){ renderDetalle(); return; }
  const c = document.getElementById('tab-content');
  if(state.catalogoDescargas===null){
    c.innerHTML = '<div class="spinner"></div>';
    const { data, error } = await sb.from('alm_descargas')
      .select('*, alm_fotos(count)')
      .order('created_at', { ascending:false }).limit(500);
    if(error){ toast('Error al cargar el catálogo: '+error.message,'error'); state.catalogoDescargas=[]; }
    else state.catalogoDescargas = data || [];
  }
  const f = state.catalogoFiltros;
  let lista = state.catalogoDescargas.filter(d=>{
    if(f.desde && d.created_at < f.desde) return false;
    if(f.hasta && d.created_at > f.hasta+'T23:59:59') return false;
    if(f.texto){
      const t=f.texto.toLowerCase();
      if(!(d.nombre||'').toLowerCase().includes(t) && !(d.trabajador_nombre||'').toLowerCase().includes(t)) return false;
    }
    return true;
  });
  const c2 = document.getElementById('tab-content');
  c2.innerHTML = `
    <div class="card">
      <div class="toolbar"><h2 style="margin:0">Catálogo de descargas (${lista.length})</h2></div>
      <div class="filters-row">
        <input type="text" id="f-texto" placeholder="Buscar por nombre u operario…" value="${esc(f.texto)}" style="min-width:220px">
        <input type="date" id="f-desde" value="${esc(f.desde)}">
        <input type="date" id="f-hasta" value="${esc(f.hasta)}">
      </div>
      <div id="lista-descargas-slot"></div>
    </div>`;
  document.getElementById('f-texto').oninput = e=>{ state.catalogoFiltros.texto=e.target.value; renderTabCatalogo(); };
  document.getElementById('f-desde').onchange = e=>{ state.catalogoFiltros.desde=e.target.value; renderTabCatalogo(); };
  document.getElementById('f-hasta').onchange = e=>{ state.catalogoFiltros.hasta=e.target.value; renderTabCatalogo(); };
  pintarListaDescargasEn('lista-descargas-slot', lista, 'catalogo');
}

function renderListaDescargas(lista, origen, titulo){
  const c = document.getElementById('tab-content');
  c.innerHTML = `<div class="card"><h2>${titulo} (${lista.length})</h2><div id="lista-descargas-slot"></div></div>`;
  pintarListaDescargasEn('lista-descargas-slot', lista, origen);
}
function pintarListaDescargasEn(slotId, lista, origen){
  const slot = document.getElementById(slotId);
  if(!lista.length){ slot.innerHTML = '<div class="empty-state">Todavía no hay descargas registradas.</div>'; return; }
  slot.innerHTML = lista.map(d=>{
    const nFotos = (d.alm_fotos && d.alm_fotos[0] && d.alm_fotos[0].count) || 0;
    const nombre = d.nombre ? esc(d.nombre) : `Descarga del ${fmtFecha(d.created_at)}`;
    return `
      <button class="descarga-item" data-open="${d.id}">
        <div>
          <div class="nombre">${nombre}</div>
          <div class="meta">${fmtFechaHora(d.created_at)} · ${esc(d.trabajador_nombre)||'—'} · ${nFotos} etiqueta${nFotos===1?'':'s'}
            ${d.documento_transporte_url?'<span class="doc-chip">📄 Doc. transporte</span>':''}
            ${d.notas ? '<span class="doc-chip" style="color:var(--steel-600);background:var(--steel-100)">📝 Notas</span>' : ''}
          </div>
        </div>
        <span class="chevron">›</span>
      </button>`;
  }).join('');
  slot.querySelectorAll('[data-open]').forEach(b=> b.onclick = ()=> abrirDetalle(b.dataset.open, origen));
}

/* ============================================================
   DETALLE DE UNA DESCARGA
   ============================================================ */
async function abrirDetalle(id, origen){
  state.detalle = { id, origen, descarga:null, fotos:[], cargando:true };
  state.tab = origen; renderTab();
  const [{ data: descarga, error: e1 }, { data: fotos, error: e2 }] = await Promise.all([
    sb.from('alm_descargas').select('*').eq('id', id).single(),
    sb.from('alm_fotos').select('*').eq('sesion_id', id).order('ts', { ascending:true }),
  ]);
  if(e1 || !descarga){ toast('No se pudo abrir la descarga','error'); state.detalle=null; renderTab(); return; }
  state.detalle.descarga = descarga;
  state.detalle.fotos = fotos || [];
  state.detalle.cargando = false;
  renderDetalle();
}
function volverDeDetalle(){
  state.detalle = null;
  renderTab();
}
function renderDetalle(){
  const c = document.getElementById('tab-content');
  const det = state.detalle;
  if(!det || det.cargando){ c.innerHTML = '<div class="spinner"></div>'; return; }
  const d = det.descarga; const fotos = det.fotos;
  c.innerHTML = `
    <button class="back-link" id="btn-volver-detalle">← Volver</button>
    <div class="card">
      <div class="detalle-header">
        <div style="flex:1;min-width:220px">
          <label class="section-title">Nombre de la descarga</label>
          <input class="field" id="det-nombre" type="text" value="${esc(d.nombre||'')}" placeholder="Sin nombre — ${fmtFecha(d.created_at)}" style="width:100%;padding:9px 10px;border:1.5px solid var(--steel-200);border-radius:8px;font-size:14px;">
        </div>
        <button class="btn btn-outline btn-sm" id="btn-export-csv">Exportar CSV</button>
      </div>
      <p class="hint">${fmtFechaHora(d.created_at)} · Operario: ${esc(d.trabajador_nombre)||'—'} (Nº ${esc(d.numero_empleado)||'—'}) · ${fotos.length} etiqueta${fotos.length===1?'':'s'}</p>

      <div class="section-title" style="margin-top:16px">Resumen por referencia</div>
      ${renderResumenReferencia(fotos)}

      <div class="section-title" style="margin-top:16px">Documento de transporte / albarán</div>
      <div class="doc-transporte-box">
        ${d.documento_transporte_url ? `
          <img src="${esc(d.documento_transporte_url)}">

// Agrupa las etiquetas de la descarga por referencia: nº de cajas (nº de
// etiquetas de esa referencia) y cantidad total (suma del primer número
// que aparezca en el campo "cantidad" de cada etiqueta).
function resumenPorReferencia(fotos){
  const map = new Map();
  fotos.forEach(r=>{
    const ref = (r.referencia||'').trim() || '(sin referencia)';
    const match = (r.cantidad||'').match(/\d+/);
    const n = match ? parseInt(match[0],10) : 0;
    if(!map.has(ref)) map.set(ref, { cajas:0, cantidad:0 });
    const e = map.get(ref);
    e.cajas++; e.cantidad += n;
  });
  return Array.from(map.entries())
    .map(([referencia,v])=>({ referencia, cajas:v.cajas, cantidad:v.cantidad }))
    .sort((a,b)=> b.cajas - a.cajas);
}
function renderResumenReferencia(fotos){
  if(!fotos.length) return `<p class="hint" style="margin:0 0 4px">Sin etiquetas todavía.</p>`;
  const resumen = resumenPorReferencia(fotos);
  return `<div class="table-scroll"><table class="admin-table">
    <thead><tr><th>Referencia</th><th>Nº cajas</th><th>Cantidad total</th></tr></thead>
    <tbody>${resumen.map(r=>`<tr><td>${esc(r.referencia)}</td><td>${r.cajas}</td><td>${r.cantidad}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

async function guardarCabeceraDescarga(){
  const det = state.detalle;
  const nombre = document.getElementById('det-nombre').value.trim();

  const { error } = await sb.from('alm_descargas').update({ nombre: nombre||null, notas: notas||null }).eq('id', det.id);
  if(error){ toast('Error al guardar: '+error.message,'error'); return; }
  det.descarga.nombre = nombre||null; det.descarga.notas = notas||null;
  state.misDescargas=null; state.catalogoDescargas=null;

}
async function onCambiarDocumentoDetalle(e){
  const file = e.target.files[0]; if(!file) return;
  const det = state.detalle;
  toast('Subiendo documento…');
  try{
    const url = await subirDocumentoTransporte(det.id, file);
    det.descarga.documento_transporte_url = url;
    state.misDescargas=null; state.catalogoDescargas=null;
    toast('Documento guardado','success');
    renderDetalle();
  }catch(err){ toast('Error al subir el documento: '+err.message,'error'); }
}
function exportarCSV(fotos, descarga){
  const headers = ['Fecha', ...COLUMNS.map(c=>c[1])];
  const lines = [headers.join(';')];
  fotos.forEach(r=>{
    const vals = [fmtFechaHora(r.ts), ...COLUMNS.map(([key])=> (r[key]||'').toString().replace(/;/g,','))];
    lines.push(vals.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(';'));
  });
  const blob = new Blob(['\ufeff'+lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const nombreArchivo = (descarga.nombre || fmtFecha(descarga.created_at)).replace(/[^a-zA-Z0-9._-]+/g,'_');
  a.download = `almacen_${nombreArchivo}.csv`;
  a.click();
}

function bindFormReferenciaEvents(){
  const form = state.stockNuevaRefForm;
  document.getElementById('rf-referencia').oninput = e=> form.referencia = e.target.value;
  document.getElementById('rf-descripcion').oninput = e=> form.descripcion = e.target.value;
  document.querySelectorAll('[data-cap-idx]').forEach(inp=> inp.oninput = e=>{ form.capacidades[+inp.dataset.capIdx] = e.target.value; });
  document.querySelectorAll('[data-cap-del]').forEach(b=> b.onclick = ()=>{

    if(!form.capacidades.length) form.capacidades.push('');
    renderTabStockReferencias();
  });
  document.getElementById('btn-add-cap').onclick = ()=>{ form.capacidades.push(''); renderTabStockReferencias(); };
  document.getElementById('btn-guardar-ref').onclick = guardarReferencia;
  document.getElementById('btn-cancelar-ref').onclick = ()=>{ state.stockNuevaRefForm=null; renderTabStockReferencias(); };
}
async function guardarReferencia(){
  const form = state.stockNuevaRefForm;
  const referencia = form.referencia.trim();
  if(!referencia){ toast('La referencia es obligatoria','error'); return; }
  const capacidades = form.capacidades.map(c=>parseInt(c,10)).filter(n=>Number.isInteger(n) && n>0);
  try{
    let refId = form.id;
    if(refId){
      const { error } = await sb.from('alm_stock_referencias').update({ referencia, descripcion: form.descripcion||null }).eq('id', refId);
      if(error) throw error;
      const { error: delErr } = await sb.from('alm_stock_capacidades').delete().eq('referencia_id', refId);
      if(delErr) throw delErr;
    } else {
      const { data, error } = await sb.from('alm_stock_referencias').insert({ referencia, descripcion: form.descripcion||null }).select().single();
      if(error) throw error;
      refId = data.id;
    }
    if(capacidades.length){
      const rows = capacidades.map(capacidad=>({ referencia_id: refId, capacidad }));
      const { error: capErr } = await sb.from('alm_stock_capacidades').insert(rows);
      if(capErr) throw capErr;
    }
    toast('Referencia guardada','success');
    state.stockNuevaRefForm = null; state.stockCatalogo = null;
    renderTabStockReferencias();
  }catch(e){ toast('Error al guardar: '+(e.message.includes('duplicate')?'ya existe una referencia con ese código.':e.message),'error'); }
}

        (r.alm_stock_capacidades||[]).slice().sort((a,b)=>a.capacidad-b.capacidad).map(c=>`<span class="chip-cap">Caja de ${c.capacidad}</span>`).join('')
        || '<span class="hint">Sin capacidades definidas</span>'

    const caps = (r.alm_stock_capacidades||[]).slice().sort((a,b)=>a.capacidad-b.capacidad).map(c=>String(c.capacidad));

    if(!confirm('¿Eliminar esta referencia? Se perderán sus capacidades asociadas.')) return;

    if(error){ toast('Error al eliminar: '+error.message,'error'); return; }
    state.stockCatalogo = null; renderTabStockReferencias();
  });
}

function calcularTotalItem(item){
  const deCajas = item.capacidades.reduce((s,c)=> s + (parseInt(c.cajas,10)||0) * c.capacidad, 0);

}

  try{

      <h2>Recuento del ${fmtFechaHora(r.created_at)}</h2>
      <p class="hint">Operario: ${esc(r.trabajador_nombre)||'—'} (Nº ${esc(r.numero_empleado)||'—'})</p>
      <div class="table-scroll"><table class="admin-table">
        <thead><tr><th>Referencia</th><th>Desglose</th><th>Total unidades</th></tr></thead>
        <tbody>
          ${items.map(it=>`
            <tr>
              <td>${esc(it.referencia)}</td>
              <td>${(it.detalle||[]).map(d=>`${d.cajas}×${d.capacidad}`).join(' + ')}${it.picos?`${(it.detalle||[]).length?' + ':''}${it.picos} picos`:''}</td>
              <td><strong>${it.total}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
  document.getElementById('btn-volver-recuento').onclick = ()=>{ state.detalleRecuento=null; renderTab(); };
}

bootstrap();
</script>
</body>
